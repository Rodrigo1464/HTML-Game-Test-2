<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Imperivm">
<meta name="theme-color" content="#1a120b">
<title>Imperivm</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
  --hud:#1a120b; --hud-2:#2a1d12; --hud-ink:#f1e3c2; --hud-dim:#b59d74; --hud-line:rgba(240,210,150,.18);
  --panel:#f2e7cf; --panel-2:#e6d7b5; --ink:#2a1c10; --ink-2:#6e5a3d; --line:rgba(70,45,20,.18);
  --red:#a8281d; --gold:#c99a35; --good:#3c7a3a; --bad:#b0362a; --warn:#a87a1f;
  --serif:'EB Garamond','Iowan Old Style',Palatino,Georgia,serif;
  --display:'Cinzel','Trajan Pro',Optima,'Times New Roman',serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel:#211910; --panel-2:#30251a; --ink:#f0e2c3; --ink-2:#b49c74; --line:rgba(240,215,170,.14);
    --red:#d4553f; --gold:#dcaa47; --good:#6bb065; --bad:#e0644f; --warn:#d8a640;
  }
}
:root[data-theme="dark"]{
  --panel:#211910; --panel-2:#30251a; --ink:#f0e2c3; --ink-2:#b49c74; --line:rgba(240,215,170,.14);
  --red:#d4553f; --gold:#dcaa47; --good:#6bb065; --bad:#e0644f; --warn:#d8a640;
}
html{height:100%;background:var(--hud);scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--hud);color:var(--ink);font-family:var(--serif);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%}
#app{position:relative;height:100%;width:100%;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.hidden{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-appearance:none;appearance:none;padding:0}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn{min-height:42px;padding:0 14px;border-radius:11px;font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.04em}
.btn.primary{background:linear-gradient(180deg,#b8362a,#86201a);color:#fff3dc;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.btn.gold{background:linear-gradient(180deg,#e2b655,#ad8020);color:#22160a;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.btn.ghost{background:var(--panel-2);color:var(--ink)}
.btn.sm{min-height:34px;padding:0 11px;font-size:12px}
.btn:disabled{opacity:.38;cursor:default}

/* Title */
#title{z-index:40;background:radial-gradient(120% 75% at 50% 28%,#3d2a17 0%,#1b120a 58%,#0e0905 100%);color:var(--hud-ink);align-items:center;justify-content:center;text-align:center;padding:24px;gap:12px}
#title h1{font-family:var(--display);font-weight:900;font-size:clamp(42px,13vw,68px);letter-spacing:.14em;margin:0;color:#efcd78;text-shadow:0 2px 0 #5a3d12,0 0 34px rgba(240,190,90,.22)}
.t-sub{font-family:var(--display);color:#c9a764;letter-spacing:.2em;font-size:13px}
#title p{max-width:330px;color:#d6c39c;font-size:17px;line-height:1.45;margin:6px 0 0}
.t-btns{display:flex;flex-direction:column;gap:10px;width:min(300px,88%);margin-top:16px}
.t-btns .btn{min-height:52px;font-size:15px}
.t-btns .btn.ghost{background:rgba(255,240,210,.08);color:var(--hud-ink);border:1px solid var(--hud-line)}
.t-snd{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;width:42px;height:42px;border-radius:12px;background:rgba(255,240,210,.08);border:1px solid var(--hud-line);font-size:19px;z-index:3}
#title.gated .t-btns{opacity:0;pointer-events:none}
.t-btns{transition:opacity .9s .2s}
#tapGate{position:absolute;inset:0;z-index:8;display:grid;place-items:end center;padding-bottom:max(60px,22%);background:rgba(14,9,5,.18);font-family:var(--display);letter-spacing:.32em;color:#efcd78;font-size:14px;transition:opacity .7s}
#tapGate span{animation:pulse 1.8s ease-in-out infinite}
#tapGate.off{opacity:0;pointer-events:none}

/* Campaign */
#campaign{z-index:1}
#topbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(180deg,#25190f,#1a120b);color:var(--hud-ink);border-bottom:1px solid #4a3620;z-index:5}
.emblem{font-family:var(--display);font-weight:900;font-size:11px;letter-spacing:.1em;color:#1a120b;background:linear-gradient(180deg,#e7bd5a,#a87a22);border-radius:6px;padding:7px 7px}
.tb-date{font-family:var(--display);font-size:14px;letter-spacing:.05em}
.tb-sub{font-size:13px;color:var(--hud-dim)}
.tb-gold{margin-left:auto;text-align:right;font-family:var(--display);font-size:17px;color:#f0cf7a;line-height:1.1}
.tb-gold small{display:block;font-family:var(--serif);font-size:13px}
.tb-gold small.neg{color:#ff9c86}
.icon-btn{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.07);display:grid;place-items:center;font-size:19px;color:var(--hud-ink)}
#mapWrap{position:relative;flex:1 1 auto;min-height:0}
#mapScroll{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;background:#1d3c49;overscroll-behavior:contain}
#mapInner{position:relative}
#mapCanvas,#mapSvg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.road{fill:none;stroke:#6e4c2a;stroke-width:2.2;stroke-dasharray:6 4;opacity:.7;stroke-linecap:round}
.road.paved{stroke:#e8dfc8;stroke-width:3.4;stroke-dasharray:none;opacity:.95}
.sea-route{fill:none;stroke:#d9eef0;stroke-width:2;stroke-dasharray:1.5 5;stroke-linecap:round;opacity:.85}
.route-hl{fill:none;stroke:#f0c75a;stroke-width:4.5;stroke-linecap:round;stroke-dasharray:10 6;animation:march .8s linear infinite}
.route-hl.foe{stroke:#e2553f}
@keyframes march{to{stroke-dashoffset:-16}}
.node{cursor:pointer}
.node .hit{fill:transparent}
.node .town{fill:#f6edd6;stroke-width:3.5}
.node .walls{fill:none;stroke:#3d2c1a;stroke-width:2;stroke-dasharray:3 2}
.node .zoc{opacity:.2;pointer-events:none}
.node .lbl.pl{font-size:9.5px}
.node.pass .town{stroke-width:2.6}
.node .lbl{font-family:var(--display);font-weight:700;font-size:11.5px;fill:#26180c;text-anchor:middle;paint-order:stroke;stroke:#f2e6c8;stroke-width:3.2px;stroke-linejoin:round;letter-spacing:.03em}
.node .sel-ring{fill:none;stroke:#f4cd5c;stroke-width:3;animation:pulse 1.2s ease-in-out infinite}
.node .tgt-ring{fill:rgba(240,200,90,.2);stroke:#f0c75a;stroke-width:2.5;stroke-dasharray:4 3}
.node.foe .tgt-ring{fill:rgba(226,85,63,.22);stroke:#e2553f}
.node .dng{fill:none;stroke:#e2553f;stroke-width:2.5;stroke-dasharray:5 3;animation:pulse 1.2s ease-in-out infinite;pointer-events:none}
.route-plan{fill:none;stroke:#f0c75a;stroke-width:3;stroke-dasharray:3 6;stroke-linecap:round;opacity:.9}
@keyframes pulse{50%{opacity:.3}}
.badge text{font-family:var(--display);font-size:11px;font-weight:700;fill:#fff;text-anchor:middle}
.badge rect{stroke:#1d130a;stroke-width:1.2}
.badge.ready rect{stroke:#f4cd5c;stroke-width:2.4}
.hint{position:absolute;top:10px;left:10px;right:10px;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:14px;background:rgba(26,18,11,.92);color:var(--hud-ink);font-size:15px;z-index:4;border:1px solid var(--hud-line)}
.hint span{flex:1}
.hint .btn.ghost{background:rgba(255,240,210,.12);color:var(--hud-ink)}
.fab-row{position:absolute;left:10px;right:10px;bottom:12px;display:flex;align-items:flex-end;gap:8px;pointer-events:none;z-index:3}
.fab-row>*{pointer-events:auto}
.zoom{display:flex;flex-direction:column;gap:6px}
.zoom button,#btnNext,.fab-s{background:rgba(26,18,11,.88);color:var(--hud-ink);border:1px solid var(--hud-line);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.zoom button{width:44px;height:44px;border-radius:12px;font-size:22px}
#btnNext{height:50px;padding:0 14px;border-radius:14px;font-family:var(--display);font-size:13px;letter-spacing:.03em}
.fab-col{display:flex;flex-direction:column;align-items:flex-start;gap:8px;pointer-events:none}
.fab-col>*{pointer-events:auto}
.fab-col.end{margin-left:auto;align-items:flex-end}
.fab-s{height:40px;padding:0 13px;border-radius:12px;font-family:var(--display);font-size:12.5px;letter-spacing:.03em;white-space:nowrap}
#btnUndo{animation:up .2s ease-out}
#btnEnd{height:56px;padding:0 22px;border-radius:16px;background:linear-gradient(180deg,#bd392c,#86201a);color:#fff3dc;font-family:var(--display);font-weight:700;letter-spacing:.05em;font-size:15px;box-shadow:0 6px 20px rgba(110,20,10,.5),inset 0 1px 0 rgba(255,255,255,.25);border:1px solid #5e140f}
.busy{position:absolute;inset:0;z-index:10;background:rgba(14,9,5,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--hud-ink);font-family:var(--display);letter-spacing:.06em;font-size:14px}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(240,210,150,.25);border-top-color:#efcd78;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 3D campaign map */
#mapGL{position:absolute;inset:0;background:#93bccb}
#mapGL canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#cmLabels{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.clab{position:absolute;left:0;top:0;display:flex;align-items:center;gap:4px;padding:1px 7px;border-radius:7px;background:rgba(244,234,208,.93);border:2px solid var(--fc,#888);box-shadow:0 2px 6px rgba(0,0,0,.35);white-space:nowrap;font-family:var(--display);font-weight:700;font-size:11.5px;color:#26180c;letter-spacing:.03em;will-change:transform}
.clab .cb{background:var(--fc,#888);color:#fff;border-radius:5px;padding:0 5px;margin-right:-4px;font-size:11px;line-height:16px}
.clab .cb.ready{outline:2px solid #f4cd5c}
.clab .cs{font-size:11px}
.clab.foe{border-color:#e2553f}
.clab.danger{box-shadow:0 0 0 2px #e2553f,0 2px 6px rgba(0,0,0,.35);animation:dng 1.4s ease-in-out infinite}
@keyframes dng{50%{box-shadow:0 0 0 4px rgba(226,85,63,.55),0 2px 6px rgba(0,0,0,.35)}}
.clab.pass{padding:0 6px;font-size:10.5px;background:rgba(236,226,200,.9)}
.busy.pill{inset:auto;top:62px;left:50%;right:auto;transform:translateX(-50%);flex-direction:row;gap:10px;padding:8px 16px;border-radius:999px;background:rgba(26,18,11,.92);border:1px solid var(--hud-line);font-size:13px;white-space:nowrap;pointer-events:none}
.busy.pill .spin{width:18px;height:18px;border-width:2px}

/* Sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:64%;display:flex;flex-direction:column;background:var(--panel);color:var(--ink);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.4);z-index:6;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
.sh-head{display:flex;align-items:center;gap:10px;padding:12px 14px 6px}
.sh-flag{width:8px;height:40px;border-radius:3px}
.sh-head h3{margin:0;font-family:var(--display);font-size:19px;letter-spacing:.04em}
.sh-sub{font-size:14px;color:var(--ink-2)}
.sh-x{margin-left:auto;width:38px;height:38px;border-radius:10px;background:var(--panel-2);font-size:22px;line-height:1}
.chips{display:flex;gap:6px;padding:2px 14px 8px;flex-wrap:wrap}
.chip{font-size:13px;padding:4px 9px;border-radius:999px;background:var(--panel-2)}
.chip.bad{color:var(--bad)} .chip.good{color:var(--good)}
.tabs{display:flex;padding:0 8px;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:10px 2px;font-family:var(--display);font-size:12.5px;letter-spacing:.04em;color:var(--ink-2);border-bottom:2.5px solid transparent}
.tab.on{color:var(--red);border-color:var(--red)}
.sh-body{flex:1 1 auto;overflow:auto;padding:10px 12px 12px;-webkit-overflow-scrolling:touch;touch-action:pan-y;min-height:120px}
.sh-foot{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.sh-foot .grow{flex:1}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ucard{display:flex;gap:8px;align-items:center;padding:8px;border-radius:12px;background:var(--panel-2);border:2px solid transparent;text-align:left;width:100%}
.ucard.pick{border-color:var(--gold);box-shadow:inset 0 0 0 999px rgba(201,154,53,.12)}
.ucard.dim{opacity:.55}
.ucard .main{min-width:0;flex:1}
.uname{font-weight:600;font-size:15px;line-height:1.1}
.umeta{font-size:12.5px;color:var(--ink-2)}
.ubar{height:4px;border-radius:2px;background:rgba(0,0,0,.15);margin-top:4px;overflow:hidden}
.ubar i{display:block;height:100%;background:var(--good)}
.xp{color:var(--gold);font-size:11px}
.row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--panel-2);margin-bottom:8px}
.row .ico{font-size:22px;width:30px;text-align:center;flex:0 0 auto}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;font-size:15.5px}
.row .d{font-size:13px;color:var(--ink-2);line-height:1.3}
.row.q{padding:7px 8px 7px 10px;margin-bottom:6px}
.row.pick{width:100%;text-align:left;cursor:pointer;color:var(--ink);border:1px solid var(--line)}
.row.pick:active{background:var(--panel)}
.row.pick .gt{color:var(--ink-2);font-size:20px}
.row.q .ico{font-size:19px}
.qx{flex:0 0 auto;width:34px;height:34px;border-radius:9px;background:var(--panel);color:var(--ink-2);font-size:15px}
.qcap{font-family:var(--display);font-size:12.5px;letter-spacing:.04em;color:var(--ink-2);margin:4px 2px 6px}
.pool{font-size:11.5px;font-weight:400;color:var(--ink-2);margin-left:4px;white-space:nowrap}
.row.chk{align-items:flex-start}
.row.chk .t{font-size:15px}
.jumps{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.jump{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:14px;color:var(--ink);text-align:left}
.jump .sw{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.chk-foot{font-size:13px;color:var(--ink-2);margin:2px 2px 0}
.rep>span:first-child{flex:0 0 22px;text-align:center}
.rep.go{width:100%;text-align:left;cursor:pointer}
.rep.go .gt{margin-left:auto;padding-left:6px;color:var(--ink-2);font-size:20px;line-height:1}
.ctab{width:100%;border-collapse:collapse;font-size:14.5px;margin-bottom:8px}
.ctab th{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--ink-2);text-align:right;padding:4px 3px 6px;white-space:nowrap;border-bottom:1px solid var(--line)}
.ctab th[data-v]{cursor:pointer}
.ctab th.on{color:var(--red)}
.ctab th.on::after{content:' ▾'}
.ctab td{padding:7px 3px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;vertical-align:top;line-height:1.2}
.ctab th:first-child,.ctab td:first-child{text-align:left}
.ctab tbody tr{cursor:pointer}
.ctab tbody tr:active{background:var(--panel-2)}
.ctab td small{display:block;font-size:12px;color:var(--ink-2);white-space:nowrap}
.ctab .nm{font-weight:600}
.ctab tr.tot td{font-weight:600;border-bottom:0}
.ctab .warn{color:var(--warn)}
.note{font-size:14px;color:var(--ink-2);padding:4px 2px 10px;line-height:1.4}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.seg button{padding:10px 2px;border-radius:10px;background:var(--panel-2);font-family:var(--display);font-size:12px}
.seg button.on{background:var(--red);color:#fff3dc}
.ledger{width:100%;border-collapse:collapse;font-size:14.5px;margin-bottom:12px}
.ledger td{padding:5px 2px;border-bottom:1px solid var(--line)}
.ledger td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.ledger tr.tot td{font-weight:600;border-bottom:0}
.ledger caption{text-align:left;font-family:var(--display);font-size:13px;color:var(--ink-2);padding:6px 0}
.neg{color:var(--bad)} .pos{color:var(--good)}

/* Modal */
#modal{position:absolute;inset:0;background:rgba(10,6,3,.62);display:grid;place-items:center;z-index:50;padding:16px}
.mcard{width:min(440px,100%);max-height:100%;overflow:auto;background:var(--panel);color:var(--ink);border-radius:18px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:up .18s ease-out}
.mcard h2{font-family:var(--display);margin:0 0 10px;font-size:22px;letter-spacing:.05em;text-align:center}
.mbody{font-size:16px;line-height:1.45}
.mbody p{margin:0 0 10px}
.mbody ul{padding-left:20px;margin:0 0 10px}
.mbody li{margin-bottom:6px}
.mbtns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.mbtns .btn{min-height:48px;font-size:14px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start;margin:6px 0 10px}
.vs .side{background:var(--panel-2);border-radius:12px;padding:10px;text-align:center}
.vs .nm{font-family:var(--display);font-size:13px;margin-bottom:6px}
.vs .icons{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin-bottom:6px}
.vs .d{font-size:13px;color:var(--ink-2)}
.vsx{font-family:var(--display);font-weight:900;color:var(--red);align-self:center}
.odds{text-align:center;font-size:15px}
.odds.good b{color:var(--good)} .odds.warn b{color:var(--warn)} .odds.bad b{color:var(--bad)}
.rep{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.ftab{width:100%;border-collapse:collapse;font-size:14.5px}
.ftab td{padding:7px 4px;border-bottom:1px solid var(--line)}
.ftab .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ftab .you{font-size:12px;color:var(--ink-2)}
.fpick{display:flex;gap:10px;width:100%;text-align:left;padding:10px;border-radius:12px;background:var(--panel-2);border:2px solid transparent;margin-bottom:8px}
.fpick.on{border-color:var(--gold);box-shadow:inset 0 0 0 999px rgba(201,154,53,.12)}
.fpick .ff{flex:0 0 auto;width:8px;border-radius:3px}
.fpick .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.fpick .t{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.03em}
.fpick .dif{margin-left:auto;font-family:var(--serif);font-size:12.5px;font-weight:600;letter-spacing:0}
.dif.easy{color:var(--good)} .dif.normal{color:var(--warn)} .dif.hard{color:var(--bad)}
.fpick .d{font-size:13.5px;line-height:1.35;color:var(--ink-2)}
.fpick .ic{display:flex;flex-wrap:wrap;align-items:center;gap:3px;font-size:12.5px;color:var(--ink-2)}
.fpick .ic span{margin-left:4px}
.mcard.picker .mbtns{position:sticky;bottom:-18px;flex-direction:row-reverse;margin:6px -18px -18px;padding:12px 18px 18px;background:var(--panel);border-top:1px solid var(--line)}
.mcard.picker .mbtns .btn:first-child{flex:1}

<body>
<div id="app">
  <section id="title" class="screen gated">

    </div>

<script>
(function(){
'use strict';
const SVGNS='http://www.w3.org/2000/svg';
const $=(s,el=document)=>el.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmt=n=>Math.round(n).toLocaleString('en-US');
const probRound=x=>{x=Math.max(0,x);const f=Math.floor(x);return f+(Math.random()<x-f?1:0);};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hexRgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];}

/* ================= AUDIO: procedural music + sound effects (no audio files) ================= */
const AU=(()=>{
  const KEY='imperivm-sound';
  let mode=0;try{mode=clamp(parseInt(localStorage.getItem(KEY),10)||0,0,2);}catch(e){} // 0 music+effects, 1 effects only, 2 muted
  let ctx=null,out,musBus,fxBus,verbIn,noiseBuf,mon,monBuf,want=null,cur=null,amb=null,ambOn=false,off=false,t0=0;
  let ticking=false,tried=0,dead=false,lastT=0,stallAt=0,monAt=0; // health watch: see init() and tick()
  const bs={phase:'deploy',tg:.3,lv:.3},last={};
  const mf=n=>440*Math.pow(2,(n-69)/12);
  const now=()=>ctx.currentTime+t0;
  const ok=()=>!!ctx&&(off||ctx.state==='running')&&mode<2;
  const lim=(k,gap)=>{const n=ctx.currentTime;if((last[k]||-9)>n-gap)return false;last[k]=n;return true;};

  function init(ext){
    if(ctx){
      // iPhone: after the app has been in the background the context can stay "interrupted", ignore resume(), or claim to be
      // running with its clock stopped. If a resume hasn't taken (or tick() found it dead), build a fresh one from this tap.
      if(!ext&&!off&&!document.hidden){if(dead||(ctx.state!=='running'&&tried&&performance.now()-tried>400))revive();else if(ctx.state!=='running')wake();}
      return true;
    }
    const AC=window.AudioContext||window.webkitAudioContext;
    try{ctx=ext||new AC();}catch(e){ctx=null;return false;}
    try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
    const comp=ctx.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=20;comp.ratio.value=5;comp.attack.value=.004;comp.release.value=.3;
    mon=ctx.createAnalyser();mon.fftSize=256;monBuf=new Float32Array(256); // taps the final mix so tick() can spot NaN
    out=ctx.createGain();out.gain.value=.9;out.connect(comp);comp.connect(mon);mon.connect(ctx.destination);
    musBus=ctx.createGain();fxBus=ctx.createGain();musBus.connect(out);fxBus.connect(out);
    const sr=ctx.sampleRate,len=Math.floor(sr*2.4),ir=ctx.createBuffer(2,len,sr); // a synthetic hall for the reverb
    for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
    const cv=ctx.createConvolver();cv.buffer=ir;verbIn=ctx.createGain();const vo=ctx.createGain();vo.gain.value=.55;verbIn.connect(cv);cv.connect(vo);vo.connect(out);
    const nl=Math.floor(sr*3);noiseBuf=ctx.createBuffer(1,nl,sr);const nd=noiseBuf.getChannelData(0);for(let i=0;i<nl;i++)nd[i]=Math.random()*2-1;
    applyMode(true);
    if(!ext){if(!ticking){ticking=true;setInterval(tick,40);}if(want)music(want.name,{...want.o,delay:0});}
    return true;
  }
  function wake(){if(!tried)tried=performance.now();ctx.resume().catch(()=>{});}
  function revive(){ // throw the stuck context away and rebuild the graph; the current piece starts again from the top
    const old=ctx;ctx=null;cur=null;amb=null;dead=false;tried=0;stallAt=0;for(const k in last)delete last[k];
    try{old.close().catch(()=>{});}catch(e){}
    if(init()&&ambOn)ambient(true);
  }
  function applyMode(imm){
    if(!ctx)return;const t=ctx.currentTime;
    musBus.gain.setTargetAtTime(mode===0?.42:0,t,imm?.001:.15);fxBus.gain.setTargetAtTime(mode===2?0:.85,t,imm?.001:.05);
    if(mode===2&&amb)ambient(false);
  }

  /* ---- synthesis primitives ---- */
  function route(n,o){
    if(o.pan&&ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=clamp(o.pan,-1,1);n.connect(p);n=p;}
    n.connect(o.bus||fxBus);
    if(o.send){const s=ctx.createGain();s.gain.value=o.send;n.connect(s);s.connect((o.bus&&o.bus._s)||verbIn);}
  }
  function env(g,t,a,d,r,v){d=Math.max(d,a);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.setValueAtTime(v,t+d);g.gain.exponentialRampToValueAtTime(.0001,t+d+r);return t+d+r;}
  function tone(o){
    const t=o.t,osc=ctx.createOscillator();osc.type=o.type||'sine';
    if(o.from){osc.frequency.setValueAtTime(o.f*o.from,t);osc.frequency.exponentialRampToValueAtTime(o.f,t+(o.gl||.06));}else osc.frequency.value=o.f;
    if(o.det)osc.detune.value=o.det;
    let n=osc;
    if(o.lp){const fl=ctx.createBiquadFilter();fl.type=o.ft||'lowpass';fl.Q.value=o.q||.7;fl.frequency.setValueAtTime(o.lp,t);if(o.lp2)fl.frequency.exponentialRampToValueAtTime(o.lp2,t+(o.lpt||.3));n.connect(fl);n=fl;}
    const e=ctx.createGain(),end=env(e,t,o.a??.01,o.d??.2,o.r??.1,o.g??.2);n.connect(e);route(e,o);
    if(o.vib){const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=o.vib.rate||5;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(o.vib.depth,t+(o.vib.delay||.2));lfo.connect(lg);lg.connect(osc.frequency);lfo.start(t);lfo.stop(end+.05);}
    osc.start(t);osc.stop(end+.05);
  }
  function noise(o){
    const t=o.t,s=ctx.createBufferSource();s.buffer=noiseBuf;s.loop=true;
    const fl=ctx.createBiquadFilter();fl.type=o.ft||'bandpass';fl.Q.value=o.q||1;fl.frequency.setValueAtTime(o.f||1000,t);
    if(o.f2)fl.frequency.exponentialRampToValueAtTime(o.f2,t+(o.d??.1)+(o.r??.05));
    const e=ctx.createGain(),end=env(e,t,o.a??.003,o.d??.1,o.r??.05,o.g??.2);s.connect(fl);fl.connect(e);route(e,o);
    s.start(t,Math.random()*2);s.stop(end+.05);
  }
  /* ---- instruments ---- */
  const pad=(t,f,d,v,b)=>{for(const det of[-8,8])tone({t,f,d,type:'sawtooth',det,g:.032*v,a:Math.min(1.4,d*.4),r:1.5,lp:950,q:.4,bus:b,send:.35});};
  const horn=(t,f,d,v,b,s=.3)=>{for(const det of[-6,6])tone({t,f,d,type:'sawtooth',det,g:.07*v,a:Math.min(.14,d*.4),r:.3,from:.965,gl:.09,lp:f*1.8,lp2:f*4.5,lpt:.25,q:.9,bus:b,send:s});};
  const flute=(t,f,d,v,b)=>{tone({t,f,d,g:.16*v,a:.09,r:.28,vib:{rate:5,depth:f*.006,delay:.25},bus:b,send:.5,pan:.2});tone({t,f:f*2,d,g:.025*v,a:.12,r:.2,bus:b,send:.5});noise({t,d,g:.025*v,a:.1,r:.2,f:f*2.5,q:3,bus:b,send:.4});};
  const pluck=(t,f,v,b,pan)=>{tone({t,f,type:'triangle',d:.01,a:.004,r:1,g:.2*v,lp:f*6,lp2:f*1.2,lpt:.5,bus:b,pan,send:.35});tone({t,f:f*2,d:.01,a:.003,r:.35,g:.05*v,bus:b,pan,send:.3});};
  const bell=(t,f,v,b)=>{for(const[r,g]of[[1,.1],[2.76,.05],[5.4,.03]])tone({t,f:f*r,d:.01,r:3.2,g:g*v,bus:b,send:.5});};
  const timp=(t,v,b)=>{tone({t,f:56,from:2.4,gl:.14,d:.02,r:1.1,g:.7*v,bus:b,send:.25});tone({t,f:112,from:1.8,gl:.1,d:.01,r:.45,g:.22*v,bus:b});noise({t,d:.02,r:.12,ft:'lowpass',f:500,g:.3*v,bus:b});};
  const taiko=(t,v,b)=>{tone({t,f:46,from:3,gl:.1,d:.02,r:.7,g:.95*v,bus:b,send:.2});noise({t,d:.02,r:.1,f:240,q:.8,g:.45*v,bus:b});tone({t,f:140,from:1.5,gl:.04,type:'triangle',d:.01,r:.12,g:.25*v,bus:b});};
  const snare=(t,v,b)=>{noise({t,d:.03,r:.14,f:2400,q:.7,g:.35*v,bus:b});tone({t,f:200,from:1.4,gl:.04,type:'triangle',d:.01,r:.08,g:.18*v,bus:b});};
  const bodhran=(t,v,b,pan)=>{tone({t,f:150,from:1.7,gl:.05,d:.01,r:.28,g:.5*v,bus:b,pan,send:.2});noise({t,d:.01,r:.07,f:1100,q:1.2,g:.1*v,bus:b,pan});};
  const crash=(t,v,b)=>noise({t,d:.02,r:1.6,ft:'highpass',f:5200,q:.5,g:.12*v,bus:b,send:.3});

  /* ---- music: step sequencers, scheduled a little ahead of the audio clock ---- */
  const MENU={bpm:62,
    ch:[{b:38,p:[50,53,57]},{b:34,p:[50,53,58]},{b:43,p:[50,55,58]},{b:33,p:[52,57,61]},{b:38,p:[50,53,57]},{b:41,p:[53,57,60]},{b:36,p:[52,55,60]},{b:33,p:[52,57,61]}],

/* ================= MERCENARIES: hired swords, by region ================= */
// Each region keeps a pool of men for hire, and whoever holds a city there can hire from it. Hired men are seasoned, march at once, need no barracks and don't count against the two recruits a turn — but they cost dear to keep, and they are the first to walk off when the pay stops. The pool refills slowly.
const MERC={
  cisalpina:{name:'Cisalpine Gaul',cities:['mediolanum','taurini','genua','bononia','patavium'],pool:{mc_gaul:3,mc_ligur:2}},
  etruria:{name:'Etruria and Umbria',cities:['tarquinii','clusium','pisae','ariminum','asculum'],pool:{mc_umbr:2,mc_ligur:1,mc_gaul:1}},
  latium:{name:'Latium and Campania',cities:['roma','capua','paestum'],pool:{mc_campan:2,mc_samn:1}},
  samnium:{name:'The Apennines',cities:['corfinium','beneventum','luceria'],pool:{mc_samn:3,mc_campan:1}},
  graecia:{name:'Magna Graecia',cities:['tarentum','brundisium','croton','rhegium'],pool:{mc_hop:2,mc_rhod:2,mc_tarent:2}},
  sicilia:{name:'Sicily',cities:['syracusae','messana','panormus','lilybaeum','akragas'],pool:{mc_mamert:2,mc_sicel:2,mc_hop:1}},
  africa:{name:'Africa',cities:['carthago'],pool:{mc_numid:3,mc_iber:2,mc_gaetul:2}}
};
const MERC_OF={};for(const r in MERC)for(const id of MERC[r].cities)MERC_OF[id]=r;
const MERC_REFILL=.25; // the chance each turn that a pool short of a kind of men gains one more unit of them
const mercInit=()=>Object.fromEntries(Object.entries(MERC).map(([r,R])=>[r,{...R.pool}]));
const mercCost=(t,f)=>f==='carthage'?Math.round(UNITS[t].cost*.75/10)*10:UNITS[t].cost;
const mercPool=s=>!s.pass&&MERC_OF[s.id]?G.merc[MERC_OF[s.id]]:null;
const canHire=(s,t)=>{const p=mercPool(s);return!!p&&p[t]>0&&!besieged(s)&&s.units.length<MAX_UNITS&&G.gold[s.owner]>=mercCost(t,s.owner);};
function hireMerc(s,t){if(!canHire(s,t))return null;mercPool(s)[t]--;G.gold[s.owner]-=mercCost(t,s.owner);const u=mkUnit(t,false);u.xp=1;s.units.push(u);return u;}
function mercTick(){for(const r in MERC){const p=G.merc[r];for(const t in MERC[r].pool)if((p[t]||0)<MERC[r].pool[t]&&Math.random()<MERC_REFILL)p[t]=(p[t]||0)+1;}}
function aiHire(s,f,need,max){ // the AI hires the best men for the gold until the city has `need` more power (or `max` units)
  const p=mercPool(s);if(!p)return 0;let n=0;
  while(n<max&&need>0){const t=Object.keys(p).filter(t=>canHire(s,t)&&G.gold[f]-mercCost(t,f)>=60&&netIncome(f)-unitUpk(t,f)>=-30).sort((a,b)=>unitPower({type:b,men:UNITS[b].men,xp:1})/mercCost(b,f)-unitPower({type:a,men:UNITS[a].men,xp:1})/mercCost(a,f))[0];
    if(!t)break;const u=hireMerc(s,t);u.moved=true;need-=unitPower(u);n++;} // they still have to find their places: they march next turn
  return n;}

/* ================= COALITION: the powers of Italy unite against whoever grows too strong ================= */
const COAL_ON=10,COAL_OFF=8; // cities that make a power the common enemy, and that it must fall below before the others go back to their own quarrels
const inCoal=f=>!!(G&&G.coal)&&f!==G.coal.f&&f!=='rebels'&&f!==PLAYER; // f is one of the AI powers allied against the leader
const coalFoe=(f,o)=>inCoal(f)&&o===G.coal.f; // f fights o as the common enemy
const coalPeace=(f,o)=>inCoal(f)&&inCoal(o); // two allies leave each other alone (the player is never bound by it)
function coalTick(){
  const cnt=f=>ownedBy(f).length,c=G.coal;
  if(c&&cnt(c.f)<COAL_OFF){G.coal=null;report('🕊️',c.f===PLAYER?`The coalition against you has fallen apart: with ${cnt(c.f)} cities you no longer frighten the other powers.`:`The coalition against ${theF(c.f)} has broken up, and the powers of Italy go back to their own quarrels.`);}
  if(G.coal)return;
  const lead=Object.keys(PLAYABLE).sort((a,b)=>cnt(b)-cnt(a))[0];if(cnt(lead)<COAL_ON)return;
  G.coal={f:lead,since:G.turn};
  report('🤝',lead===PLAYER?`Alarmed by your ${cnt(lead)} cities, the other powers of Italy have made common cause against you. They leave each other in peace now, and their armies will come for you, and harder.`:`${theF(lead,1)} now hold${FACTIONS[lead].sg?'s':''} ${cnt(lead)} cities, and the other powers have joined against ${FACTIONS[lead].sg?'it':'them'}: they leave each other in peace and throw their armies at ${theF(lead)}. The coalition breaks up once ${theF(lead)} hold${FACTIONS[lead].sg?'s':''} fewer than ${COAL_OFF}.`);
}

const PYR_ARMY=['ep_pyrrhus','ep_phalanx','ep_phalanx','ep_hyp','ep_cav','ep_eleph','ep_eleph'],PYR_STAY=12,PYR_REACH=3; // turns before he sails home; how many roads from his landing he will march
const PYR_LAND=['tarentum','brundisium','croton','rhegium','paestum','syracusae']; // the Greek ports he will land at, most wanted first
const pyrOn=()=>!!(G&&G.pyr&&G.pyr.city&&!G.pyr.done);
const pyrFoe=(f,o)=>!!o&&o!==f&&o!=='samnium'&&!coalPeace(f,o); // whom he will fight: never his Samnite allies
const pyrNear=id=>{const c=G.pyr.city,p=PNODE[id];return Math.min(...(p?[p.a,p.b]:[id]).map(x=>DIST[c][x]??9))<=PYR_REACH;}; // he fights for the Greek south, not for the Alps
function pyrrhusTick(){ // he lands when G.turn reaches G.pyr.at, at the first Greek port that will have him; PYR_STAY turns later he sails home with what is left of his army
  const P=G.pyr;if(!P||P.done)return;
  if(!P.city){if(G.turn<P.at)return;
    const s=PYR_LAND.map(id=>G.s[id]).find(s=>s.owner==='greeks');
    if(!s){P.done=1;report('⛵','Pyrrhus of Epirus had promised to help the Greeks of Italy, but with their cities lost he stays at home.');return;}
    P.city=s.id;P.t=G.turn;let left=PYR_ARMY.map(t=>{const u=mkUnit(t,false);u.xp=1;u.pyr=1;return u;}),n=left.length;
    const nb=ADJ[s.id].map(id=>G.s[id]).filter(c=>c.owner==='greeks');
    for(const u of s.units.slice().sort((a,b)=>unitPower(a)-unitPower(b))){if(MAX_UNITS-s.units.length>=left.length)break;const c=nb.find(c=>c.units.length<MAX_UNITS);if(!c)break;s.units=s.units.filter(x=>x!==u);c.units.push(u);} // the port makes room: its own men move up the road
    for(const c of [s,...nb]){const k=left.splice(0,MAX_UNITS-c.units.length);c.units.push(...k);} // the ships unload into the port (and the Greek cities nearby, if it is still full)
    n-=left.length;
    report('🐘',PLAYER==='greeks'?`Pyrrhus, king of Epirus, has landed at ${sname(s)} with ${n} units — his phalanx, Thessalian horse and elephants — to fight for you! Epirus pays his men, so they cost you little — but it sends no fresh ones, so every loss is for good. He means to stay ${PYR_STAY} turns.`
      :`Pyrrhus, king of Epirus, has landed at ${sname(s)} with a great army — phalanx, Thessalian horse and elephants — to fight for the Greek cities of Italy!${PLAYER==='rome'?' The Senate expects you to meet him.':PLAYER==='samnium'?' He counts the Samnites as his allies, and his own army will not march against you.':''} He will stay about ${PYR_STAY} turns, and Epirus sends him no fresh men: every battle costs him for good.`,s.id);
    return;}
  const king=ALLN.some(x=>G.s[x.id].units.some(u=>u.type==='ep_pyrrhus'));
  if(G.turn-P.t>=PYR_STAY||!king){P.done=1;let n=0;
    for(const x of ALLN){const s=G.s[x.id],k=s.units.filter(u=>u.pyr);n+=k.length;if(k.length)s.units=s.units.filter(u=>!u.pyr);}
    G.orders=G.orders.filter(o=>ALLN.some(x=>G.s[x.id].units.some(u=>o.uids.includes(u.uid))));
    report('⛵',!king?(n?`With their king fallen, the ${n} Epirote unit${n>1?'s':''} left in Italy take ship for home.`:'Pyrrhus is dead and his army destroyed. Epirus will send no more men to Italy.')
      :n?`Pyrrhus sails home to Epirus with what is left of his army (${n} unit${n>1?'s':''}). "Another such victory and we are undone."`:'The army of Pyrrhus is gone, and the king sails home to Epirus.');}
}

const CELL=4, GW=Math.ceil(MW/CELL), GH=Math.ceil(MH/CELL);
let regionGrid=null;
const terrCanvas=document.createElement('canvas');terrCanvas.width=GW;terrCanvas.height=GH;
function buildRegions(){
  const mc=document.createElement('canvas');mc.width=GW;mc.height=GH;const m=mc.getContext('2d');
  m.fillStyle='#000';m.beginPath();for(const l of LAND)if(l.region)addPath(m,l.xy,CELL);m.fill();
  const data=m.getImageData(0,0,GW,GH).data;const land=new Uint8Array(GW*GH);
  for(let i=0;i<GW*GH;i++)land[i]=data[i*4+3]>100?1:0;
  regionGrid=new Int16Array(GW*GH).fill(-1);
  const pts=NODES.map(n=>[n.x/CELL,n.y/CELL]);const RMAX=150/CELL;
  const los=(x0,y0,x1,y1)=>{const st=Math.ceil(Math.hypot(x1-x0,y1-y0));for(let s=1;s<st;s++){const t=s/st,x=Math.floor(x0+(x1-x0)*t),y=Math.floor(y0+(y1-y0)*t);if(x<0||y<0||x>=GW||y>=GH||!land[y*GW+x])return false;}return true;};
  for(let gy=0;gy<GH;gy++)for(let gx=0;gx<GW;gx++){
    const idx=gy*GW+gx;if(!land[idx])continue;const cx=gx+.5,cy=gy+.5;
    const d=pts.map(([px,py],i)=>[(px-cx)**2+(py-cy)**2,i]).sort((a,b)=>a[0]-b[0]);
    for(let k=0;k<4;k++){const [dd,i]=d[k];if(Math.sqrt(dd)>RMAX)break;if(los(cx,cy,pts[i][0],pts[i][1])){regionGrid[idx]=i;break;}}
  }
}
function paintTerritory(){
  const ctx=terrCanvas.getContext('2d');const img=ctx.createImageData(GW,GH),d=img.data;
  const own=NODES.map(n=>G.s[n.id].owner);const rgb={};for(const f in FACTIONS)rgb[f]=hexRgb(FACTIONS[f].color);
  for(let gy=0;gy<GH;gy++)for(let gx=0;gx<GW;gx++){
    const idx=gy*GW+gx,r=regionGrid[idx];if(r<0)continue;
    const o=own[r];let [R,Gc,B]=rgb[o];let border=0;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const x=gx+dx,y=gy+dy;if(x<0||y<0||x>=GW||y>=GH)continue;const r2=regionGrid[y*GW+x];
      if(r2>=0&&r2!==r){border=Math.max(border,own[r2]!==o?2:1);}}
    let a=92;if(border===2){R*=.5;Gc*=.5;B*=.5;a=235;}else if(border===1){R*=.75;Gc*=.75;B*=.75;a=130;}
    const p=idx*4;d[p]=R;d[p+1]=Gc;d[p+2]=B;d[p+3]=a;
  }
  ctx.putImageData(img,0,0);
}

const DPR=Math.min(2,window.devicePixelRatio||1);

function spaced(ctx,text,x,y,size,rot,color,sp){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.font=`700 ${size}px Cinzel,'Times New Roman',serif`;ctx.fillStyle=color;ctx.textBaseline='middle';
  const ch=[...text],w=ch.map(c=>ctx.measureText(c).width),tot=w.reduce((a,b)=>a+b,0)+sp*(ch.length-1);let cx=-tot/2;
  ch.forEach((c,i)=>{ctx.fillText(c,cx,0);cx+=w[i]+sp;});ctx.restore();
}

  for(const k in G.roads){const[a,b]=k.split('|');seg(a,b,'road paved');} // paved roads first, under the highlights
  if(mv)for(const id of moveTargets(mv.from))seg(mv.from,id,'route-hl'+(isFoeTarget(id)?' foe':''));
  else{for(const p of orderPaths())for(let i=0;i+1<p.length;i++)seg(p[i],p[i+1],'route-plan'); // armies under march orders: the road still ahead of them
    const d=UI.sel&&dz[UI.sel];if(d)seg(d.from,UI.sel,'route-hl foe');} // where the threat to the picked city would come from
  for(const n of PNODES){ // passes and forts: a diamond on the road, a flag colour for whoever holds it
    const s=seen(G.s[n.id]),col=s.owner?FACTIONS[s.owner].color:'#9a9486',isT=adj&&adj.has(n.id),fort=s.bld.walls;
    h+=`<g class="node pass${isT&&isFoeTarget(n.id)?' foe':''}" data-id="${n.id}" transform="translate(${n.x.toFixed(1)},${n.y.toFixed(1)})"><circle class="hit" r="20"/>`;
    if(isT)h+=`<circle class="tgt-ring" r="16"/>`;
    if(UI.sel===n.id||(mv&&mv.from===n.id))h+=`<circle class="sel-ring" r="15"/>`;
    if(s.units.length)h+=`<circle class="zoc" r="26" style="fill:${col}"/>`;
    if(dz[n.id]&&!mv)h+=`<circle class="dng" r="13"/><text x="-24" y="12" font-size="12">⚠️</text>`;
    h+=`<rect class="town" x="-6" y="-6" width="12" height="12" transform="rotate(45)" style="stroke:${col}"/>`;
    if(fort)h+=`<rect class="walls" x="-9.5" y="-9.5" width="19" height="19" transform="rotate(45)"/>`;
    h+=`<circle r="2.6" fill="${col}"/>${s.units.length||fort||isT||UI.sel===n.id?`<text class="lbl pl" y="19">${n.name}</text>`:''}`; // bare passes are named only when they matter, to keep the map clear
    if(s.units.length){const ready=s.owner===PLAYER&&s.units.some(u=>!u.moved);
      h+=`<g class="badge${ready?' ready':''}" transform="translate(13,-9)"><rect x="-9" y="-8" width="18" height="16" rx="3" fill="${col}"/><text y="4">${s.units.length}</text></g>`;}
    if(myBuild(s))h+=`<text x="-20" y="-6" font-size="12">🔨</text>`;
    if(s.amb&&s.owner===PLAYER)h+=`<text x="-22" y="8" font-size="12">🌿</text>`;
    h+='</g>';}
  for(const n of NODES){
    const s=G.s[n.id],F=FACTIONS[s.owner],r=6+tier(s)*2,isT=adj&&adj.has(n.id);
    h+=`<g class="node${isT&&s.owner!==PLAYER?' foe':''}" data-id="${n.id}" transform="translate(${n.x.toFixed(1)},${n.y.toFixed(1)})"><circle class="hit" r="24"/>`;
    if(isT)h+=`<circle class="tgt-ring" r="${r+10}"/>`;
    if(UI.sel===n.id||(mv&&mv.from===n.id))h+=`<circle class="sel-ring" r="${r+8}"/>`;
    if(s.bld.walls)h+=`<circle class="walls" r="${r+3.5}"/>`;
    if(dz[n.id]&&!mv)h+=`<circle class="dng" r="${r+7}"/><text x="${-r-16}" y="${r+4}" font-size="12">⚠️</text>`; // a rival next door could attack it this turn
    h+=`<circle class="town" r="${r}" style="stroke:${F.color}"/><circle r="${(r*.45).toFixed(1)}" fill="${F.color}"/>`;
    if(G.cap[s.owner]===n.id)h+=`<path d="${starPath(0,-r-8,5.5)}" fill="#f2c94c" stroke="#3a2610" stroke-width="1"/>`;
    if(s.wonder)h+=`<text x="${r+1}" y="${r+6}" font-size="12">${WONDERS[s.wonder].ico}</text>`;
    h+=`<text class="lbl" y="${r+14}">${n.name}</text>`;
    if(s.units.length){const ready=s.owner===PLAYER&&s.units.some(u=>!u.moved);
      h+=`<g class="badge${ready?' ready':''}" transform="translate(${r+7},${-r-3})"><rect x="-9" y="-8" width="18" height="16" rx="3" fill="${F.color}"/><text y="4">${s.units.length}</text></g>`;}
    if(s.build&&s.owner===PLAYER)h+=`<text x="${-r-10}" y="${-r+2}" font-size="12">🔨</text>`;
    if(besieged(s))h+=`<text x="${-r-12}" y="${r+4}" font-size="13">⛺</text>`;
    h+='</g>';
  }
  $('#lRoutes').innerHTML=routes;$('#lNodes').innerHTML=h;
}

/* ================= UNIT SYMBOLS (map-style unit markers) ================= */
function symPaths(kind){
  switch(kind){
    case'inf':return'<path d="M-17,-11 L17,11 M17,-11 L-17,11"/>';
    case'spear':return'<path d="M0,9 L0,-8 M-5,-3 L0,-9 L5,-3 M-6,9 L6,9"/>';
    case'missile':return'<path d="M-9,5 Q0,-12 9,5"/><circle cx="0" cy="3" r="2.4" fill="#fff"/>';
    case'cav':return'<path d="M-17,11 L17,-11"/>';
    case'gen':return`<path fill="#fff" stroke="none" d="${starPath(0,0,9)}"/>`;
    case'eleph':return'<path d="M-17,11 L17,-11"/><circle cx="-7" cy="-4" r="3.2" fill="#fff"/><circle cx="7" cy="4" r="3.2" fill="#fff"/>';
  }
  return'';
}
function symSvg(kind,color,w=40){
  const h=(w*26/38).toFixed(1);
  return`<svg class="usym" width="${w}" height="${h}" viewBox="-19 -13 38 26" aria-hidden="true"><rect x="-17" y="-11" width="34" height="22" rx="2.5" fill="${color}" stroke="rgba(0,0,0,.55)" stroke-width="1.5"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">${symPaths(kind)}</g></svg>`;
}
const xpStars=x=>x?`<span class="xp">${'▲'.repeat(x)}</span>`:'';

/* ================= UI HELPERS ================= */
const UI={sel:null,tab:'army',pick:new Set(),move:null,busy:false,zoom:1,nextIdx:-1,undo:[]}; // undo: marches made this turn that can still be taken back
function modal({title,body,buttons}){
  return new Promise(res=>{
    $('#mcard').innerHTML=`<h2>${title}</h2><div class="mbody">${body||''}</div><div class="mbtns">${buttons.map((b,i)=>`<button class="btn ${b.cls||'ghost'}" data-i="${i}">${b.label}</button>`).join('')}</div>`;
    $('#modal').classList.remove('hidden');AU.ui('modal');
    $('#mcard').querySelectorAll('.mbtns button').forEach(btn=>btn.onclick=()=>{$('#modal').classList.add('hidden');res(buttons[+btn.dataset.i].value);});
    $('#mcard').querySelectorAll('.mbody [data-v]').forEach(el=>el.onclick=()=>{$('#modal').classList.add('hidden');res(el.dataset.v);}); // links inside the text answer too
  });
}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400);}
function report(icon,text,at,tab){const r={icon,text};if(at){r.at=at;if(tab)r.tab=tab;}G.reports.push(r);return r;} // at: the city or pass the dispatch is about, so tapping it goes there
function jumpTo(v){ // 'go:<place>:<tab>' from a checklist chip, a dispatch or the cities overview: fly there and open its sheet
  if(typeof v!=='string'||!v.startsWith('go:'))return false;const[,id,tab]=v.split(':');if(!G.s[id])return false;
  cancelMove();centerOn(id,true);UI.tab=tab||'army';UI.sel=null;openSheet(id);return true;}

function renderTop(){
  const yr=280-Math.floor((G.turn-1)/2),season=G.turn%2?'Summer':'Winter';
  $('#tbDate').textContent=`${season}, ${yr} BC`;
  const own=ownedBy(PLAYER);
  $('#tbSub').textContent=`Turn ${G.turn} · ${own.length} of ${NODES.length} cities${G.coal?G.coal.f===PLAYER?' · 🤝 All against you':` · 🤝 All against ${FACTIONS[G.coal.f].name}`:''}`;
  $('#tbGold').textContent=fmt(G.gold[PLAYER])+' ◉';
  const net=netIncome(PLAYER),el=$('#tbInc');el.textContent=(net>=0?'+':'')+fmt(net)+' per turn';el.className=net<0?'neg':'';
  $('#btnUndo').classList.toggle('hidden',!UI.undo.length);
}
function render(){renderTop();renderNodes();if(UI.sel)renderSheet();}

/* ================= SETTLEMENT SHEET ================= */
function openSheet(id){
  if(UI.sel!==id){UI.pick=new Set(G.s[id].owner===PLAYER?G.s[id].units.filter(u=>!u.moved).map(u=>u.uid):[]);}
  UI.sel=id;$('#sheet').classList.remove('hidden');renderSheet();renderNodes();
}
function closeSheet(){UI.sel=null;$('#sheet').classList.add('hidden');renderNodes();}
function unitCard(u,fid,opt={}){
  const T=UNITS[u.type],pct=Math.round(100*u.men/T.men);
  const cls=['ucard',opt.pick?'pick':'',opt.dim?'dim':''].join(' ');
  return`<button class="${cls}" data-uid="${u.uid}" ${opt.disabled?'disabled':''}>${symSvg(T.kind,FACTIONS[fid].color,36)}<div class="main"><div class="uname">${T.name} ${xpStars(u.xp)}</div><div class="umeta">${u.men}/${T.men} · ${opt.tag||KIND_NAME[T.kind]+(isMerc(u.type)?" · hired":u.pyr?" · Epirote":"")}</div><div class="ubar"><i style="width:${pct}%;background:${pct<40?'var(--bad)':pct<75?'var(--warn)':'var(--good)'}"></i></div></div></button>`;
}
function renderPassSheet(s){
  s=seen(s);const n=NODE[s.id],held=s.units.length>0,mine=held&&s.owner===PLAYER,F=s.owner&&(held||s.bld.walls)?FACTIONS[s.owner]:null,fort=s.bld.walls;
  let h=`<div class="sh-head"><div class="sh-flag" style="background:${F?F.color:'#9a9486'}"></div><div><h3>${n.name}</h3><div class="sh-sub">${fort?FORT_NAME[fort]:LAND_NAME[n.land]} on the road ${NODE[n.a].name} – ${NODE[n.b].name}${F?' · '+F.name:''}</div></div><button class="sh-x" id="shX" aria-label="Close">×</button></div>`;
  h+=`<div class="chips"><span class="chip">${LAND_NAME[n.land]}</span>${fort?`<span class="chip">${BUILD.walls.lv[fort-1]}</span>`:''}<span class="chip">${held?`${s.units.length} units · ${fmt(sumMen(s.units))} men`:'Nobody holds it'}</span></div>`;
  if(mine){
    let fh='';
    if(s.build)fh=`<div class="row"><div class="ico">🔨</div><div class="main"><div class="t">Building a ${FORT_NAME[s.build.lv].toLowerCase()}</div><div class="d">${s.build.t} turn${s.build.t>1?'s':''} left</div></div></div>`;
    else if(fort<2){const cost=FORT_COST[fort+1];fh=`<div class="row"><div class="ico">🏰</div><div class="main"><div class="t">${fort?'Upgrade to a':'Build a'} ${FORT_NAME[fort+1].toLowerCase()}</div><div class="d">${fmt(cost)} gold · ${FORT_TURNS[fort+1]} turns · defenders fight much harder behind walls</div></div><button class="btn gold sm" data-fort="1" ${G.gold[PLAYER]<cost?'disabled':''}>Build</button></div>`;}
    const n2=UI.pick.size;
    if(canAmb(s))fh+=`<div class="row"><div class="ico">🌿</div><div class="main"><div class="t">${s.amb?'Lying in ambush':'Lie in ambush'}</div><div class="d">${s.amb?'Hidden from your enemies. An army that marches down this road walks into your trap; you show yourselves when the fighting starts.':'Hide the army in the '+(n.land==='forest'?'woods':'hills')+' beside the road: enemies won’t see it on the map, and whoever marches through is caught strung out in column.'}</div></div><button class="btn ${s.amb?'ghost':'gold'} sm" data-amb="1">${s.amb?'Show yourselves':'Hide'}</button></div>`;
    h+=`<div class="sh-body">${dangerRow(s)}${orderRows(s)}<div class="note">While your army holds this pass, the road is closed: an enemy must defeat you here before he can march through. Select units to march them to either end of the road, or to a city farther off.</div><div class="ugrid">${s.units.map(u=>unitCard(u,PLAYER,{pick:UI.pick.has(u.uid),dim:u.moved,tag:armyTag(u)})).join('')}</div><div style="margin-top:10px">${fh}</div></div>`;
    h+=`<div class="sh-foot"><button class="btn ghost sm" id="pkAll">All</button><button class="btn ghost sm" id="pkDis" ${n2===1?'':'disabled'}>Disband</button><button class="btn primary grow" id="pkMarch" ${n2?'':'disabled'}>March ${n2?n2+' unit'+(n2>1?'s':''):''}</button></div>`;
  }else{
    h+=`<div class="sh-body">${held?`<div class="ugrid">${s.units.map(u=>unitCard(u,s.owner,{disabled:true})).join('')}</div>`:`<div class="note">${fort?'An empty fort. Any army that marches in takes it.':'An empty pass. An army that camps here closes the road to its enemies.'}</div>`}`;
    if(!held&&myBuild(s))h+=`<div class="note" style="margin-top:10px">🔨 Your ${FORT_NAME[s.build.lv].toLowerCase()} stands half-built: ${s.build.t} turn${s.build.t>1?'s':''} of work left. Camp an army here to finish it — an enemy who marches in first tears it down.</div>`;
    const from=ADJ[s.id].map(id=>G.s[id]).filter(t=>t.owner===PLAYER&&t.units.some(u=>!u.moved));
    if(from.length)h+=`<div class="note" style="margin-top:10px">${held?'Attack from':'Camp here from'} a neighbouring city:</div>`+from.map(t=>{const av=t.units.filter(u=>!u.moved);
      return`<div class="row"><div class="ico">${held?'⚔️':'⛺'}</div><div class="main"><div class="t">${sname(t)}</div><div class="d">${av.length} ready units · ${fmt(sumMen(av))} men</div></div><button class="btn primary sm" data-atk="${t.id}">${held?'Attack':'March'}</button></div>`;}).join('');
    else h+=`<div class="note" style="margin-top:10px">${ADJ[s.id].some(id=>G.s[id].owner===PLAYER)?'Your armies next to it have already marched this turn.':'Neither end of this road is yours yet.'}</div>`;
    h+='</div>';
  }
  const sh=$('#sheet');sh.innerHTML=h;
  $('#shX').onclick=closeSheet;
  sh.querySelectorAll('[data-atk]').forEach(b=>b.onclick=()=>{const from=G.s[b.dataset.atk];UI.move={from:from.id,uids:from.units.filter(u=>!u.moved).map(u=>u.uid)};executeMove(s.id);});
  if(!mine)return;
  sh.querySelectorAll('.ucard[data-uid]').forEach(b=>b.onclick=()=>{const uid=+b.dataset.uid;const u=s.units.find(x=>x.uid===uid);if(!u||u.moved)return;UI.pick.has(uid)?UI.pick.delete(uid):UI.pick.add(uid);renderSheet();});
  const all=$('#pkAll');if(all)all.onclick=()=>{const av=s.units.filter(u=>!u.moved);UI.pick=UI.pick.size===av.length?new Set():new Set(av.map(u=>u.uid));renderSheet();};
  const mar=$('#pkMarch');if(mar)mar.onclick=()=>startMove(s.id,[...UI.pick]);
  const dis=$('#pkDis');if(dis)dis.onclick=async()=>{const uid=[...UI.pick][0],u=s.units.find(x=>x.uid===uid);if(!u)return;
    const ok=await modal({title:'Disband unit?',body:`<p>${UNITS[u.type].name} will be sent home. You save ${unitUpk(u.type,PLAYER)} gold upkeep per turn.</p>`,buttons:[{label:'Disband',value:1,cls:'primary'},{label:'Keep',value:0}]});
    if(ok){s.units=s.units.filter(x=>x!==u);UI.pick.delete(uid);save();render();}};
  const fb=sh.querySelector('[data-fort]');if(fb)fb.onclick=()=>doFort(s);
  const ab=sh.querySelector('[data-amb]');if(ab)ab.onclick=()=>{s.amb=s.amb?null:true;UI.undo=[];AU.ui('select');toast(s.amb?`Your army at ${sname(s)} lies hidden beside the road`:`Your army at ${sname(s)} stands in the open`);save();render();};
  sh.querySelectorAll('[data-stop]').forEach(b=>b.onclick=()=>stopOrder(+b.dataset.stop));
  sh.querySelectorAll('[data-lift]').forEach(b=>b.onclick=()=>liftSiege(+b.dataset.lift));
}
function doFort(s){const lv=s.bld.walls+1,c=FORT_COST[lv];if(s.build||lv>2||G.gold[PLAYER]<c||!s.units.length)return;s.amb=null; // a fort can't be hidden
  G.gold[PLAYER]-=c;s.build={lv,t:FORT_TURNS[lv],by:PLAYER};UI.undo=[]; // the army is committed to the spot once it starts building
  toast(`Construction started: ${FORT_NAME[lv]} at ${sname(s)}`);AU.ui('hammer');save();render();}
function renderSheet(){
  const s=G.s[UI.sel];if(!s)return closeSheet();
  if(s.pass)return renderPassSheet(s);
  const F=FACTIONS[s.owner],mine=s.owner===PLAYER,o=order(s);
  let h=`<div class="sh-head"><div class="sh-flag" style="background:${F.color}"></div><div><h3>${sname(s)}</h3><div class="sh-sub">${F.name}${s.colony?' colony':''} · ${tierName(s)} of ${fmt(s.pop)}${resOf(s).name?` · ${resOf(s).ico} ${resOf(s).name}`:''}${s.wonder?` · ${WONDERS[s.wonder].ico} ${WONDERS[s.wonder].name}`:''}</div></div><button class="sh-x" id="shX" aria-label="Close">×</button></div>`;
  if(mine){
    const g=growth(s),d=dangerTo(s);
    h+=`<div class="chips"><span class="chip">Income <b>+${fmt(income(s))}</b></span><span class="chip ${o<40?'bad':o>=80?'good':''}">Order <b>${o}%</b></span><span class="chip">Growth <b>${g>=0?'+':''}${g.toFixed(1)}%</b></span>${s.bld.walls?`<span class="chip">${BUILD.walls.lv[s.bld.walls-1]}</span>`:''}${d?`<span class="chip bad">⚠️ Threatened from ${NODE[d.from].name}</span>`:''}</div>`;
    const nb=(s.build?1:0)+s.queue.length,tabs=[['army',`Army (${s.units.length})`],['build',`Build${nb?` (${nb})`:''}`],['recruit','Recruit'],['govern','Govern']];
    h+=`<div class="tabs">${tabs.map(([k,l])=>`<button class="tab${UI.tab===k?' on':''}" data-tab="${k}">${l}</button>`).join('')}</div>`;
    h+=`<div class="sh-body">${({army:tabArmy,build:tabBuild,recruit:tabRecruit,govern:tabGovern})[UI.tab](s)}</div>`;
    if(UI.tab==='army'){
      const n=UI.pick.size;
      h+=`<div class="sh-foot"><button class="btn ghost sm" id="pkAll">All</button><button class="btn ghost sm" id="pkDis" ${n===1?'':'disabled'}>Disband</button><button class="btn primary grow" id="pkMarch" ${n?'':'disabled'}>March ${n?n+' unit'+(n>1?'s':''):''}</button></div>`;
    }
  }else{
    h+=`<div class="chips"><span class="chip">${s.units.length} units · ${fmt(sumMen(s.units))} men</span>${s.bld.walls?`<span class="chip">${BUILD.walls.lv[s.bld.walls-1]}</span>`:'<span class="chip">No walls</span>'}</div>`;
    const q=siegeOf(s.id,PLAYER);
    h+=`<div class="sh-body">${q?`<div class="row chk"><div class="ico">⛺</div><div class="main"><div class="t">Besieged from ${NODE[q.from].name}${q.t?` · turn ${q.t}`:''}</div><div class="d">${q.t?`${siegeKit(q).rams} rams and ${siegeKit(q).ladders} ladders are ready. `:'Rams and ladders will be ready next turn. '}The city pays no taxes and raises no troops${q.t>=2?', and its garrison is starving':'; from the second turn its garrison starves'}.</div></div></div>`:''}${s.units.length?`<div class="ugrid">${s.units.map(u=>unitCard(u,s.owner,{disabled:true})).join('')}</div>`:'<div class="note">The city is undefended. Any army that marches in takes it.</div>'}`;
    const from=ADJ[s.id].map(id=>G.s[id]).filter(t=>t.owner===PLAYER&&t.units.some(u=>!u.moved));
    if(from.length){h+=`<div class="note" style="margin-top:10px">Attack from a neighbouring city:</div>`+from.map(t=>{const av=t.units.filter(u=>!u.moved);
      const g=gateOn(t.id,s.id),blk=seenBlock(g);
      return`<div class="row"><div class="ico">⚔️</div><div class="main"><div class="t">${sname(t)}</div><div class="d">${av.length} ready units · ${fmt(sumMen(av))} men</div>${blk?`<div class="d neg">${sname(g)} is held — you fight there first</div>`:''}</div><button class="btn primary sm" data-atk="${t.id}">${blk?'Advance':'Attack'}</button></div>`;}).join('');}
    else if(ADJ[s.id].some(id=>G.s[id].owner===PLAYER))h+=`<div class="note" style="margin-top:10px">Your neighbouring armies have already marched this turn.</div>`;
    else h+=`<div class="note" style="margin-top:10px">Not next to any of your cities yet.</div>`;
    h+='</div>';
  }
  const sh=$('#sheet');sh.innerHTML=h;
  $('#shX').onclick=closeSheet;
  sh.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{UI.tab=b.dataset.tab;renderSheet();});
  sh.querySelectorAll('[data-atk]').forEach(b=>b.onclick=()=>{const from=G.s[b.dataset.atk];UI.move={from:from.id,uids:from.units.filter(u=>!u.moved).map(u=>u.uid)};executeMove(s.id);});
  if(!mine)return;
  sh.querySelectorAll('.ucard[data-uid]').forEach(b=>b.onclick=()=>{const uid=+b.dataset.uid;const u=s.units.find(x=>x.uid===uid);if(!u||u.moved)return;UI.pick.has(uid)?UI.pick.delete(uid):UI.pick.add(uid);renderSheet();});
  const all=$('#pkAll');if(all)all.onclick=()=>{const av=s.units.filter(u=>!u.moved);UI.pick=UI.pick.size===av.length?new Set():new Set(av.map(u=>u.uid));renderSheet();};
  const mar=$('#pkMarch');if(mar)mar.onclick=()=>startMove(s.id,[...UI.pick]);
  const dis=$('#pkDis');if(dis)dis.onclick=async()=>{const uid=[...UI.pick][0],u=s.units.find(x=>x.uid===uid);if(!u)return;
    const ok=await modal({title:'Disband unit?',body:`<p>${UNITS[u.type].name} will be sent home. You save ${unitUpk(u.type,PLAYER)} gold upkeep per turn.</p>`,buttons:[{label:'Disband',value:1,cls:'primary'},{label:'Keep',value:0}]});
    if(ok){s.units=s.units.filter(x=>x!==u);UI.pick.delete(uid);save();render();}};
  sh.querySelectorAll('[data-build]').forEach(b=>b.onclick=()=>doBuild(s,b.dataset.build));
  sh.querySelectorAll('[data-road]').forEach(b=>b.onclick=()=>addProject(s,{k:'road',to:b.dataset.road}));
  sh.querySelectorAll('[data-wonder]').forEach(b=>b.onclick=()=>addProject(s,{k:'wonder',w:b.dataset.wonder}));
  sh.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>cancelBuild(s,+b.dataset.cancel));

/* Building queue: a city works on one project at a time (build), with more lined up behind it (queue). A project is a building level {k, lv}, a paved road {k:'road', to} or a wonder {k:'wonder', w}; c is the gold paid, t the turns left on the one under way. Gold is paid when a project is queued; the next one starts the turn the last is finished. */
const BUILD_MAX=5; // projects a city can have lined up, the one under way included

const projTurns=(s,p)=>p.k==='road'?roadTurns(s.id,p.to):p.k==='wonder'?WONDER_TURNS:BUILD[p.k].turns[p.lv];

const curProj=s=>s.build&&(BUILD[s.build.k]?{...s.build,lv:s.bld[s.build.k]}:s.build); // the project under way, with the level it is raising
function projOk(s,p){ // can this project (just taken off the queue, or about to go on it) be built here now? Gold and room in the queue aside
  if(p.k==='road')return G.s[p.to].owner===s.owner&&!SEA.has(rk(s.id,p.to))&&!paved(s.id,p.to)&&!pavingOn(s.id,p.to);

  const c=projCost(s,p);if(!projOk(s,p)||(p.k==='wonder'&&wonderPlanned(s))||G.gold[PLAYER]<c||(s.build?1:0)+s.queue.length>=BUILD_MAX)return false;

    buttons:[{label:'Cancel',value:null}]});}
function cancelBuild(s,i){ // i: -1 for the project under way, else its place in the queue; later levels of the same building go too, since they stand on it

/* ================= BATTLE: AI ================= */
function bestTarget(u,foes){

      -(f.kind==='gen'&&f.state==='ok'?5:0)+(u.target===f?6:0);

}

  samnium:{nm:'Skirmishing',aggr:1.1,flank:.7,line:1,shoot:1,cry:1,txt:'they harry you with javelins, and their horse rides round your flanks'},
  gauls:{nm:'Reckless',aggr:1.5,flank:.5,line:0,cry:1,txt:'they charge headlong, every warband for itself'},
  greeks:{nm:'Steady',aggr:.8,flank:.3,line:1,phal:1,shoot:1,txt:'they hold a wall of spears and let you come to them'},
  carthage:{nm:'Cunning',aggr:1,flank:1,line:1,phal:1,txt:'they send their horse round your flanks to strike from behind'},
  rebels:{nm:'Timid',aggr:.7,flank:.2,line:1,txt:'they give way easily'}};

function aiAtk(u,t){if(u.order!=='attack'||u.target!==t){u.order='attack';u.target=t;u.orderT=B.time;}}

/* ================= BATTLE: SIMULATION ================= */
function placeFigs(u){ // put every man of a unit in his place in the ranks at once
  const L=u.L,al=u.alive,n=al.length,d=u.dm,[lx,lz]=latV(u.face),[fx,fz]=fwdV(u.face);
  for(let j=0;j<n;j++){const f=al[j],file=j%d.f,rank=Math.floor(j/d.f),rowN=rank===d.r-1?n-rank*d.f:d.f,ox=(file-(rowN-1)/2)*L.sx,oz=((d.r-1)/2-rank)*L.sz;

}

  if(B.headless||!R3.scene)return;
  for(const s of [0,1]){const n=us.filter(u=>u.side===s).length;if(!n)continue; // one banner for everyone who arrives together
    banner(s===0?`Relief arrives — ${n} unit${n>1?'s':''} on the flank!`:`Enemy reinforcements — ${n} unit${n>1?'s':''} on the flank!`);
    const k=B.annK=(B.annK||0)+1;B.events.push({t:B.time+5,fn:()=>{if(B&&!B.over&&B.phase==='battle'&&B.annK===k)banner(false);}});AU.ui(s===0?'fanfare':'alarm');} // a later banner isn't cut short by this one's timer

function simStep(dt){

function siegeStep(dt){ // rams and axes at the shut gates; the gate towers shoot down at whoever is under them

const RIVER_CUT=12; // towns and forts a river can run under, at most

      mask.add(((x/7)|0)+','+((z/7)|0));for(const n of ALLN){const d=Math.hypot(x-n.x,z-n.z);if(d<(near.get(n)??1e9))near.set(n,d);}

    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nattribute vec2 aR;varying vec2 vR;varying vec3 vWp;').replace('#include <begin_vertex>','#include <begin_vertex>\nvR=aR;vWp=transformed;');

      .replace('#include <color_fragment>',`for(int i=0;i<${RIVER_CUT};i++){vec2 q=vWp.xz-uCut[i].xy;if(dot(q,q)<uCut[i].z*uCut[i].z)discard;}

/* ---- farmland: fields around a city, spreading one ring further with every level of Farms ---- */
const FIELD_COL=[[0xd8b65a,0xcfa94c,0xe3c86f,0x96b14c,0xaac35e,0x8c6b46,0xb3b46b],[0x8b6a45,0x7c5e3e,0x9a7a52,0x7f9a48,0x6e8b3f,0x9a8a5f,0xa1a26a]]; // summer, winter
const FIELD_PAT=[[1,.08],[1,.1],[1,.07],[1,.14],[1,.12],[1,.3],[2,.35]]; // per colour: furrows (1) or an orchard's rows of trees (2), and how strongly they show
function cmFieldMat(){
  const m=CM.fieldMat=new THREE.MeshLambertMaterial({vertexColors:true,polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-1});
  m.onBeforeCompile=sh=>{
    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nattribute vec4 aF;varying vec4 vF;varying float vFd;').replace('#include <begin_vertex>','#include <begin_vertex>\nvF=aF;vFd=distance(transformed,cameraPosition);');
    sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nvarying vec4 vF;varying float vFd;').replace('#include <color_fragment>',`#include <color_fragment>
float fp=vF.z<1.5?step(.5,fract(vF.x)):1.-step(.3,length(fract(vF.xy)-.5)); // furrows, or dots for the trees of an orchard

}
function cmFieldGeo(n,s,lv,rects){

  if(f==="carthage"&&goal&&goal.stage&&G.gold[f]>1500+save*.5)aiHire(goal.stage,f,1e9,2); // Carthage buys an army for the war it is planning
  for(const s of shuffle(ownedBy(f))){
    if(s.owner!==f||!s.units.some(u=>!u.moved))continue;let best=null,bs=0,bestSend=null,bestSiege=false;

      if(coalPeace(f,t0.owner)||coalPeace(f,t.owner))continue; // allies against the leader leave each other alone
      const pk=gate&&gate.owner===f?campFree(gate):[]; // our own camp on that road falls in with the army as it marches by
      const q=t.pass?null:siegeOf(t.id,f),ours=q&&q.from===s.id,camp=ours?siegeUnits(q,s).filter(u=>!u.moved):[]; // our own siege of t: its army joins the assault
      const free=aiFree(s,f,id).concat(pk,camp);if(!free.length)continue; // what can leave without exposing this city to anyone but the target
      const wf=ours&&q.t>=1?.5:1;let k=aiStrike(f,free,t,s,wf,wf),siege=false;
      if(!k&&!q&&!t.pass&&t.bld.walls&&t.owner!=='rebels'){k=aiStrike(f,aiFree(s,f,id),t,s,0,0);siege=!!k;} // too strong to storm, weak enough to starve (a siege is fought against the garrison alone): dig in
      if(!k)continue;const{send,ap,dp,left,needT}=k;
      const relieve=(G.sieges||[]).some(x=>x.from===t0.id&&G.s[x.to].owner===f); // the army besieging one of ours: drive it off
      let sc=(ap+1)/(dp+50)+(t0.owner==='rebels'?.4:0)+(t0.owner===PLAYER?.3:0)+(G.cap[t0.owner]===t0.id?.25:0)+t0.pop/20000+(goal&&goal.t===t0?.5:0)+(t0.pass?.1:0)+(relieve?.7:0)+(ours&&q.t>=2?.5:0)+(coalFoe(f,t0.owner)?.6:0);
      if(left<needT*.8)sc*=.35;if(siege)sc*=.6;

    if(!best)continue;
    if(bestSiege){ // the army stays where it is and the siege lines go up
      bestSend.forEach(u=>u.moved=true);G.sieges=(G.sieges||[]).filter(x=>!(x.to===best.id&&qf(x)===f));G.sieges.push({to:best.id,from:s.id,fid:f,uids:bestSend.map(u=>u.uid),t:0});
      if(best.owner===PLAYER)report('⛺',`The ${F.adj} army at ${sname(s)} lays siege to ${sname(best)}! Unless you break it, the garrison will starve and the walls will be stormed.`,best.id);
      continue;}
    const send=bestSend,camp=best.pass?null:gateOn(s.id,best.id),trap=ambFor(camp,f)?camp:null; // the player's hidden army on that road: they walk into it
    await cmMarchAI(s.id,trap?trap.id:best.id,f,send);
    s.units=s.units.filter(u=>!send.includes(u));if(camp&&!trap)camp.units=camp.units.filter(u=>!send.includes(u));send.forEach(u=>u.moved=true);

  }
  for(const p of shuffle(PNODES)){ // armies camped on passes: a fort's garrison stays; the rest strike a hostile end of the road, or fall back to a friendly one
    const ps=G.s[p.id];if(ps.owner!==f||!ps.units.length||G.lost)continue;

      const dp=e.units.length?(armyPower(e.units)+reliefPower(e,ps))*(1+.15*e.bld.walls):0;if(dp>0&&ap<dp*AI_EDGE/aggrOf(f,e.owner))continue;

      const foe=rivalPower(o),have=trap?0:armyPower(ps.units)*(1+.15*ps.bld.walls);if(have>=foe*PICKET)continue;

    const nb=ADJ[s.id].map(id=>G.s[id]).filter(t=>t.owner===f&&t.units.length<MAX_UNITS&&!aiBlock(gateOn(s.id,t.id),f)); // never through a rival's camp on the road (that it knows of)

    const trap=gateOn(s.id,dest.id);
    if(ambFor(trap,f)){await cmMarchAI(s.id,trap.id,f,mv);s.units=s.units.filter(u=>!mv.includes(u));mv.forEach(u=>u.moved=true);await doBattle({attFid:f,units:mv,from:s,to:trap,ambush:true});if(G.lost)return;continue;} // straight into the player's ambush
    s.units=s.units.filter(u=>!mv.includes(u));mv.forEach(u=>u.moved=true);dest.units.push(...mv);}
}

/* ================= TURN PROCESSING ================= */
function econTick(f){
  G.gold[f]+=netIncome(f);const heal=hasWonder(f,'asclep')?2:1; // the Sanctuary of Asclepius doubles how fast the wounded come back
  for(const s of ownedBy(f)){
    if(s.build){s.build.t--;if(s.build.t<=0){const r=finishProj(s,f);
      nextBuild(s);if(r&&!s.build&&BKEYS.some(b=>s.bld[b]<Math.min(3,tier(s))))r.text+=' Nothing else is queued there.';}}
    s.pop=Math.round(s.pop*(1+growth(s)/100));s.unrest=Math.max(0,s.unrest-5);s.rec=0;
    if(!besieged(s))for(const u of s.units)if(!u.pyr)u.men=Math.min(UNITS[u.type].men,u.men+Math.ceil(UNITS[u.type].men*.12*heal)); // no food comes in to a besieged city, and the wounded don't recover
    if(order(s)<20&&s.units.length<2&&G.cap[f]!==s.id&&Math.random()<.35){
      const back=dropQueue(s);s.owner='rebels';s.colony=null;s.units=['rb_mil','rb_mil','rb_sling'].map(t=>mkUnit(t,false));s.unrest=0;s.tax=1;
      if(f===PLAYER)report('🔥',`${sname(s)} revolted and declared itself free!${back?` The ${fmt(back)} gold set aside for its building queue was returned.`:''}`,s.id);}
  }
  for(const s of passStates()){ // armies in the field recover slowly, in a fort a little faster; builders finish; AI forts raise a militia to hold the road
    if(s.owner!==f)continue;
    if(s.units.length){ // work stops while nobody is there to do it
      if(s.build){s.build.t--;if(s.build.t<=0){s.bld.walls=s.build.lv;if(f===PLAYER)report('🏰',`${FORT_NAME[s.build.lv]} completed at ${sname(s)}.`,s.id);s.build=null;}}
      for(const u of s.units)if(!u.pyr)u.men=Math.min(UNITS[u.type].men,u.men+Math.ceil(UNITS[u.type].men*(s.bld.walls?.1:.06)*heal));} // Pyrrhus gets no fresh men from Epirus
    if(f!==PLAYER&&s.bld.walls&&s.units.length<2&&G.turn%3===0&&G.gold[f]>500){ // an empty fort is manned again too
      const t=FACTIONS[f].roster.find(t=>{const T=UNITS[t];return(!T.req||T.req.lv===0)&&(T.kind==='inf'||T.kind==='spear');});
      if(t){G.gold[f]-=Math.round(UNITS[t].cost*.5);s.units.push(mkUnit(t,true));}}
  }
  if(G.gold[f]<0){let worst=null,ws=null;const k=u=>unitUpk(u.type,f)+(isMerc(u.type)?1000:0); // hired men are the first to go
    for(const s of [...ownedBy(f),...heldPasses(f)])for(const u of s.units)if(u.type!=='general'&&!u.pyr&&(!worst||k(u)>k(worst))){worst=u;ws=s;}
    if(worst){ws.units=ws.units.filter(u=>u!==worst);if(f===PLAYER)report('💰',isMerc(worst.type)?`Unpaid, the ${UNITS[worst.type].name} in ${sname(ws)} walked off to find a better paymaster. Keep the treasury above zero.`:`Unpaid, the ${UNITS[worst.type].name} in ${sname(ws)} deserted. Keep the treasury above zero.`,ws.id);}}
}
function rebelTick(){for(const s of ownedBy('rebels')){s.pop=Math.round(s.pop*1.006);
  for(const u of s.units)u.men=Math.min(UNITS[u.type].men,u.men+Math.ceil(UNITS[u.type].men*.1));
  if(s.units.length<3&&Math.random()<.25)s.units.push(mkUnit(pick(['rb_mil','rb_spear','rb_sling']),false));}}

/* ================= TURN CHECKLIST: loose ends shown before the turn ends ================= */
const CHK_KEY='imperivm-check';let chkOn=true;try{chkOn=localStorage.getItem(CHK_KEY)!=='0';}catch(e){}
function dangerTo(t){ // the strongest rival army next door that could attack t (a city or pass of the player's) this coming turn, by the AI's own rules and with the men it has now; null if none
  if(G.turn<4)return null; // the AI leaves the player alone for the first turns
  let worst=null;const add=(f,ap,from,us)=>{if(!worst||ap>worst.ap)worst={f,ap,from,n:us.length,men:sumMen(us)};}; // from: where that army stands now
  for(const id of moveTargets(t.id)){const s=G.s[id],f=s.owner;if(!f||f===PLAYER||f==='rebels'||!s.units.length||hidAmb(s))continue; // an unseen ambush gives no warning
    if(s.pass){ // an army camped on the road strikes either end with all but a fort's two best units (the pass-army loop in aiTurn)
      const free=campFree(s);if(!free.length)continue;
      const ap=armyPower(free),dp=t.units.length?(armyPower(t.units)+reliefPower(t,s))*(1+.15*t.bld.walls):0;
      if(!dp||ap>=dp*AI_EDGE/aggrOf(f,PLAYER))add(f,ap,id,free);continue;}
    const gate=t.pass?null:gateOn(s.id,t.id);if(blocksFor(gate,f))continue; // a camp on the road meets them first (when it's ours, it gets its own check)
    const q=t.pass?null:siegeOf(t.id,f),ours=q&&q.from===id;
    const free=aiFree(s,f,t.id).concat(gate&&gate.owner===f?campFree(gate):[],ours?siegeUnits(q,s).filter(u=>!u.moved):[]);if(!free.length)continue;
    const w2=ours&&q.t>=1?.5:1,k=aiStrike(f,free,t,s,w2,w2);if(k)add(f,k.ap,id,k.send);}
  return worst;
}
const dangerScan=()=>{const d={};if(G.turn>=4)for(const s of [...ownedBy(PLAYER),...heldPasses(PLAYER)]){const x=dangerTo(s);if(x)d[s.id]=x;}return d;}; // the map's ⚠️ markers: every place of the player's that dangerTo flags
const revoltRisk=s=>G.cap[PLAYER]!==s.id&&s.units.length<2&&order({...s,unrest:Math.max(0,s.unrest-5)})<20; // as econTick will judge it, after this turn's unrest has faded
function easyTargets(){ // ready armies standing next to a prize they would take with overwhelming odds (as forcesBody rates them)
  const out=[];
  for(const s of [...ownedBy(PLAYER),...heldPasses(PLAYER)]){const av=s.units.filter(u=>!u.moved);if(!av.length)continue;const ap=armyPower(av);let best=null;
    for(const id of moveTargets(s.id)){if(!isFoeTarget(id))continue;const t0=G.s[id],gate=!s.pass&&!t0.pass?gateOn(s.id,id):null,t=seenBlock(gate)?gate:t0;
      const dp=t.units.length?(armyPower(t.units)+reliefPower(t,s))*(1+.15*t.bld.walls):0,r=dp?ap/dp:1e9;
      if(r>1.6&&(!best||r>best.r))best={s,t,r,empty:!dp};}
    if(best)out.push(best);}

}
function turnItems(){ // [icon, title, text, places to jump to]
  const out=[],gold=G.gold[PLAYER],net=netIncome(PLAYER),own=ownedBy(PLAYER);
  const go=(s,tab,lbl)=>`<button class="jump" data-v="go:${s.id}:${tab}">${lbl}</button>`;
  if(gold+net<0)out.push(['💰','The treasury will run dry',`Upkeep outruns income by ${fmt(-net)} a turn, leaving you at ${fmt(gold+net)} gold — and a unit deserts every turn the treasury stays below zero.`,'']);
  const dz=[...own,...heldPasses(PLAYER)].map(s=>[s,dangerTo(s)]).filter(x=>x[1]);
  if(dz.length)out.push(['⚠️','In danger','A rival next door has the men to attack right now. Reinforce, or expect a fight.',dz.map(([s,d])=>go(s,'army',`<span class="sw" style="background:${FACTIONS[d.f].color}"></span>${sname(s)}`)).join('')]);
  const sg=own.filter(s=>besieged(s));
  if(sg.length)out.push(['⛺','Under siege','No taxes, no recruits, and from the second turn the garrison starves. Attack the besieging army to break the siege.',sg.map(s=>go(s,'army',sname(s))).join('')]);
  const rv=own.filter(revoltRisk);
  if(rv.length)out.push(['🔥','Revolt brewing','Order is under 20% and fewer than two units keep the peace, so a revolt can break out this turn. Lower taxes or march in troops.',rv.map(s=>go(s,'govern',`${sname(s)} · ${order(s)}%`)).join('')]);
  const idle=own.filter(s=>!s.build&&BKEYS.some(k=>{const lv=s.bld[k];return lv<Math.min(3,tier(s))&&projCost(s,{k,lv})<=gold;}));
  if(idle.length)out.push(['🔨','Nothing being built','There is gold enough to start a building here.',idle.map(s=>go(s,'build',sname(s))).join('')]);
  const ez=easyTargets();
  if(ez.length)out.push(['⚔️','Easy pickings','Your ready troops here would attack with overwhelming odds.',ez.map(e=>go(e.s,'army',`${sname(e.s)} → ${sname(e.t)}${e.empty?' · empty':''}`)).join('')]);

}
async function turnCheck(){ // resolves 'end' to go on with the turn, 'back' to stay, or 'go:<place>:<tab>' to jump there
  const items=turnItems();if(!items.length)return'end';
  return modal({title:'Before the turn ends',body:items.map(([ico,t,d,j])=>`<div class="row chk"><div class="ico">${ico}</div><div class="main"><div class="t">${t}</div><div class="d">${d}</div>${j?`<div class="jumps">${j}</div>`:''}</div></div>`).join('')+'<div class="chk-foot">Tap a name to go there. This list can be switched off in the menu.</div>',
    buttons:[{label:'End turn',value:'end',cls:'primary'},{label:'Back to the map',value:'back'}]});
}
async function endTurn(){

  UI.busy=true;UI.undo=[];AU.ui('endturn');cancelMove();closeSheet();G.reports=[];
  $('#busy').classList.remove('hidden');

    rebelTick();siegeTick();mercTick();G.turn++;pyrrhusTick();coalTick();

function showReports(list,title){ // resolves 'go:<place>:<tab>' when a dispatch is tapped

}
async function checkEnd(){
  const n=ownedBy(PLAYER).length;

  if(!n&&!G.lost){G.lost=true;save();AU.stinger('defeat');
    await modal({title:S.fallT,body:`<p>${S.fall}</p>`,buttons:[{label:'Start a new campaign',value:1,cls:'primary'}]});

    await modal({title:'Triumph',body:`<p>You hold ${n} cities. ${S.triumph}</p><p>You can keep playing to finish off your rivals.</p>`,buttons:[{label:'Continue the campaign',value:1,cls:'gold'}]});return true;}
  return false;
}
