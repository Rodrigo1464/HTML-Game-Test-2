<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Imperivm">
<meta name="theme-color" content="#1a120b">
<title>Imperivm</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
  --hud:#1a120b; --hud-2:#2a1d12; --hud-ink:#f1e3c2; --hud-dim:#b59d74; --hud-line:rgba(240,210,150,.18);
  --panel:#f2e7cf; --panel-2:#e6d7b5; --ink:#2a1c10; --ink-2:#6e5a3d; --line:rgba(70,45,20,.18);
  --red:#a8281d; --gold:#c99a35; --good:#3c7a3a; --bad:#b0362a; --warn:#a87a1f;
  --serif:'EB Garamond','Iowan Old Style',Palatino,Georgia,serif;
  --display:'Cinzel','Trajan Pro',Optima,'Times New Roman',serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel:#211910; --panel-2:#30251a; --ink:#f0e2c3; --ink-2:#b49c74; --line:rgba(240,215,170,.14);
    --red:#d4553f; --gold:#dcaa47; --good:#6bb065; --bad:#e0644f; --warn:#d8a640;
  }
}
:root[data-theme="dark"]{
  --panel:#211910; --panel-2:#30251a; --ink:#f0e2c3; --ink-2:#b49c74; --line:rgba(240,215,170,.14);
  --red:#d4553f; --gold:#dcaa47; --good:#6bb065; --bad:#e0644f; --warn:#d8a640;
}
html{height:100%;background:var(--hud);scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--hud);color:var(--ink);font-family:var(--serif);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%}
#app{position:relative;height:100%;width:100%;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.hidden{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-appearance:none;appearance:none;padding:0}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn{min-height:42px;padding:0 14px;border-radius:11px;font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.04em}
.btn.primary{background:linear-gradient(180deg,#b8362a,#86201a);color:#fff3dc;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.btn.gold{background:linear-gradient(180deg,#e2b655,#ad8020);color:#22160a;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.btn.ghost{background:var(--panel-2);color:var(--ink)}
.btn.sm{min-height:34px;padding:0 11px;font-size:12px}
.btn:disabled{opacity:.38;cursor:default}

/* Title */
#title{z-index:40;background:radial-gradient(120% 75% at 50% 28%,#3d2a17 0%,#1b120a 58%,#0e0905 100%);color:var(--hud-ink);align-items:center;justify-content:center;text-align:center;padding:24px;gap:12px}
#title h1{font-family:var(--display);font-weight:900;font-size:clamp(42px,13vw,68px);letter-spacing:.14em;margin:0;color:#efcd78;text-shadow:0 2px 0 #5a3d12,0 0 34px rgba(240,190,90,.22)}
.t-sub{font-family:var(--display);color:#c9a764;letter-spacing:.2em;font-size:13px}
#title p{max-width:330px;color:#d6c39c;font-size:17px;line-height:1.45;margin:6px 0 0}
.t-btns{display:flex;flex-direction:column;gap:10px;width:min(300px,88%);margin-top:16px}
.t-btns .btn{min-height:52px;font-size:15px}
.t-btns .btn.ghost{background:rgba(255,240,210,.08);color:var(--hud-ink);border:1px solid var(--hud-line)}
.t-snd{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;width:42px;height:42px;border-radius:12px;background:rgba(255,240,210,.08);border:1px solid var(--hud-line);font-size:19px;z-index:3}
#title.gated .t-btns{opacity:0;pointer-events:none}
.t-btns{transition:opacity .9s .2s}
#tapGate{position:absolute;inset:0;z-index:8;display:grid;place-items:end center;padding-bottom:max(60px,22%);background:rgba(14,9,5,.18);font-family:var(--display);letter-spacing:.32em;color:#efcd78;font-size:14px;transition:opacity .7s}
#tapGate span{animation:pulse 1.8s ease-in-out infinite}
#tapGate.off{opacity:0;pointer-events:none}

/* Campaign */
#campaign{z-index:1}
#topbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(180deg,#25190f,#1a120b);color:var(--hud-ink);border-bottom:1px solid #4a3620;z-index:5}
.emblem{font-family:var(--display);font-weight:900;font-size:11px;letter-spacing:.1em;color:#1a120b;background:linear-gradient(180deg,#e7bd5a,#a87a22);border-radius:6px;padding:7px 7px}
.tb-date{font-family:var(--display);font-size:14px;letter-spacing:.05em}
.tb-sub{font-size:13px;color:var(--hud-dim)}
.tb-gold{margin-left:auto;text-align:right;font-family:var(--display);font-size:17px;color:#f0cf7a;line-height:1.1}
.tb-gold small{display:block;font-family:var(--serif);font-size:13px}
.tb-gold small.neg{color:#ff9c86}
.icon-btn{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.07);display:grid;place-items:center;font-size:19px;color:var(--hud-ink)}
#mapWrap{position:relative;flex:1 1 auto;min-height:0}
#mapScroll{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;background:#1d3c49;overscroll-behavior:contain}
#mapInner{position:relative}
#mapCanvas,#mapSvg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.road{fill:none;stroke:#6e4c2a;stroke-width:2.2;stroke-dasharray:6 4;opacity:.7;stroke-linecap:round}
.sea-route{fill:none;stroke:#d9eef0;stroke-width:2;stroke-dasharray:1.5 5;stroke-linecap:round;opacity:.85}
.route-hl{fill:none;stroke:#f0c75a;stroke-width:4.5;stroke-linecap:round;stroke-dasharray:10 6;animation:march .8s linear infinite}
.route-hl.foe{stroke:#e2553f}
@keyframes march{to{stroke-dashoffset:-16}}
.node{cursor:pointer}
.node .hit{fill:transparent}
.node .town{fill:#f6edd6;stroke-width:3.5}
.node .walls{fill:none;stroke:#3d2c1a;stroke-width:2;stroke-dasharray:3 2}
.node .lbl{font-family:var(--display);font-weight:700;font-size:11.5px;fill:#26180c;text-anchor:middle;paint-order:stroke;stroke:#f2e6c8;stroke-width:3.2px;stroke-linejoin:round;letter-spacing:.03em}
.node .sel-ring{fill:none;stroke:#f4cd5c;stroke-width:3;animation:pulse 1.2s ease-in-out infinite}
.node .tgt-ring{fill:rgba(240,200,90,.2);stroke:#f0c75a;stroke-width:2.5;stroke-dasharray:4 3}
.node.foe .tgt-ring{fill:rgba(226,85,63,.22);stroke:#e2553f}
@keyframes pulse{50%{opacity:.3}}
.badge text{font-family:var(--display);font-size:11px;font-weight:700;fill:#fff;text-anchor:middle}
.badge rect{stroke:#1d130a;stroke-width:1.2}
.badge.ready rect{stroke:#f4cd5c;stroke-width:2.4}
.hint{position:absolute;top:10px;left:10px;right:10px;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:14px;background:rgba(26,18,11,.92);color:var(--hud-ink);font-size:15px;z-index:4;border:1px solid var(--hud-line)}
.hint span{flex:1}
.hint .btn.ghost{background:rgba(255,240,210,.12);color:var(--hud-ink)}
.fab-row{position:absolute;left:10px;right:10px;bottom:12px;display:flex;align-items:flex-end;gap:8px;pointer-events:none;z-index:3}
.fab-row>*{pointer-events:auto}
.zoom{display:flex;flex-direction:column;gap:6px}
.zoom button,#btnNext{background:rgba(26,18,11,.88);color:var(--hud-ink);border:1px solid var(--hud-line);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.zoom button{width:44px;height:44px;border-radius:12px;font-size:22px}
#btnNext{height:50px;padding:0 14px;border-radius:14px;font-family:var(--display);font-size:13px;letter-spacing:.03em}
#btnEnd{margin-left:auto;height:56px;padding:0 22px;border-radius:16px;background:linear-gradient(180deg,#bd392c,#86201a);color:#fff3dc;font-family:var(--display);font-weight:700;letter-spacing:.05em;font-size:15px;box-shadow:0 6px 20px rgba(110,20,10,.5),inset 0 1px 0 rgba(255,255,255,.25);border:1px solid #5e140f}
.busy{position:absolute;inset:0;z-index:10;background:rgba(14,9,5,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--hud-ink);font-family:var(--display);letter-spacing:.06em;font-size:14px}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(240,210,150,.25);border-top-color:#efcd78;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 3D campaign map */
#mapGL{position:absolute;inset:0;background:#93bccb}
#mapGL canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#cmLabels{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.clab{position:absolute;left:0;top:0;display:flex;align-items:center;gap:4px;padding:1px 7px;border-radius:7px;background:rgba(244,234,208,.93);border:2px solid var(--fc,#888);box-shadow:0 2px 6px rgba(0,0,0,.35);white-space:nowrap;font-family:var(--display);font-weight:700;font-size:11.5px;color:#26180c;letter-spacing:.03em;will-change:transform}
.clab .cb{background:var(--fc,#888);color:#fff;border-radius:5px;padding:0 5px;margin-right:-4px;font-size:11px;line-height:16px}
.clab .cb.ready{outline:2px solid #f4cd5c}
.clab .cs{font-size:11px}
.clab.foe{border-color:#e2553f}
.busy.pill{inset:auto;top:62px;left:50%;right:auto;transform:translateX(-50%);flex-direction:row;gap:10px;padding:8px 16px;border-radius:999px;background:rgba(26,18,11,.92);border:1px solid var(--hud-line);font-size:13px;white-space:nowrap;pointer-events:none}
.busy.pill .spin{width:18px;height:18px;border-width:2px}

/* Sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:64%;display:flex;flex-direction:column;background:var(--panel);color:var(--ink);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.4);z-index:6;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
.sh-head{display:flex;align-items:center;gap:10px;padding:12px 14px 6px}
.sh-flag{width:8px;height:40px;border-radius:3px}
.sh-head h3{margin:0;font-family:var(--display);font-size:19px;letter-spacing:.04em}
.sh-sub{font-size:14px;color:var(--ink-2)}
.sh-x{margin-left:auto;width:38px;height:38px;border-radius:10px;background:var(--panel-2);font-size:22px;line-height:1}
.chips{display:flex;gap:6px;padding:2px 14px 8px;flex-wrap:wrap}
.chip{font-size:13px;padding:4px 9px;border-radius:999px;background:var(--panel-2)}
.chip.bad{color:var(--bad)} .chip.good{color:var(--good)}
.tabs{display:flex;padding:0 8px;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:10px 2px;font-family:var(--display);font-size:12.5px;letter-spacing:.04em;color:var(--ink-2);border-bottom:2.5px solid transparent}
.tab.on{color:var(--red);border-color:var(--red)}
.sh-body{flex:1 1 auto;overflow:auto;padding:10px 12px 12px;-webkit-overflow-scrolling:touch;touch-action:pan-y;min-height:120px}
.sh-foot{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.sh-foot .grow{flex:1}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ucard{display:flex;gap:8px;align-items:center;padding:8px;border-radius:12px;background:var(--panel-2);border:2px solid transparent;text-align:left;width:100%}
.ucard.pick{border-color:var(--gold);box-shadow:inset 0 0 0 999px rgba(201,154,53,.12)}
.ucard.dim{opacity:.55}
.ucard .main{min-width:0;flex:1}
.uname{font-weight:600;font-size:15px;line-height:1.1}
.umeta{font-size:12.5px;color:var(--ink-2)}
.ubar{height:4px;border-radius:2px;background:rgba(0,0,0,.15);margin-top:4px;overflow:hidden}
.ubar i{display:block;height:100%;background:var(--good)}
.xp{color:var(--gold);font-size:11px}
.row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--panel-2);margin-bottom:8px}
.row .ico{font-size:22px;width:30px;text-align:center;flex:0 0 auto}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;font-size:15.5px}
.row .d{font-size:13px;color:var(--ink-2);line-height:1.3}
.note{font-size:14px;color:var(--ink-2);padding:4px 2px 10px;line-height:1.4}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.seg button{padding:10px 2px;border-radius:10px;background:var(--panel-2);font-family:var(--display);font-size:12px}
.seg button.on{background:var(--red);color:#fff3dc}
.ledger{width:100%;border-collapse:collapse;font-size:14.5px;margin-bottom:12px}
.ledger td{padding:5px 2px;border-bottom:1px solid var(--line)}
.ledger td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.ledger tr.tot td{font-weight:600;border-bottom:0}
.ledger caption{text-align:left;font-family:var(--display);font-size:13px;color:var(--ink-2);padding:6px 0}
.neg{color:var(--bad)} .pos{color:var(--good)}

/* Modal */
#modal{position:absolute;inset:0;background:rgba(10,6,3,.62);display:grid;place-items:center;z-index:50;padding:16px}
.mcard{width:min(440px,100%);max-height:100%;overflow:auto;background:var(--panel);color:var(--ink);border-radius:18px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:up .18s ease-out}
.mcard h2{font-family:var(--display);margin:0 0 10px;font-size:22px;letter-spacing:.05em;text-align:center}
.mbody{font-size:16px;line-height:1.45}
.mbody p{margin:0 0 10px}
.mbody ul{padding-left:20px;margin:0 0 10px}
.mbody li{margin-bottom:6px}
.mbtns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.mbtns .btn{min-height:48px;font-size:14px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start;margin:6px 0 10px}
.vs .side{background:var(--panel-2);border-radius:12px;padding:10px;text-align:center}
.vs .nm{font-family:var(--display);font-size:13px;margin-bottom:6px}
.vs .icons{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin-bottom:6px}
.vs .d{font-size:13px;color:var(--ink-2)}
.vsx{font-family:var(--display);font-weight:900;color:var(--red);align-self:center}
.odds{text-align:center;font-size:15px}
.odds.good b{color:var(--good)} .odds.warn b{color:var(--warn)} .odds.bad b{color:var(--bad)}
.rep{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.ftab{width:100%;border-collapse:collapse;font-size:14.5px}
.ftab td{padding:7px 4px;border-bottom:1px solid var(--line)}
.ftab .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
#toast{position:absolute;left:50%;top:76px;transform:translate(-50%,-10px);opacity:0;transition:.2s;z-index:60;background:rgba(26,18,11,.94);color:var(--hud-ink);padding:10px 16px;border-radius:999px;font-size:15px;max-width:90%;text-align:center;pointer-events:none;border:1px solid var(--hud-line)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* Battle */
#battle{z-index:20;background:#1a120b;color:var(--hud-ink)}
.b-top{padding:8px 12px;background:linear-gradient(180deg,#25190f,#1a120b);border-bottom:1px solid #4a3620}
.b-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.b-title{font-family:var(--display);font-size:15px;letter-spacing:.04em}
.b-round{font-size:14px;color:var(--hud-dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.b-bars{display:flex;gap:8px;margin-top:6px;align-items:center}
.bbar{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.bbar i{display:block;height:100%;transition:width .3s}
.bvs{font-size:12px;color:var(--hud-dim)}
#bField{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;background:#aec6d4}
#bGL{position:absolute;inset:0}
#bGL canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#bLabels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.blab{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px;pointer-events:auto;cursor:pointer}
.blab .usym{display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.55))}
.blab i{display:block;width:24px;height:3px;border-radius:2px;background:rgba(0,0,0,.55);overflow:hidden}
.blab i b{display:block;height:100%;background:#7fd36e}
.blab.mine .usym rect{stroke:#ffe9b0}
.blab.sel .usym rect{stroke:#ffd166;stroke-width:3.5}
.blab.rout{opacity:.8}
.blab.rout .usym{animation:pulse .7s infinite}
.bfloat{position:absolute;transform:translate(-50%,-100%);font-family:var(--display);font-weight:900;font-size:13px;letter-spacing:.04em;white-space:nowrap;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 2px #000;animation:floatUp 1.1s ease-out forwards}
@keyframes floatUp{to{transform:translate(-50%,-170%);opacity:0}}
.b-banner{position:absolute;top:58px;left:50%;transform:translateX(-50%);background:rgba(20,14,8,.88);color:#f1e3c2;padding:8px 16px;border-radius:999px;font-family:var(--display);font-size:13px;letter-spacing:.06em;border:1px solid var(--hud-line);white-space:nowrap}
.b-speed{position:absolute;top:10px;right:10px;display:flex;border-radius:12px;overflow:hidden;border:1px solid var(--hud-line);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.b-speed button{width:42px;height:38px;background:rgba(26,18,11,.86);color:var(--hud-ink);font-family:var(--display);font-size:13px}
.b-speed button.on{background:#a8281d;color:#fff3dc}
.b-cam{position:absolute;left:10px;bottom:10px;display:flex;gap:6px}
.b-cam button{width:42px;height:42px;border-radius:12px;background:rgba(26,18,11,.86);color:var(--hud-ink);border:1px solid var(--hud-line);font-size:20px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.b-panel{flex:0 0 auto;background:var(--panel);color:var(--ink);border-radius:16px 16px 0 0;padding:8px 10px 10px;display:flex;flex-direction:column;gap:8px}
.b-info{min-height:54px;font-size:14px}
.b-cards{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-x;scrollbar-width:none;padding:1px}
.b-cards::-webkit-scrollbar{display:none}
.bcard{flex:0 0 auto;width:58px;padding:5px 3px 4px;border-radius:10px;background:var(--panel-2);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
.bcard .bn{font-family:var(--display);font-size:10.5px;font-weight:700;letter-spacing:.04em}
.bcard i{display:block;width:40px;height:4px;border-radius:2px;background:rgba(0,0,0,.18);overflow:hidden}
.bcard i b{display:block;height:100%}
.bcard.sel{border-color:var(--gold);box-shadow:inset 0 0 0 999px rgba(201,154,53,.14)}
.bcard.rout{border-color:var(--bad)}
.bcard.gone{opacity:.35}
.b-actions{display:flex;gap:8px}
.b-actions .btn{flex:1;min-height:46px;padding:0 6px}
.b-tip{line-height:1.4}
.bline{display:flex;gap:10px;align-items:center}
.bline .main{flex:1;min-width:0}
.bline .t{font-weight:600;font-size:15.5px}
.bline .d{font-size:13px;color:var(--ink-2);line-height:1.35}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="app">
  <section id="title" class="screen gated">
    <svg id="laurel" width="150" height="96" viewBox="-75 -60 150 96" aria-hidden="true"></svg>

<script>
(function(){
'use strict';
const SVGNS='http://www.w3.org/2000/svg';
const $=(s,el=document)=>el.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmt=n=>Math.round(n).toLocaleString('en-US');
const probRound=x=>{x=Math.max(0,x);const f=Math.floor(x);return f+(Math.random()<x-f?1:0);};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hexRgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];}

/* ================= AUDIO: procedural music + sound effects (no audio files) ================= */
const AU=(()=>{
  const KEY='imperivm-sound';
  let mode=0;try{mode=clamp(parseInt(localStorage.getItem(KEY),10)||0,0,2);}catch(e){} // 0 music+effects, 1 effects only, 2 muted
  let ctx=null,out,musBus,fxBus,verbIn,noiseBuf,want=null,cur=null,amb=null,off=false,t0=0;
  const bs={phase:'deploy',tg:.3,lv:.3},last={};
  const mf=n=>440*Math.pow(2,(n-69)/12);
  const now=()=>ctx.currentTime+t0;
  const ok=()=>!!ctx&&(off||ctx.state==='running')&&mode<2;
  const lim=(k,gap)=>{const n=ctx.currentTime;if((last[k]||-9)>n-gap)return false;last[k]=n;return true;};

  function init(ext){
    if(ctx){if(!ext&&!off&&ctx.state!=='running'&&!document.hidden)ctx.resume().catch(()=>{});return true;}
    const AC=window.AudioContext||window.webkitAudioContext;
    try{ctx=ext||new AC();}catch(e){ctx=null;return false;}
    try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
    const comp=ctx.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=20;comp.ratio.value=5;comp.attack.value=.004;comp.release.value=.3;
    out=ctx.createGain();out.gain.value=.9;out.connect(comp);comp.connect(ctx.destination);
    musBus=ctx.createGain();fxBus=ctx.createGain();musBus.connect(out);fxBus.connect(out);
    const sr=ctx.sampleRate,len=Math.floor(sr*2.4),ir=ctx.createBuffer(2,len,sr); // a synthetic hall for the reverb
    for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
    const cv=ctx.createConvolver();cv.buffer=ir;verbIn=ctx.createGain();const vo=ctx.createGain();vo.gain.value=.55;verbIn.connect(cv);cv.connect(vo);vo.connect(out);
    const nl=Math.floor(sr*3);noiseBuf=ctx.createBuffer(1,nl,sr);const nd=noiseBuf.getChannelData(0);for(let i=0;i<nl;i++)nd[i]=Math.random()*2-1;
    applyMode(true);
    if(!ext){setInterval(tick,40);if(want)music(want.name,want.o);}
    return true;
  }
  function applyMode(imm){
    if(!ctx)return;const t=ctx.currentTime;
    musBus.gain.setTargetAtTime(mode===0?.42:0,t,imm?.001:.15);fxBus.gain.setTargetAtTime(mode===2?0:.85,t,imm?.001:.05);
    if(mode===2&&amb)ambient(false);
  }

  /* ---- synthesis primitives ---- */
  function route(n,o){
    if(o.pan&&ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=clamp(o.pan,-1,1);n.connect(p);n=p;}
    n.connect(o.bus||fxBus);
    if(o.send){const s=ctx.createGain();s.gain.value=o.send;n.connect(s);s.connect((o.bus&&o.bus._s)||verbIn);}
  }
  function env(g,t,a,d,r,v){d=Math.max(d,a);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.setValueAtTime(v,t+d);g.gain.exponentialRampToValueAtTime(.0001,t+d+r);return t+d+r;}
  function tone(o){
    const t=o.t,osc=ctx.createOscillator();osc.type=o.type||'sine';
    if(o.from){osc.frequency.setValueAtTime(o.f*o.from,t);osc.frequency.exponentialRampToValueAtTime(o.f,t+(o.gl||.06));}else osc.frequency.value=o.f;
    if(o.det)osc.detune.value=o.det;
    let n=osc;
    if(o.lp){const fl=ctx.createBiquadFilter();fl.type=o.ft||'lowpass';fl.Q.value=o.q||.7;fl.frequency.setValueAtTime(o.lp,t);if(o.lp2)fl.frequency.exponentialRampToValueAtTime(o.lp2,t+(o.lpt||.3));n.connect(fl);n=fl;}
    const e=ctx.createGain(),end=env(e,t,o.a??.01,o.d??.2,o.r??.1,o.g??.2);n.connect(e);route(e,o);
    if(o.vib){const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=o.vib.rate||5;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(o.vib.depth,t+(o.vib.delay||.2));lfo.connect(lg);lg.connect(osc.frequency);lfo.start(t);lfo.stop(end+.05);}
    osc.start(t);osc.stop(end+.05);
  }
  function noise(o){
    const t=o.t,s=ctx.createBufferSource();s.buffer=noiseBuf;s.loop=true;
    const fl=ctx.createBiquadFilter();fl.type=o.ft||'bandpass';fl.Q.value=o.q||1;fl.frequency.setValueAtTime(o.f||1000,t);
    if(o.f2)fl.frequency.exponentialRampToValueAtTime(o.f2,t+(o.d??.1)+(o.r??.05));
    const e=ctx.createGain(),end=env(e,t,o.a??.003,o.d??.1,o.r??.05,o.g??.2);s.connect(fl);fl.connect(e);route(e,o);
    s.start(t,Math.random()*2);s.stop(end+.05);
  }
  /* ---- instruments ---- */
  const pad=(t,f,d,v,b)=>{for(const det of[-8,8])tone({t,f,d,type:'sawtooth',det,g:.032*v,a:Math.min(1.4,d*.4),r:1.5,lp:950,q:.4,bus:b,send:.35});};
  const horn=(t,f,d,v,b,s=.3)=>{for(const det of[-6,6])tone({t,f,d,type:'sawtooth',det,g:.07*v,a:Math.min(.14,d*.4),r:.3,from:.965,gl:.09,lp:f*1.8,lp2:f*4.5,lpt:.25,q:.9,bus:b,send:s});};
  const flute=(t,f,d,v,b)=>{tone({t,f,d,g:.16*v,a:.09,r:.28,vib:{rate:5,depth:f*.006,delay:.25},bus:b,send:.5,pan:.2});tone({t,f:f*2,d,g:.025*v,a:.12,r:.2,bus:b,send:.5});noise({t,d,g:.025*v,a:.1,r:.2,f:f*2.5,q:3,bus:b,send:.4});};
  const pluck=(t,f,v,b,pan)=>{tone({t,f,type:'triangle',d:.01,a:.004,r:1,g:.2*v,lp:f*6,lp2:f*1.2,lpt:.5,bus:b,pan,send:.35});tone({t,f:f*2,d:.01,a:.003,r:.35,g:.05*v,bus:b,pan,send:.3});};
  const bell=(t,f,v,b)=>{for(const[r,g]of[[1,.1],[2.76,.05],[5.4,.03]])tone({t,f:f*r,d:.01,r:3.2,g:g*v,bus:b,send:.5});};
  const timp=(t,v,b)=>{tone({t,f:56,from:2.4,gl:.14,d:.02,r:1.1,g:.7*v,bus:b,send:.25});tone({t,f:112,from:1.8,gl:.1,d:.01,r:.45,g:.22*v,bus:b});noise({t,d:.02,r:.12,ft:'lowpass',f:500,g:.3*v,bus:b});};
  const taiko=(t,v,b)=>{tone({t,f:46,from:3,gl:.1,d:.02,r:.7,g:.95*v,bus:b,send:.2});noise({t,d:.02,r:.1,f:240,q:.8,g:.45*v,bus:b});tone({t,f:140,from:1.5,gl:.04,type:'triangle',d:.01,r:.12,g:.25*v,bus:b});};
  const snare=(t,v,b)=>{noise({t,d:.03,r:.14,f:2400,q:.7,g:.35*v,bus:b});tone({t,f:200,from:1.4,gl:.04,type:'triangle',d:.01,r:.08,g:.18*v,bus:b});};
  const bodhran=(t,v,b,pan)=>{tone({t,f:150,from:1.7,gl:.05,d:.01,r:.28,g:.5*v,bus:b,pan,send:.2});noise({t,d:.01,r:.07,f:1100,q:1.2,g:.1*v,bus:b,pan});};
  const crash=(t,v,b)=>noise({t,d:.02,r:1.6,ft:'highpass',f:5200,q:.5,g:.12*v,bus:b,send:.3});

  /* ---- music: step sequencers, scheduled a little ahead of the audio clock ---- */
  const MENU={bpm:62,
    ch:[{b:38,p:[50,53,57]},{b:34,p:[50,53,58]},{b:43,p:[50,55,58]},{b:33,p:[52,57,61]},{b:38,p:[50,53,57]},{b:41,p:[53,57,60]},{b:36,p:[52,55,60]},{b:33,p:[52,57,61]}],
    mel:[[[0,74,4],[4,72,2],[6,70,2]],[[0,70,4],[4,72,2],[6,74,2]],[[0,77,4],[4,74,2],[6,70,2]],[[0,69,2],[2,73,2],[4,76,4]],
         [[0,81,4],[4,77,2],[6,74,2]],[[0,77,4],[4,72,2],[6,69,2]],[[0,72,3],[3,76,1],[4,79,4]],[[0,76,2],[2,74,2],[4,73,2],[6,69,2]]]};
  function menuStep(tr,i,t){ // slow, stately D minor: horns over strings and timpani; the harp joins on every second pass
    const sd=60/MENU.bpm/2,b=tr.tb,bar=(i>>3)%8,s=i&7,loop=i>>6,c=MENU.ch[bar];
    if(s===0){
      for(const n of c.p)pad(t,mf(n),8*sd+.4,1,b);
      tone({t,f:mf(c.b),d:8*sd-.3,a:.08,r:.8,g:.26,bus:b});
      tone({t,f:mf(c.b),type:'sawtooth',d:8*sd-.3,a:.15,r:.8,g:.05,lp:200,bus:b});
      timp(t,.85,b);
    }
    if(s===4&&bar%2===1)timp(t,.35,b);
    if(bar===7&&s>=4&&s%2===0)timp(t,.25+.1*(s-4),b);
    for(const[ns,n,l]of MENU.mel[bar])if(ns===s){horn(t,mf(n),l*sd*.97,.75+.15*(loop%2),b,.45);if(loop%2===1)flute(t,mf(n+12),l*sd*.9,.55,b);}
    if(loop%2===1)pluck(t,mf(c.p[[0,1,2,1,2,1,0,1][s]]+12),.5,b,s%2?.3:-.3);
  }
  const CD={Dm:{b:38,t:[57,62,65,69,74],p:[50,53,57]},C:{b:36,t:[55,60,64,67,72],p:[48,52,55]},G:{b:43,t:[55,59,62,67,71],p:[50,55,59]},Am:{b:45,t:[57,60,64,69,72],p:[48,52,57]}};
  const CPROG=[['Dm','C','Dm','Am'],['Dm','G','C','Dm'],['Dm','Am','G','C'],['Am','C','G','Dm']];
  const CPAT=[[0,2,1,3,2,4,3,2],[0,1,2,3,4,3,2,1],[0,2,3,2,1,2,3,4]];
  const SCALE=[62,64,65,67,69,71,72,74,76,77,79,81]; // D dorian
  function campStep(tr,i,t){ // calm and open: lyre arpeggios, a wandering flute, a soft frame drum — never the same twice
    const sd=60/74/2,b=tr.tb,st=tr.st,bar=i>>3,s=i&7;
    if(s===0){
      if(bar%4===0){let p;do p=Math.floor(Math.random()*CPROG.length);while(p===st.p);st.p=p;st.blk=(st.blk||0)+1;}
      const ch=CD[CPROG[st.p][bar%4]];st.ch=ch;st.pat=pick(CPAT);
      for(const n of ch.p)pad(t,mf(n),8*sd+.5,.5,b);
      tone({t,f:mf(ch.b),d:8*sd-.2,a:.1,r:1,g:.24,bus:b});
      if(bar%2===0)tone({t,f:mf(ch.b+7),type:'triangle',d:16*sd-.3,a:.4,r:1.2,g:.05,lp:500,bus:b});
      if(bar%2===0&&bar>0&&Math.random()<.72){
        let idx=st.mi??7,pos=0;const n=3+Math.floor(Math.random()*3);
        for(let k=0;k<n&&pos<13;k++){idx=clamp(idx+pick([-2,-1,-1,1,1,2]),2,10);const d=pick([2,2,3,4]);flute(t+pos*sd,mf(SCALE[idx]),d*sd*.95,.8,b);pos+=d+(Math.random()<.3?1:0);}
        st.mi=idx;
      }
    }
    if(Math.random()<.82)pluck(t,mf(st.ch.t[st.pat[s]]),s%4===0?.7:.45,b,s%2?.35:-.35);
    if(st.blk%2===0){const v=[.8,0,0,.4,.7,0,.4,0][s];if(v)bodhran(t,v*.5,b,s%2?.3:-.3);}
  }
  const BCH=[{b:38,s:[50,57,62,65]},{b:34,s:[46,53,58,62]},{b:36,s:[48,55,60,64]},{b:33,s:[45,52,57,61]}];
  const BMOT=[[[0,62,3],[3,62,1],[4,65,2],[6,69,2],[8,74,6]],[[0,72,3],[3,70,1],[4,69,2],[6,70,2],[8,65,6]],[[0,67,3],[3,67,1],[4,72,2],[6,76,2],[8,79,6]],[[0,76,3],[3,73,1],[4,69,2],[6,73,2],[8,76,4],[12,74,2],[14,73,2]]];
  const TAK=[1,0,0,.5,0,0,.7,0,.9,0,.4,.55,0,0,.65,.35],OST=[0,0,7,0,0,12,0,7];
  function battleStep(tr,i,t){ // before the clash: a slow war-drum heartbeat. After: driving taiko, strings, brass — it grows with the fighting
    const sd=60/126/4,b=tr.tb,bar=i>>4,s=i&15,c=BCH[bar%4];
    bs.lv+=(bs.tg-bs.lv)*.04;const lv=bs.lv;
    if(bs.phase==='deploy'){
      if(s===0){taiko(t,.55,b);if(bar%2===0){tone({t,f:mf(c.b),type:'sawtooth',d:32*sd-.4,a:1.2,r:1.5,g:.07,lp:170,bus:b});pad(t,mf(c.s[1]),32*sd,.5,b);pad(t,mf(c.s[3]),32*sd,.4,b);}}
      if(s===8)taiko(t,.3,b);
      if(bar%4===3&&s>=12)snare(t,.15+.08*(s-12),b);
      return;
    }
    if(TAK[s])taiko(t,TAK[s]*(.7+.3*lv),b);
    if(lv>.3&&(s===4||s===12))snare(t,.55+.2*lv,b);
    if(lv>.55&&(s===7||s===15))snare(t,.2,b);
    if(s%2===0)tone({t,f:mf(c.b+12+OST[s>>1]),type:'sawtooth',d:.07,a:.005,r:.07,g:.05+.04*lv,lp:1500,bus:b});
    if(s===0)tone({t,f:mf(c.b),type:'sawtooth',d:16*sd,a:.05,r:.3,g:.09,lp:220,bus:b});
    if(lv>.35){if(s===0)for(const n of[c.s[0],c.s[1]])horn(t,mf(n),14*sd,.8,b,.3);if(s===10)for(const n of[c.s[0],c.s[1]])horn(t,mf(n),2*sd,.7,b,.2);}
    if(lv>.6)for(const[ns,n,l]of BMOT[bar%4])if(ns===s)horn(t,mf(n),l*sd*.9,.85,b,.35);
    if(lv>.75){if(s%2===0)noise({t,d:.02,r:.05,ft:'highpass',f:6500,g:.04,bus:b});if(s===0&&bar%4===0)crash(t,1,b);}
    if(lv>.5&&bar%4===3&&s>=12)snare(t,.35+.1*(s-12),b);
    if(lv>.85&&s===0)for(const n of c.s)pad(t,mf(n+12),16*sd,1.2,b);
  }
  const TRACKS={menu:{sd:60/MENU.bpm/2,step:menuStep},campaign:{sd:60/74/2,step:campStep},battle:{sd:60/126/4,step:battleStep}};
  const mkBus=()=>{const g=ctx.createGain();g.connect(musBus);g._s=ctx.createGain();g._s.connect(verbIn);return g;};
  const busRamp=(g,t0_,t1,v)=>{for(const x of[g,g._s]){x.gain.cancelScheduledValues(t0_);x.gain.setValueAtTime(x.gain.value,t0_);x.gain.linearRampToValueAtTime(v,t1);}};
  function music(name,o){
    o=o||{};want={name,o};if(!ctx)return;if(cur&&cur.name===name)return;
    const t=ctx.currentTime,fade=o.fade||1.6,dl=o.delay||0;
    if(cur){const old=cur;busRamp(old.tb,t,t+fade,0);setTimeout(()=>{try{old.tb.disconnect();old.tb._s.disconnect();}catch(e){}},(fade+.5)*1000);cur=null;}
    if(!name||!TRACKS[name])return;
    const tb=mkBus();for(const x of[tb,tb._s]){x.gain.setValueAtTime(0,t+dl);x.gain.linearRampToValueAtTime(1,t+dl+fade);}
    cur={name,T:TRACKS[name],tb,i:0,next:t+dl+.08,st:{}};
  }
  function tick(){
    if(!ctx||ctx.state!=='running'||!cur)return;
    if(mode!==0){cur.next=Math.max(cur.next,ctx.currentTime+.05);return;} // music off: hold the place
    if(cur.next<ctx.currentTime-.3)cur.next=ctx.currentTime+.05;
    try{while(cur.next<ctx.currentTime+.35){cur.T.step(cur,cur.i,cur.next);cur.next+=cur.T.sd;cur.i++;}}
    catch(e){console.error(e);cur=null;}
  }
  function stinger(kind){
    if(!ctx||mode!==0||!(off||ctx.state==='running'))return;
    const t=ctx.currentTime+.05,b=mkBus(),dur=kind==='victory'?5.5:6.5;
    if(cur){const c=cur.tb;for(const x of[c,c._s]){x.gain.cancelScheduledValues(t);x.gain.setValueAtTime(x.gain.value,t);x.gain.linearRampToValueAtTime(.12,t+.25);x.gain.setValueAtTime(.12,t+dur);x.gain.linearRampToValueAtTime(1,t+dur+1.5);}}
    if(kind==='victory'){
      for(const[o,m,d]of[[0,62,.2],[.24,62,.2],[.48,62,.2],[.72,69,.55],[1.35,66,.25],[1.65,69,.25],[1.95,74,2.4]]){horn(t+o,mf(m),d,1.15,b,.4);horn(t+o,mf(m+12),d,.5,b,.4);}

function addPath(ctx,xy,k=1){ // smoothed closed path
  const n=xy.length,m=(i)=>{const a=xy[i%n],b=xy[(i+1)%n];return[(a[0]+b[0])/2/k,(a[1]+b[1])/2/k];};
  const s=m(0);ctx.moveTo(s[0],s[1]);

}

/* ================= TERRITORY GRID ================= */
const CELL=4, GW=Math.ceil(MW/CELL), GH=Math.ceil(MH/CELL);
let regionGrid=null;
const terrCanvas=document.createElement('canvas');terrCanvas.width=GW;terrCanvas.height=GH;
function buildRegions(){
  const mc=document.createElement('canvas');mc.width=GW;mc.height=GH;const m=mc.getContext('2d');
  m.fillStyle='#000';m.beginPath();for(const l of LAND)if(l.region)addPath(m,l.xy,CELL);m.fill();
  const data=m.getImageData(0,0,GW,GH).data;const land=new Uint8Array(GW*GH);
  for(let i=0;i<GW*GH;i++)land[i]=data[i*4+3]>100?1:0;
  regionGrid=new Int16Array(GW*GH).fill(-1);
  const pts=NODES.map(n=>[n.x/CELL,n.y/CELL]);const RMAX=150/CELL;
  const los=(x0,y0,x1,y1)=>{const st=Math.ceil(Math.hypot(x1-x0,y1-y0));for(let s=1;s<st;s++){const t=s/st,x=Math.floor(x0+(x1-x0)*t),y=Math.floor(y0+(y1-y0)*t);if(x<0||y<0||x>=GW||y>=GH||!land[y*GW+x])return false;}return true;};
  for(let gy=0;gy<GH;gy++)for(let gx=0;gx<GW;gx++){
    const idx=gy*GW+gx;if(!land[idx])continue;const cx=gx+.5,cy=gy+.5;
    const d=pts.map(([px,py],i)=>[(px-cx)**2+(py-cy)**2,i]).sort((a,b)=>a[0]-b[0]);
    for(let k=0;k<4;k++){const [dd,i]=d[k];if(Math.sqrt(dd)>RMAX)break;if(los(cx,cy,pts[i][0],pts[i][1])){regionGrid[idx]=i;break;}}
  }
}
function paintTerritory(){
  const ctx=terrCanvas.getContext('2d');const img=ctx.createImageData(GW,GH),d=img.data;
  const own=NODES.map(n=>G.s[n.id].owner);const rgb={};for(const f in FACTIONS)rgb[f]=hexRgb(FACTIONS[f].color);
  for(let gy=0;gy<GH;gy++)for(let gx=0;gx<GW;gx++){
    const idx=gy*GW+gx,r=regionGrid[idx];if(r<0)continue;
    const o=own[r];let [R,Gc,B]=rgb[o];let border=0;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const x=gx+dx,y=gy+dy;if(x<0||y<0||x>=GW||y>=GH)continue;const r2=regionGrid[y*GW+x];
      if(r2>=0&&r2!==r){border=Math.max(border,own[r2]!==o?2:1);}}
    let a=92;if(border===2){R*=.5;Gc*=.5;B*=.5;a=235;}else if(border===1){R*=.75;Gc*=.75;B*=.75;a=130;}
    const p=idx*4;d[p]=R;d[p+1]=Gc;d[p+2]=B;d[p+3]=a;
  }
  ctx.putImageData(img,0,0);
}

const DPR=Math.min(2,window.devicePixelRatio||1);
const mapCanvas=$('#mapCanvas');mapCanvas.width=MW*DPR;mapCanvas.height=MH*DPR;
function spaced(ctx,text,x,y,size,rot,color,sp){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.font=`700 ${size}px Cinzel,'Times New Roman',serif`;ctx.fillStyle=color;ctx.textBaseline='middle';
  const ch=[...text],w=ch.map(c=>ctx.measureText(c).width),tot=w.reduce((a,b)=>a+b,0)+sp*(ch.length-1);let cx=-tot/2;
  ch.forEach((c,i)=>{ctx.fillText(c,cx,0);cx+=w[i]+sp;});ctx.restore();
}
function drawMap(){
  const ctx=mapCanvas.getContext('2d');ctx.setTransform(DPR,0,0,DPR,0,0);
  const g=ctx.createRadialGradient(MW*.45,MH*.6,40,MW*.5,MH*.5,MW*.95);g.addColorStop(0,'#3b6874');g.addColorStop(1,'#1c3a47');
  ctx.fillStyle=g;ctx.fillRect(0,0,MW,MH);
  const R=mulberry32(7);ctx.strokeStyle='rgba(220,240,240,.11)';ctx.lineWidth=1;
  for(let i=0;i<280;i++){const x=R()*MW,y=R()*MH,w=6+R()*10;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+w/2,y-3,x+w,y);ctx.stroke();}
  ctx.lineJoin='round';
  for(const l of LAND){ctx.beginPath();addPath(ctx,l.xy);ctx.strokeStyle='rgba(170,215,215,.2)';ctx.lineWidth=18;ctx.stroke();ctx.strokeStyle='rgba(195,228,222,.25)';ctx.lineWidth=7;ctx.stroke();}
  ctx.beginPath();for(const l of LAND)addPath(ctx,l.xy);ctx.fillStyle='#dccb9f';ctx.fill();
  ctx.save();ctx.beginPath();for(const l of LAND)addPath(ctx,l.xy);ctx.clip();
  const R2=mulberry32(11);for(let i=0;i<2600;i++){const x=R2()*MW,y=R2()*MH;ctx.fillStyle=R2()<.5?'rgba(120,90,50,.08)':'rgba(255,250,235,.13)';ctx.fillRect(x,y,2,2);}
  if(regionGrid){ctx.imageSmoothingEnabled=true;ctx.drawImage(terrCanvas,0,0,GW,GH,0,0,GW*CELL,GH*CELL);}
  ctx.restore();
  ctx.beginPath();for(const l of LAND)addPath(ctx,l.xy);ctx.strokeStyle='#5d4a2e';ctx.lineWidth=1.3;ctx.stroke();
  const R3=mulberry32(3);
  for(const [lo,la,s,snow] of MOUNTS){const [x0,y0]=P(lo,la);const x=x0+(R3()-.5)*6,y=y0+(R3()-.5)*6;
    ctx.beginPath();ctx.moveTo(x-s,y);ctx.lineTo(x,y-s*1.15);ctx.lineTo(x+s,y);ctx.closePath();ctx.fillStyle='rgba(125,98,62,.6)';ctx.fill();
    ctx.beginPath();ctx.moveTo(x,y-s*1.15);ctx.lineTo(x+s,y);ctx.lineTo(x+s*.15,y);ctx.closePath();ctx.fillStyle='rgba(70,50,28,.45)';ctx.fill();
    if(snow){ctx.beginPath();ctx.moveTo(x-s*.35,y-s*.75);ctx.lineTo(x,y-s*1.15);ctx.lineTo(x+s*.35,y-s*.75);ctx.closePath();ctx.fillStyle='rgba(255,255,250,.75)';ctx.fill();}}
  for(const [t,lo,la,sz,rot,kind] of MAPTXT){const [x,y]=P(lo,la);spaced(ctx,t,x,y,sz,rot,kind==='sea'?'rgba(214,234,236,.5)':'rgba(92,70,40,.55)',sz*.28);}
}

/* ================= MOVEMENT ================= */
function startMove(from,uids){

function cancelMove(){UI.move=null;$('#hint').classList.add('hidden');renderNodes();}
async function onNode(id){
  if(UI.busy)return;

    if(id===UI.move.from){const f=UI.move.from;cancelMove();openSheet(f);return;}
    if(!ADJ[UI.move.from].includes(id)){toast('Armies march one city per turn — pick a highlighted city');return;}
    return executeMove(id);
  }

}
async function executeMove(toId){
  const from=G.s[UI.move.from],to=G.s[toId],units=from.units.filter(u=>UI.move.uids.includes(u.uid)&&!u.moved);
  cancelMove();closeSheet();if(!units.length)return;AU.ui('march');
  if(to.owner===PLAYER){
    const n=Math.min(units.length,MAX_UNITS-to.units.length);if(n<=0)return toast(`${sname(to)} already holds 12 units`);
    const mv=units.slice(0,n);UI.busy=true;try{await cmMarch(from.id,toId,PLAYER,mv);}finally{UI.busy=false;}from.units=from.units.filter(u=>!mv.includes(u));mv.forEach(u=>u.moved=true);to.units.push(...mv);
    if(n<units.length)toast(`Only ${n} units fit in ${sname(to)}`);save();render();return;
  }
  UI.busy=true;
  try{
    if(!to.units.length){await cmMarch(from.id,toId,PLAYER,units);from.units=from.units.filter(u=>!units.includes(u));await capture(to,PLAYER,units,from);}
    else{
      const mode=await modal({title:`Battle for ${sname(to)}`,body:forcesBody(units,to.units,to.bld.walls,'Your army',FACTIONS[to.owner].name,true),
        buttons:[{label:'⚔ Command the battle',value:'command',cls:'primary'},{label:'Auto-resolve',value:'auto',cls:'ghost'},{label:'Cancel',value:'cancel',cls:'ghost'}]});
      if(mode!=='cancel'){await cmMarch(from.id,toId,PLAYER,units);from.units=from.units.filter(u=>!units.includes(u));units.forEach(u=>u.moved=true);await doBattle({attFid:PLAYER,units,from,to,mode});}
    }
  }finally{UI.busy=false;}
  save();render();checkEnd();
}
function forcesBody(att,def,walls,attName,defName,playerAtt){
  const ap=armyPower(att),dp=armyPower(def)*(1+.15*walls),ratio=playerAtt?ap/Math.max(1,dp):dp/Math.max(1,ap);
  const odds=ratio>1.6?['Overwhelming','good']:ratio>1.15?['Favourable','good']:ratio>.87?['Even','warn']:ratio>.6?['Unfavourable','bad']:['Desperate','bad'];
  const side=(us,nm)=>`<div class="side"><div class="nm">${nm}</div><div class="icons">${us.map(u=>symSvg(UNITS[u.type].kind,FACTIONS[ownerOfUnit(u)].color,20)).join('')}</div><div class="d">${us.length} units<br>${fmt(sumMen(us))} men</div></div>`;
  return`<div class="vs">${side(att,attName)}<div class="vsx">VS</div>${side(def,defName)}</div><div class="odds ${odds[1]}">Your odds: <b>${odds[0]}</b>${walls?`<br>Defenders hold ${BUILD.walls.lv[walls-1]}`:''}</div>`;
}
const unitOwner=new WeakMap();
function ownerOfUnit(u){if(unitOwner.has(u))return unitOwner.get(u);for(const n of NODES)if(G.s[n.id].units.includes(u))return G.s[n.id].owner;return PLAYER;}

/* ================= BATTLE RESOLUTION ================= */
function autoResolve(att,def,walls){
  const A=armyPower(att)*rnd(.8,1.2),D=armyPower(def)*(1+.15*walls)*rnd(.8,1.2),aw=A>D,r=Math.min(A,D)/Math.max(A,D,1);
  const wl=.05+.4*r*r,ll=.45+.35*r;
  const hit=(us,f)=>{for(const u of us){const mx=UNITS[u.type].men;u.men=Math.max(0,Math.round(u.men*(1-clamp(f*rnd(.7,1.3),0,1))));if(u.men<mx*.12)u.men=0;}};
  hit(att,aw?wl:ll);hit(def,aw?ll:wl);
  (aw?att:def).forEach(u=>{if(u.men>0&&Math.random()<.5)u.xp=Math.min(3,(u.xp||0)+1);});
  return aw;
}
async function doBattle(o){
  const{attFid,units,from,to}=o,defFid=to.owner,defUnits=to.units.slice();
  units.forEach(u=>unitOwner.set(u,attFid));defUnits.forEach(u=>unitOwner.set(u,defFid));
  const pInv=attFid===PLAYER||defFid===PLAYER,pAtt=attFid===PLAYER;let mode=o.mode;
  const preA=sumMen(units),preD=sumMen(defUnits);
  if(pInv&&!mode){
    AU.ui('alarm');
    mode=await modal({title:`${sname(to)} is under attack!`,body:`<p>The ${FACTIONS[attFid].adj} army marches from ${sname(from)}.</p>`+forcesBody(units,defUnits,to.bld.walls,FACTIONS[attFid].name,'Your garrison',false),
      buttons:[{label:'⚔ Command the defence',value:'command',cls:'primary'},{label:'Auto-resolve',value:'auto',cls:'ghost'}]});
  }
  let attWon;
  if(pInv&&mode==='command'){
    const res=await runBattle({title:`Battle of ${sname(to)}`,playerIsAttacker:pAtt,pUnits:pAtt?units:defUnits,eUnits:pAtt?defUnits:units,eFid:pAtt?defFid:attFid,walls:to.bld.walls});
    if(res)attWon=pAtt?res.winnerSide===0:res.winnerSide===1;
    else{mode='auto';attWon=autoResolve(units,defUnits,to.bld.walls);}
  }else attWon=autoResolve(units,defUnits,to.bld.walls);
  const attAlive=units.filter(u=>u.men>0),defAlive=defUnits.filter(u=>u.men>0);
  if(attWon&&!attAlive.length)attWon=false;
  const lostA=preA-sumMen(attAlive),lostD=preD-sumMen(defAlive);
  if(pInv&&mode==='auto'){
    const won=pAtt?attWon:!attWon;AU.stinger(won?'victory':'defeat');
    await modal({title:won?'Victory':'Defeat',body:`<p>${won?(pAtt?`Your army has broken the defenders of ${sname(to)}.`:`The garrison of ${sname(to)} holds firm.`):(pAtt?`Your army was thrown back from ${sname(to)}.`:`${sname(to)} has fallen.`)}</p><p>Roman losses: <b>${fmt(pAtt?lostA:lostD)}</b> men<br>Enemy losses: <b>${fmt(pAtt?lostD:lostA)}</b> men</p>`,buttons:[{label:'Continue',value:1,cls:'primary'}]});
  }
  if(attWon){
    to.units=[];
    if(defAlive.length){
      const dest=ADJ[to.id].map(id=>G.s[id]).filter(s=>s.owner===defFid&&s.units.length<MAX_UNITS).sort((a,b)=>a.units.length-b.units.length)[0];
      if(dest){const k=defAlive.slice(0,MAX_UNITS-dest.units.length);k.forEach(u=>u.moved=true);dest.units.push(...k);}
    }
    await capture(to,attFid,attAlive,from);
  }else{
    to.units=defAlive;
    if(from.owner===attFid)from.units.push(...attAlive.slice(0,Math.max(0,MAX_UNITS-from.units.length)));
    if(defFid===PLAYER)report('🛡️',`${sname(to)} repelled the ${FACTIONS[attFid].adj} attack.`);
  }
  return attWon;
}
async function capture(to,fid,units,from){
  const prev=to.owner;if(fid===PLAYER)AU.ui('fanfare');
  to.owner=fid;to.build=null;to.tax=1;to.unrest=30;to.rec=0;
  const fit=units.slice(0,MAX_UNITS);fit.forEach(u=>u.moved=true);to.units=fit;
  if(units.length>MAX_UNITS&&from&&from.owner===fid)from.units.push(...units.slice(MAX_UNITS));
  if(prev!=='rebels'&&G.cap[prev]===to.id){const own=ownedBy(prev);G.cap[prev]=own.length?own.sort((a,b)=>b.pop-a.pop)[0].id:null;}
  repaintTerritory();renderNodes();
  if(fid===PLAYER){
    const loot=Math.round(to.pop*.12),occ=Math.round(to.pop*.03);
    const ch=await modal({title:`${sname(to)} is ours`,body:`<p>Your troops hold ${sname(to)}. How should they treat the city?</p>`,
      buttons:[{label:`Occupy · +${fmt(occ)} gold, people stay calm`,value:'occ',cls:'gold'},{label:`Sack · +${fmt(loot)} gold, lose ¼ of the people`,value:'sack',cls:'ghost'}]});
    if(ch==='sack'){G.gold[PLAYER]+=loot;to.pop=Math.round(to.pop*.75);to.unrest=45;}else G.gold[PLAYER]+=occ;
  }else{
    G.gold[fid]+=Math.round(to.pop*.04);
    if(prev===PLAYER)report('🔥',`The ${FACTIONS[fid].name} captured ${sname(to)}!`);
    else report('⚑',`The ${FACTIONS[fid].name} took ${sname(to)} from ${prev==='rebels'?'its free people':'the '+FACTIONS[prev].name}.`);
  }
  if(prev!=='rebels'&&prev!==PLAYER&&!ownedBy(prev).length){report('☠️',`The ${FACTIONS[prev].name} have been wiped out${fid===PLAYER?' by Rome':''}.`);if(fid===PLAYER)toast(`The ${FACTIONS[prev].name} are destroyed!`);}
  render();
}

/* ================= BATTLE: FIELD & RULES ================= */
const FX=120,FZ=130,WALL_Z=78,TOWN_Z=101,BATTLE_TIME=480,SIM_DT=.05,MELEE_K=.1,CONTACT=1.2;
const LAYOUT={
  inf:{files:10,sx:1.5,sz:1.6,per:4},spear:{files:10,sx:1.5,sz:1.6,per:4},missile:{files:10,sx:2.1,sz:2.1,per:4},
  cav:{files:8,sx:2.4,sz:3.6,per:4},gen:{files:4,sx:2.6,sz:3.6,per:4},eleph:{files:4,sx:6,sz:7,per:3}

const SHIELD={rome:'scutum',samnium:'scutum',etruria:'round',greeks:'round',carthage:'oval',gauls:'oval',rebels:'oval'};

let B=null;
const R3={renderer:null,scene:null,raf:0};

const fwdV=a=>[Math.sin(a),Math.cos(a)],latV=a=>[Math.cos(a),-Math.sin(a)];
function angDiff(a,b){let d=(b-a)%(2*Math.PI);if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;return d;}
const unitById=id=>B.units.find(u=>u.uid===id);

const centroid=us=>({x:us.reduce((a,u)=>a+u.x,0)/us.length,z:us.reduce((a,u)=>a+u.z,0)/us.length});

function sndCharge(a,braced){if(!B||B.headless)return;const[v,p]=spat(a.x,a.z);if(braced)AU.brace(v,p);else AU.charge(a.kind,v,p);}
function battleAudio(dt){ // fighting noise, hoofbeats and the music's intensity follow what is happening on the field
  if(!B||B.headless||B.over||B.phase!=='battle'||!B.speed){AU.crowd(0);return;}
  B.aT=(B.aT||0)-dt;if(B.aT>0)return;B.aT=.22/Math.min(B.speed,2);
  const on=B.units.filter(onField),fight=on.filter(u=>u.contacts.length),rt=on.filter(u=>u.state==='rout').length;
  AU.crowd(Math.min(1,fight.length/6));
  AU.inten(.4+.4*Math.min(1,fight.length/8)+.2*Math.min(1,rt/3));
  const n=Math.min(4,Math.round(fight.length*.45+Math.random()));
  for(let k=0;k<n;k++){const u=pick(fight),[v,p]=spat(u.x,u.z);AU.clash(v*.7,p,Math.random()<.45);}
  const cv=on.filter(u=>u.running&&isCav(u)&&u.state==='ok');
  if(cv.length){const u=cv[0],[v,p]=spat(u.x,u.z);AU.hooves(v,p,cv.length);}

function mkTerrain(defSide){
  const R=mulberry32((Math.random()*1e9)|0),hills=[],woods=[];
  for(let i=0,n=2+Math.floor(R()*3);i<n;i++)hills.push({x:(R()*2-1)*(FX-25),z:(R()*2-1)*(WALL_Z-12),r:22+R()*28,h:4+R()*7});
  for(let i=0,n=2+Math.floor(R()*3);i<n;i++)woods.push({x:(R()*2-1)*(FX-18),z:(R()*2-1)*(WALL_Z-28),r:9+R()*12});
  return{hills,woods,ts:defSide===0?1:-1,s1:R()*6,s2:R()*6,R};
}
function heightAt(x,z){
  const T=B.ter;let h=Math.sin(x*.045+T.s1)*Math.cos(z*.038+T.s2)*1.1+Math.sin(x*.11+z*.07)*.35;
  for(const H of T.hills){const d2=((x-H.x)**2+(z-H.z)**2)/(H.r*H.r);if(d2<5)h+=H.h*Math.exp(-d2*1.6);}
  const tz=z*T.ts-(WALL_Z-10);if(tz>0){const k=Math.min(1,tz/9);h=h*(1-k)+.2*k;}
  return h;
}
const forestAt=(x,z)=>B.ter.woods.some(W=>(x-W.x)**2+(z-W.z)**2<W.r*W.r);
const inTown=u=>u.z*B.ter.ts>WALL_Z;

function wallWaypoint(u,tx,tz){ // armies cross the walls only through the gates
  if(!B.walls)return null;const wz=WALL_Z*B.ter.ts,s1=Math.sign(u.z-wz);
  if(!s1||s1===Math.sign(tz-wz))return null;
  const xc=u.x+(tx-u.x)*(wz-u.z)/(tz-u.z);if(Math.abs(u.z-wz)<6&&atGate(u.x)&&atGate(xc))return null;
  const g=GATES.reduce((b,x)=>Math.abs(u.x-x)+Math.abs(x-tx)<Math.abs(u.x-b)+Math.abs(b-tx)?x:b);
  return Math.abs(u.x-g)>2.5?[g,wz+s1*7]:[g,wz-s1*7];

/* ================= BATTLE: UNITS ================= */
function mkBU(cu,side,fid){
  const T=UNITS[cu.type],L=LAYOUT[T.kind];
  const u={uid:cu.uid,cu,side,fid,T,kind:T.kind,L,men:cu.men,max:T.men,mor:T.mor+(cu.xp||0)*4,xp:cu.xp||0,state:'ok',
    x:0,z:0,face:homeFace(side),order:'none',dest:null,target:null,orderT:-9,running:false,runD:0,spd:0,contacts:[],prim:null,disen:false,
    chargeT:{},ammo:T.ammo?T.ammo*2+2:0,reload:Math.random()*2,pend:0,fought:false,rallies:0,skirmT:0,home:null,figs:[],alive:[],sg:null};
  const n=Math.max(1,Math.ceil(cu.men/L.per));
  for(let i=0;i<n;i++)u.figs.push({alive:true,fled:false,fall:0,x:0,z:0,y:0,bob:0,yaw:u.face,ph:Math.random()*6.28,jx:(Math.random()-.5)*.35,jz:(Math.random()-.5)*.35,mi:0,key:null});
  u.alive=u.figs.slice();u.dm=dims(u);
  return u;
}
function dims(u){const n=Math.max(1,u.alive.length),f=Math.min(u.L.files,n),r=Math.ceil(n/f);return{f,r,hw:f*u.L.sx/2,hd:Math.max(1.4,r*u.L.sz/2)};}
const walkSp=u=>2.5+u.T.mv,runSp=u=>walkSp(u)*1.6;
const rangeW=u=>25+u.T.rng*16+(heightAt(u.x,u.z)>4?8:0);
const turnRate=u=>u.kind==='eleph'?.9:isCav(u)?2.2:1.5;

/* A unit's footprint is a capsule: its front line as a segment, padded by half its depth. */
function seg(u){const d=u.dm,h=Math.max(0,d.hw-d.hd),[lx,lz]=latV(u.face);return{ax:u.x-lx*h,az:u.z-lz*h,bx:u.x+lx*h,bz:u.z+lz*h};}
function ptSeg(px,pz,s){const dx=s.bx-s.ax,dz=s.bz-s.az,l2=dx*dx+dz*dz;const t=l2?clamp(((px-s.ax)*dx+(pz-s.az)*dz)/l2,0,1):0;const cx=s.ax+dx*t,cz=s.az+dz*t;return[Math.hypot(px-cx,pz-cz),cx,cz];}
function segSeg(a,b){ // [distance, point on a (x,z), point on b (x,z)]
  let best=[1e9,0,0,0,0];
  for(const [px,pz,S,flip] of [[a.ax,a.az,b,0],[a.bx,a.bz,b,0],[b.ax,b.az,a,1],[b.bx,b.bz,a,1]]){
    const [d,cx,cz]=ptSeg(px,pz,S);if(d<best[0])best=flip?[d,cx,cz,px,pz]:[d,px,pz,cx,cz];}
  return best;
}
const footD=(a,b)=>segSeg(a.sg,b.sg)[0]-a.dm.hd-b.dm.hd;
function nearFoe(u){let m=1e9;for(const e of B.units)if(e.side!==u.side&&active(e)&&e.sg)m=Math.min(m,footD(u,e));return m;}
function flankAng(d,a){const [fx,fz]=fwdV(d.face),dx=a.x-d.x,dz=a.z-d.z,l=Math.hypot(dx,dz)||1;return Math.acos(clamp((fx*dx+fz*dz)/l,-1,1));}
function terrMul(u,x,z){
  let m=1;if(forestAt(x,z))m*=big(u)?.5:.75;
  if(B.walls&&z*B.ter.ts>0&&Math.abs(Math.abs(z)-WALL_Z)<3&&!atGate(x))m*=.35;
  return m;
}

/* ================= BATTLE: COMBAT ================= */
function meleeDmg(a,d){ // men-equivalents per second
  const Ta=a.T,Td=d.T,ang=flankAng(d,a),dSpear=d.kind==='spear'&&d.state!=='rout'&&ang<1.05;
  let p=Ta.atk+a.xp;if(a.state==='waver')p-=2;
  const dh=heightAt(a.x,a.z)-heightAt(d.x,d.z);if(dh>1.5)p+=2;else if(dh<-1.5)p-=1;
  if(a.chargeT[d.uid]>0&&Ta.charge&&!dSpear)p+=Ta.charge;
  if(big(a)&&dSpear)p-=2;if(a.kind==='spear'&&big(d))p+=5;if(isCav(a)&&d.kind==='missile')p+=3;if(big(a)&&forestAt(a.x,a.z))p-=3;
  p+=ang>2.3?5:ang>1.05?3:0;
  let ar=Td.def+d.xp;if(forestAt(d.x,d.z))ar+=big(d)?-3:2;
  if(d.side===B.defSide&&inTown(d))ar+=B.townBonus;if(dSpear&&big(a))ar+=5;if(d.state==='waver')ar-=1;
  ar*=ang>2.3?.6:ang>1.05?.8:1;if(d.state==='rout')ar*=.4;
  p=Math.max(1,p);ar=Math.max(1,ar);
  let dmg=a.men*Ta.w*.28*p/(p+ar)*MELEE_K;if(d.state==='rout'||d.disen)dmg*=1.5;
  return dmg;
}
function rangedDmg(a,d){ // men-equivalents per volley
  const ra=a.T.ratk+a.xp+(heightAt(a.x,a.z)-heightAt(d.x,d.z)>2?2:0);
  let ar=d.T.def*.6+(forestAt(d.x,d.z)?4:0)+(d.side===B.defSide&&inTown(d)?B.townBonus:0);
  if(flankAng(d,a)>1.9)ar*=.6; // shields face forward
  if(d.state==='rout')ar*=.5;
  return a.men*a.T.w*.2*ra/(ra+Math.max(1,ar))*.6*(d.contacts.length?.5:1);
}
const hasAura=u=>B.units.some(g=>g!==u&&g.side===u.side&&g.kind==='gen'&&active(g)&&Math.hypot(g.x-u.x,g.z-u.z)<40);
function checkMor(u){if(!active(u))return;if(u.mor<15||(u.men/u.max<.25&&u.mor<45))rout(u);else u.state=u.mor<35?'waver':'ok';}
function rout(u){
  u.state='rout';u.order='none';u.target=null;u.dest=null;u.running=false;flt(u,'ROUTING','#ffffff');sndEv('rout',u);
  for(const a of B.units)if(a!==u&&a.side===u.side&&active(a)&&Math.hypot(a.x-u.x,a.z-u.z)<30){a.mor-=u.kind==='gen'?12:6;checkMor(a);}
}
function unitDies(u){
  u.state='dead';u.order='none';for(const f of u.alive)f.alive=false;u.alive=[];flt(u,'DESTROYED','#ffb3a6');sndEv('die',u);
  for(const a of B.units)if(a!==u&&a.side===u.side&&active(a)&&(u.kind==='gen'||Math.hypot(a.x-u.x,a.z-u.z)<30)){a.mor-=u.kind==='gen'?20:5;checkMor(a);}
}
function syncFigs(u,melee){ // drop figures to match the men left; melee losses come from the front rank
  const want=Math.max(1,Math.ceil(u.men/u.L.per));
  while(u.alive.length>want){const i=Math.floor(Math.random()*(melee?Math.min(u.dm.f,u.alive.length):u.alive.length));u.alive[i].alive=false;u.alive.splice(i,1);}
  u.dm=dims(u);

function hurt(u,lost,extra=0,mult=1,melee=false){
  if(!onField(u))return;lost=Math.min(u.men,Math.max(0,lost));u.men-=lost;
  if(u.men<=0){u.men=0;unitDies(u);return;}
  syncFigs(u,melee);
  let hit=((lost/u.max)*110+extra)*mult;if(hasAura(u))hit*=.7;if(u.side===B.defSide&&inTown(u))hit*=.8;
  u.mor-=hit;checkMor(u);
}
function impact(a,b){ // a runs into b
  if(!active(a)||!a.running||a.runD<8)return;
  const braced=b.kind==='spear'&&active(b)&&flankAng(b,a)<1.05;a.runD=0;
  if(braced&&big(a)){hurt(a,Math.round(a.men*.06),6,1,true);flt(b,'BRACED','#ffd166');sndCharge(b,true);return;}
  a.chargeT[b.uid]=4;flt(a,'CHARGE!','#ffd166');sndCharge(a);
  hurt(b,probRound(meleeDmg(a,b)*5/b.T.w),4+(a.T.charge||2)*.8+(a.kind==='eleph'?8:0),1,true);
}
function tryFire(u,t){
  if(u.reload>0||u.ammo<=0)return;
  u.reload=5+Math.random();u.ammo--;u.fought=true;
  const dmg=rangedDmg(u,t)*rnd(.8,1.2),fl=.8+Math.hypot(t.x-u.x,t.z-u.z)/55;
  B.events.push({t:B.time+fl,fn:()=>{if(!onField(t))return;const m0=t.men;hurt(t,probRound(dmg/t.T.w),0,.8,false);B.rLoss[t.side]+=m0-t.men;if(!B.headless){const[v,p]=spat(t.x,t.z);AU.arrowHit(v,p,clamp(Math.round(dmg/8)+2,2,6));}}});
  if(!B.headless){spawnVolley(u,t,fl);const[v,p]=spat(u.x,u.z);AU.volley(v,p,fl,u.T.cls==='sling');}
}
function fireTarget(u){
  const rg=rangeW(u);let best=null,bs=1e9;

    const sc=d+(e.state==='rout'?40:0)+(e.contacts.length?25:0);if(sc<bs){bs=sc;best=e;}}

/* ================= BATTLE: MOVEMENT ================= */
function turnTo(u,a,dt,rate){const d=angDiff(u.face,a),m=rate*dt;u.face+=Math.abs(d)<=m?d:Math.sign(d)*m;return Math.abs(angDiff(u.face,a));}
function stepToward(u,tx,tz,sp,dt){ // true once arrived
  const wp=wallWaypoint(u,tx,tz);if(wp){tx=wp[0];tz=wp[1];}
  const dx=tx-u.x,dz=tz-u.z,d=Math.hypot(dx,dz);if(d<.4){u.spd=0;return !wp;}
  let k=1;
  if(d>8){const off=turnTo(u,Math.atan2(dx,dz),dt,turnRate(u));k=off>1.2?.15:Math.cos(off*.8);} // wheel before marching off
  let s=Math.min(d,sp*k*terrMul(u,u.x,u.z)*dt);
  if(s>1e-4){const sl=(heightAt(u.x+dx/d*s,u.z+dz/d*s)-heightAt(u.x,u.z))/s;s*=clamp(1-sl*.5,.6,1.15);}
  u.x+=dx/d*s;u.z+=dz/d*s;u.spd=s/dt;return false;
}
function updRout(u,dt){
  u.running=true;
  if(!u.contacts.length&&nearFoe(u)>35){u.mor+=(4+(hasAura(u)?2:0))*dt;
    if(u.mor>=40&&u.men/u.max>=.25&&u.rallies<2){u.rallies++;u.state='waver';u.running=false;u.order='none';u.dest=null;flt(u,'RALLIED','#c4f2b0');sndEv('rally',u);return;}}
  const ez=u.side===0?FZ:-FZ,wp=wallWaypoint(u,u.x*.98,ez)||[u.x*.98,ez];turnTo(u,Math.atan2(wp[0]-u.x,wp[1]-u.z),dt,4);
  const [fx,fz]=fwdV(u.face),s=runSp(u)*1.05*terrMul(u,u.x,u.z)*dt;u.x+=fx*s;u.z+=fz*s;u.spd=s/dt;
  if(Math.abs(u.z)>=FZ-1){u.state='fled';for(const f of u.alive)f.fled=true;}
}
function updUnit(u,dt){
  for(const k in u.chargeT)u.chargeT[k]-=dt;
  u.reload-=dt;u.skirmT-=dt;
  if(u.state==='rout')return updRout(u,dt);
  if(!u.contacts.length&&nearFoe(u)>25){u.mor=Math.min(u.T.mor+u.xp*4,u.mor+(2+(hasAura(u)?1.5:0))*dt);u.state=u.mor<35?'waver':'ok';}
  if(u.contacts.length){
    u.running=false;u.runD=0;u.fought=true;
    let prim=u.target&&u.contacts.includes(u.target)?u.target:null;
    if(!prim)prim=u.contacts.slice().sort((a,b)=>(a.state==='rout')-(b.state==='rout')||flankAng(u,a)-flankAng(u,b))[0];
    u.prim=prim;u.disen=false;
    if(u.order==='move'&&u.dest){const dx=u.dest.x-u.x,dz=u.dest.z-u.z; // pulling out of melee costs men
      if(u.contacts.every(e=>(e.x-u.x)*dx+(e.z-u.z)*dz<0)){u.disen=true;stepToward(u,u.dest.x,u.dest.z,walkSp(u)*.5,dt);}}
    if(!u.disen){
      turnTo(u,Math.atan2(prim.x-u.x,prim.z-u.z),dt,.5);
      if(segSeg(u.sg,prim.sg)[0]-u.dm.hd-prim.dm.hd>.4){const [fx,fz]=fwdV(u.face);u.x+=fx*1.5*dt;u.z+=fz*1.5*dt;}
      prim.pend+=meleeDmg(u,prim)*dt/prim.T.w;
    }
    for(const e of u.contacts)if(e.state!=='rout'){const a=flankAng(u,e);if(a>1.05)u.mor-=(a>2.3?5:2.5)*dt*(hasAura(u)?.7:1);}
    return;
  }
  u.disen=false;u.prim=null;
  if(u.T.rng&&u.ammo>0&&u.skirmT<=0&&B.time-u.orderT>2){ // skirmishers fall back from approaching melee troops
    const th=B.units.find(e=>e.side!==u.side&&active(e)&&!(e.T.rng&&e.ammo>0)&&e.sg&&footD(u,e)<16);
    if(th){const dx=u.x-th.x,dz=u.z-th.z,l=Math.hypot(dx,dz)||1,tx=clamp(u.x+dx/l*26,-FX+10,FX-10),tz=clamp(u.z+dz/l*26,-FZ+8,FZ-8);
      if(Math.hypot(tx-u.x,tz-u.z)>10){u.order='move';u.target=null;u.dest={x:tx,z:tz,face:Math.atan2(-dx,-dz)};u.skirmT=4;}}
  }
  if(u.order==='attack'){
    const t=u.target;
    if(!t||!onField(t)){u.order='none';u.target=null;}
    else if(u.T.rng&&u.ammo>0){
      const d=Math.hypot(t.x-u.x,t.z-u.z);u.running=false;
      if(d>rangeW(u)*.95)stepToward(u,t.x,t.z,walkSp(u),dt);
      else{u.spd=0;if(turnTo(u,Math.atan2(t.x-u.x,t.z-u.z),dt,turnRate(u))<.5)tryFire(u,t);}
      return;

      if(u.running)u.runD+=u.spd*dt;else u.runD=0;

    }
  }
  u.running=false;u.runD=0;
  if(u.order==='move'&&u.dest){if(!stepToward(u,u.dest.x,u.dest.z,walkSp(u),dt))return;u.order='none';}
  u.spd=0;
  const t=u.T.rng&&u.ammo>0?fireTarget(u):null; // fire at will
  if(t&&Math.abs(angDiff(u.face,Math.atan2(t.x-u.x,t.z-u.z)))<1.2){if(turnTo(u,Math.atan2(t.x-u.x,t.z-u.z),dt,1)<.5)tryFire(u,t);}
  else if(u.dest&&u.dest.face!=null)turnTo(u,u.dest.face,dt,turnRate(u));
}
function computeContacts(){
  const us=B.units.filter(onField),now=new Set();
  for(const u of us){u.sg=seg(u);u.contacts=[];}
  for(const a of us)if(a.side===0)for(const b of us)if(b.side===1){
    if(a.state==='rout'&&b.state==='rout')continue;
    const r=segSeg(a.sg,b.sg),d=r[0]-a.dm.hd-b.dm.hd;if(d>CONTACT)continue;

/* ================= BATTLE: AI ================= */

    if(sc>bs){bs=sc;best=f;}}

}
function aiAtk(u,t){if(u.order!=='attack'||u.target!==t){u.order='attack';u.target=t;u.orderT=B.time;}}
function aiMove(u,x,z,face){u.order='move';u.target=null;u.dest={x:clamp(x,-FX+10,FX-10),z:clamp(z,-FZ+6,FZ-6),face:face??homeFace(u.side)};}

function aiThink(s){
  const mine=B.units.filter(u=>u.side===s&&active(u)),foes=B.units.filter(u=>u.side!==s&&onField(u)),af=foes.filter(active);
  if(!mine.length||!af.length)return;
  const fz=towardZ(s),ec=centroid(af),oc=centroid(mine);
  const pw=us=>us.reduce((a,u)=>a+u.men*u.T.w*(u.T.atk+u.T.def+u.T.ratk*.6+u.xp*2+u.T.charge*.3)*(.6+u.mor/200),0);
  // attackers advance; defenders hold their ground unless clearly stronger or being shot to pieces
  const aggr=s===B.attSide||pw(mine)>pw(af)*1.35||B.rLoss[s]>B.init[s]*.12;
  const line=mine.filter(u=>!isCav(u)&&!(u.T.rng&&u.ammo>0)&&u.kind!=='gen');
  const lineP=line.length?Math.min(...line.map(u=>u.z*fz)):null;
  const anyEng=B.units.some(u=>u.contacts.length);
  for(const u of mine){
    if(u.skirmT>0)continue;
    if(u.contacts.length){if(!u.contacts.includes(u.target)){u.target=u.prim||u.contacts[0];u.order='attack';}continue;}
    if(u.T.rng&&u.ammo>0){
      let t=null,td=1e9;for(const f of af){const d=Math.hypot(f.x-u.x,f.z-u.z);if(d<td){td=d;t=f;}}
      if(td<=rangeW(u)||(aggr&&(lineP===null||u.z*fz<lineP+2)))aiAtk(u,t);
      else if(aggr)aiHold(u);else aiHome(u);
      continue;}
    const t=bestTarget(u,foes),d=t?footD(u,t):1e9;
    if(u.kind==='gen'){
      if(t&&d<20&&(t.state!=='ok'||t.contacts.length))aiAtk(u,t);
      else{const o=mine.filter(x=>x!==u&&x.kind!=='gen');if(o.length){const c=centroid(o);aiMove(u,c.x,c.z-fz*22);}}
      continue;}
    if(!t)continue;
    if(aggr){
      if(isCav(u)&&!anyEng&&d>40&&lineP!==null){aiMove(u,u.home.x,(lineP-4)*fz);continue;}
      if(d<45||isCav(u)||lineP===null){aiAtk(u,t);continue;}
      if(u.z*fz>lineP+6){aiHold(u);continue;}
      aiMove(u,u.x+(ec.x-oc.x)*.12,u.z+fz*30);
    }else{
      if(d<35)aiAtk(u,t);

}

/* ================= BATTLE: SIMULATION ================= */
function simStep(dt){

  for(const u of B.units)if(onField(u))updUnit(u,dt);
  for(const u of B.units)if(onField(u)&&u.pend>=1){const l=Math.floor(u.pend);u.pend-=l;hurt(u,l,0,1,true);}
  separate();

}
function checkOver(){

  if(!a0||!a1){endBattle(!a0&&!a1?B.defSide:a0?0:1,'rout');return true;}

  us.filter(u=>['inf','spear','eleph'].includes(u.kind)).sort((a,b)=>b.T.def-a.T.def).forEach((u,i)=>i%2?row0.push(u):row0.unshift(u));

}

  for(let i=0;i<170;i++){const x=(R()*2-1)*(FX+160),z=(R()*2-1)*(FZ+160);if((Math.abs(x)<FX+6&&Math.abs(z)<FZ+6)||z*ts>WALL_Z-6)continue;const s=.8+R()*.7;trees.push([x,heightAt(x,z)-.1,z,R()*6,s,s,s,tint()]);}
  placeInstances(scene,mergeParts([prt(cy(.22,.32,2,5),0x5a3d22,{y:1}),prt(cn(1.7,3.4,6),0x3d6a2a,{y:3.3}),prt(cn(1.3,2.6,6),0x4a7a33,{y:4.7})]),vc,trees,true);

    const hx=x+(R()-.5)*3,hz=z*ts+(R()-.5)*2,w=4+R()*3,h=3+R()*3,d=4+R()*3,ry=R()<.5?0:Math.PI/2,y=heightAt(hx,hz)-.2;

function buildZone(scene){

function buildScene(){

function teardown(){

  $('#bLabels').innerHTML='';$('#bCards').innerHTML='';$('#battle').classList.add('hidden');

  for(let k=0;k<n;k++){const i=R3.projFree.pop();if(i===undefined)break;
    const f=u.alive[k],g=t.alive.length?t.alive[Math.floor(Math.random()*t.alive.length)]:t,gx=g.x+(Math.random()-.5)*2,gz=g.z+(Math.random()-.5)*2;
    B.shots.push({i,p0:[f.x,f.y+1.6,f.z],p1:[gx,heightAt(gx,gz)+.3,gz],t0:B.time+Math.random()*.3,T:fl*(.9+Math.random()*.2),h:Math.hypot(gx-f.x,gz-f.z)*.22+3,sl:u.T.cls==='sling',q:null});}
}
function updShots(){
  const keep=[];
  for(const sh of B.shots){const el=B.time-sh.t0;
    if(el>sh.T+3){R3.proj.setMatrixAt(sh.i,ZERO);R3.projFree.push(sh.i);continue;}
    keep.push(sh);if(el<0){R3.proj.setMatrixAt(sh.i,ZERO);continue;}
    const t=Math.min(1,el/sh.T),[x0,y0,z0]=sh.p0,[x1,y1,z1]=sh.p1;
    _p.set(x0+(x1-x0)*t,y0+(y1-y0)*t+sh.h*4*t*(1-t),z0+(z1-z0)*t);
    if(t<1||!sh.q){_d.set(x1-x0,y1-y0+sh.h*4*(1-2*t),z1-z0).normalize();_q.setFromUnitVectors(ZAX,_d);sh.q=(sh.q||_q.clone()).copy(_q);}else _q.copy(sh.q);
    if(sh.sl)_s.set(t<1?2.4:0,t<1?2.4:0,.11);else _s.set(1,1,1);
    _M.compose(_p,_q,_s);R3.proj.setMatrixAt(sh.i,_M);}
  B.shots=keep;R3.proj.instanceMatrix.needsUpdate=true;
}
function updFigs(vdt){ // soldiers walk to their slot in the formation; the dead fall where they stood
  const t=performance.now()/1000;
  for(const u of B.units){
    const L=u.L,al=u.alive,n=al.length,d=u.dm,[lx,lz]=latV(u.face),[fx,fz]=fwdV(u.face);
    const snap=vdt>=50,rt=u.state==='rout',spread=rt?2.4:1,jit=rt?6:1,fight=u.contacts.length>0&&!rt,maxS=(runSp(u)*1.5+3)*vdt,cav=isCav(u);
    for(let j=0;j<n;j++){const f=al[j],file=j%d.f,rank=Math.floor(j/d.f),rowN=rank===d.r-1?n-rank*d.f:d.f;
      const ox=((file-(rowN-1)/2)*L.sx+f.jx*jit)*spread,oz=(((d.r-1)/2-rank)*L.sz+f.jz*jit)*spread;
      let tx=u.x+lx*ox+fx*oz,tz=u.z+lz*ox+fz*oz;
      if(fight&&rank===0){const k=Math.sin(t*6.5+f.ph)*.3+.3;tx+=fx*k;tz+=fz*k;}
      const dx=tx-f.x,dz=tz-f.z,dist=Math.hypot(dx,dz);
      if(dist>maxS){f.x+=dx/dist*maxS;f.z+=dz/dist*maxS;}else{f.x=tx;f.z=tz;}
      const mv=dist>.12&&vdt>0&&!snap;
      f.yaw=snap?u.face:f.yaw+angDiff(f.yaw,mv&&dist>1.2&&!fight?Math.atan2(dx,dz):u.face)*Math.min(1,vdt*8);
      f.bob=mv?Math.abs(Math.sin(t*(cav?11:9)+f.ph))*(cav?.18:.1):0;}
  }

      if(!f.alive&&!f.fled){f.fall=Math.min(1,f.fall+vdt*2.2);if(bg)roll=f.fall*1.45;else tilt=-f.fall*1.5;}
      f.y=heightAt(f.x,f.z)+(f.alive?f.bob:-f.fall*.12);
      _e.set(tilt,f.yaw,roll,'YXZ');_q.setFromEuler(_e);_p.set(f.x,f.y,f.z);_s.setScalar(sc);_M.compose(_p,_q,_s);

function updRibbons(){

function projectU(u,h){_v.set(u.x,heightAt(u.x,u.z)+h,u.z).project(R3.cam);if(_v.z>1)return null;return[(_v.x+1)/2*R3.W,(1-_v.y)/2*R3.H];}

function flt(u,txt,color){

/* ================= BATTLE: CAMERA & INPUT ================= */
const cam={tx:0,tz:0,d:95,yaw:0},camT={tx:0,tz:0,d:95,yaw:0};
const pitchOf=d=>.42+.6*clamp((d-22)/(240-22),0,1); // low and close, or high and wide
function camUpdate(dt){
  const k=Math.min(1,dt*8);cam.tx+=(camT.tx-cam.tx)*k;cam.tz+=(camT.tz-cam.tz)*k;cam.d+=(camT.d-cam.d)*k;cam.yaw+=angDiff(cam.yaw,camT.yaw)*k;
  const pitch=pitchOf(cam.d),ty=heightAt(cam.tx,cam.tz),c=R3.cam;
  c.position.set(cam.tx+Math.sin(cam.yaw)*Math.cos(pitch)*cam.d,ty+Math.sin(pitch)*cam.d,cam.tz+Math.cos(cam.yaw)*Math.cos(pitch)*cam.d);
  const gh=heightAt(c.position.x,c.position.z)+3;if(c.position.y<gh)c.position.y=gh;
  c.lookAt(cam.tx,ty,cam.tz);
  const sun=R3.sun,sz=Math.round(clamp(cam.d*.9,45,170)/5)*5;
  sun.position.set(cam.tx-60,ty+120,cam.tz+50);sun.target.position.set(cam.tx,ty,cam.tz);
  if(sz!==R3.shadowSz){const sc=sun.shadow.camera;sc.left=sc.bottom=-sz;sc.right=sc.top=sz;sc.updateProjectionMatrix();R3.shadowSz=sz;}
}
function panBy(dx,dy){
  const wpp=2*cam.d*Math.tan(R3.cam.fov*Math.PI/360)/(R3.H||600),kf=wpp/Math.max(.45,Math.sin(pitchOf(cam.d)));
  const rx=Math.cos(cam.yaw),rz=-Math.sin(cam.yaw),fx=-Math.sin(cam.yaw),fz=-Math.cos(cam.yaw);
  camT.tx=clamp(camT.tx-rx*dx*wpp+fx*dy*kf,-FX,FX);camT.tz=clamp(camT.tz-rz*dx*wpp+fz*dy*kf,-FZ,FZ);

const zoomTo=d=>{camT.d=clamp(d,22,240);};
function attachPointer(el){
  const ptrs=new Map();let g=null;
  el.addEventListener('pointerdown',e=>{
    if(!B||!R3.scene)return;try{el.setPointerCapture(e.pointerId);}catch(err){}ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===1)g={mode:e.button===2?'rot':'tap',x0:e.clientX,y0:e.clientY,t0:performance.now(),lx:e.clientX,ly:e.clientY};
    else if(ptrs.size===2){const [a,b]=[...ptrs.values()];g={mode:'multi',d0:Math.hypot(a.x-b.x,a.y-b.y)||1,a0:Math.atan2(b.y-a.y,b.x-a.x),cd:camT.d,cy:camT.yaw,mx:(a.x+b.x)/2,my:(a.y+b.y)/2};}
  });
  el.addEventListener('pointermove',e=>{
    const p=ptrs.get(e.pointerId);if(!p||!g)return;p.x=e.clientX;p.y=e.clientY;
    if(g.mode==='multi'&&ptrs.size>=2){const [a,b]=[...ptrs.values()],mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
      zoomTo(g.cd*g.d0/Math.max(20,Math.hypot(a.x-b.x,a.y-b.y)));camT.yaw=g.cy+(Math.atan2(b.y-a.y,b.x-a.x)-g.a0);
      panBy(mx-g.mx,my-g.my);g.mx=mx;g.my=my;return;}
    if(g.mode==='tap'&&Math.hypot(e.clientX-g.x0,e.clientY-g.y0)>8)g.mode='pan';
    if(g.mode==='pan')panBy(e.clientX-g.lx,e.clientY-g.ly);
    else if(g.mode==='rot'){camT.yaw-=(e.clientX-g.lx)*.008;zoomTo(camT.d*(1+(e.clientY-g.ly)*.004));}
    g.lx=e.clientX;g.ly=e.clientY;
  });
  const up=e=>{
    if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
    if(g&&g.mode==='tap'&&!ptrs.size&&e.type==='pointerup'&&performance.now()-g.t0<650){const r=el.getBoundingClientRect();onTap(e.clientX-r.left,e.clientY-r.top);}
    if(!ptrs.size)g=null;else if(g&&g.mode==='multi'){const [a]=[...ptrs.values()];g={mode:'pan',lx:a.x,ly:a.y};}

  el.addEventListener('contextmenu',e=>e.preventDefault());

}
function onTap(px,py){
  if(!B||B.over||B.headless)return;
  R3.ray.setFromCamera(new THREE.Vector2(px/R3.W*2-1,-(py/R3.H)*2+1),R3.cam);
  const hit=R3.ray.intersectObject(R3.ground)[0],pt=hit?hit.point:null,cands=[];
  for(const u of B.units){if(!onField(u))continue;let sc=1e9;
    if(pt){const d=ptSeg(pt.x,pt.z,seg(u))[0];if(d<u.dm.hd+2.5)sc=d;}
    const p=projectU(u,labH(u)*.6);if(p){const s=Math.hypot(p[0]-px,p[1]-py);if(s<30)sc=Math.min(sc,s*.15);}
    if(sc<1e9)cands.push([sc,u]);}
  cands.sort((a,b)=>a[0]-b[0]);
  const foe=B.phase==='battle'&&B.sel.size?cands.find(c=>c[1].side===1):null,c=foe||cands[0];
  if(c)unitTap(c[1]);else if(pt)groundTap(pt);
}
function unitTap(u){
  if(!B||B.over||B.headless)return;
  if(u.side===0){if(!active(u))return;if(B.sel.size===1&&B.sel.has(u.uid))B.sel.clear();else{B.sel=new Set([u.uid]);AU.ui('select');}B.insp=null;}
  else if(B.phase==='battle'&&selUnits().length){orderAttack(selUnits(),u);B.insp=null;}
  else B.insp=B.insp===u.uid?null:u.uid;
  hud();
}
function groundTap(pt){
  const sel=selUnits();
  if(!sel.length){B.insp=null;return hud();}
  if(B.phase==='deploy')deployMove(sel,pt);else orderMove(sel,pt);
  hud();
}
function cardTap(id){
  const u=unitById(id);if(!u||!active(u)||B.over||B.headless)return;const now=performance.now();
  if(B.lastCard.id===id&&now-B.lastCard.t<350){B.sel.add(id);camT.tx=clamp(u.x,-FX,FX);camT.tz=clamp(u.z+15,-FZ,FZ);B.lastCard.id=null;return hud();}
  B.lastCard={id,t:now};if(B.sel.has(id))B.sel.delete(id);else{B.sel.add(id);AU.ui('select');}B.insp=null;hud();
}
document.addEventListener('keydown',e=>{
  if(!B||B.over||!R3.scene||!$('#modal').classList.contains('hidden'))return;

/* ---- camera and input ---- */
const cmPitch=d=>lerp(.55,1.15,sstep(100,1000,d));
function cmCamUpdate(dt){
  const k=Math.min(1,dt*9);cv.tx+=(ct.tx-cv.tx)*k;cv.tz+=(ct.tz-cv.tz)*k;cv.d+=(ct.d-cv.d)*k;cv.yaw+=angDiff(cv.yaw,ct.yaw)*k;
  const p=cmPitch(cv.d),ty=Math.max(0,hm(cv.tx,cv.tz)),c=CM.cam;
  c.position.set(cv.tx+Math.sin(cv.yaw)*Math.cos(p)*cv.d,ty+Math.sin(p)*cv.d,cv.tz+Math.cos(cv.yaw)*Math.cos(p)*cv.d);
  const gh=Math.max(0,hm(c.position.x,c.position.z))+9;if(c.position.y<gh)c.position.y=gh;
  c.lookAt(cv.tx,ty,cv.tz);

function cmPan(dx,dy){
  const wpp=2*cv.d*Math.tan(CM.cam.fov*Math.PI/360)/(CM.H||600),kf=wpp/Math.max(.4,Math.sin(cmPitch(cv.d)));
  const rx=Math.cos(cv.yaw),rz=-Math.sin(cv.yaw),fx=-Math.sin(cv.yaw),fz=-Math.cos(cv.yaw);
  ct.tx=clamp(ct.tx-rx*dx*wpp+fx*dy*kf,-30,MW+30);ct.tz=clamp(ct.tz-rz*dx*wpp+fz*dy*kf,-30,MH+30);
}
function cmFocus(x,z){ct.tx=clamp(x,0,MW);ct.tz=clamp(z,0,MH);}

function cmPointer(el){
  const ptrs=new Map();let g=null;
  el.addEventListener('pointerdown',e=>{
    if(!CM.on)return;try{el.setPointerCapture(e.pointerId);}catch(err){}ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===1)g={mode:e.button===2?'rot':'tap',x0:e.clientX,y0:e.clientY,t0:performance.now(),lx:e.clientX,ly:e.clientY};
    else if(ptrs.size===2){const [a,b]=[...ptrs.values()];g={mode:'multi',d0:Math.hypot(a.x-b.x,a.y-b.y)||1,a0:Math.atan2(b.y-a.y,b.x-a.x),cd:ct.d,cy:ct.yaw,mx:(a.x+b.x)/2,my:(a.y+b.y)/2};}
  });
  el.addEventListener('pointermove',e=>{
    const p=ptrs.get(e.pointerId);if(!p||!g)return;p.x=e.clientX;p.y=e.clientY;
    if(g.mode==='multi'&&ptrs.size>=2){const [a,b]=[...ptrs.values()],mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
      ct.d=clamp(g.cd*g.d0/Math.max(20,Math.hypot(a.x-b.x,a.y-b.y)),CD_MIN,CD_MAX);ct.yaw=g.cy+(Math.atan2(b.y-a.y,b.x-a.x)-g.a0);
      cmPan(mx-g.mx,my-g.my);g.mx=mx;g.my=my;return;}
    if(g.mode==='tap'&&Math.hypot(e.clientX-g.x0,e.clientY-g.y0)>8)g.mode='pan';
    if(g.mode==='pan')cmPan(e.clientX-g.lx,e.clientY-g.ly);
    else if(g.mode==='rot'){ct.yaw-=(e.clientX-g.lx)*.008;ct.d=clamp(ct.d*(1+(e.clientY-g.ly)*.004),CD_MIN,CD_MAX);}
    g.lx=e.clientX;g.ly=e.clientY;
  });
  const up=e=>{
    if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
    if(g&&g.mode==='tap'&&!ptrs.size&&e.type==='pointerup'&&performance.now()-g.t0<650){const r=el.getBoundingClientRect();cmTap(e.clientX-r.left,e.clientY-r.top);}
    if(!ptrs.size)g=null;else if(g&&g.mode==='multi'){const [a]=[...ptrs.values()];g={mode:'pan',lx:a.x,ly:a.y};}
  };
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  el.addEventListener('contextmenu',e=>e.preventDefault());

}
function cmTap(px,py){

    const d=Math.min((c.bx-px)**2+(c.by-py)**2,(c.lx-px)**2+(c.ly-py)**2);if(d<bd){bd=d;best=n.id;}}

function cmProject(){
  const W=CM.W,H=CM.H,s=CM.sc,v=CM.v,far=cv.d>640,show=[];
  for(const n of NODES){const c=CM.city[n.id];
    v.set(n.x,n.gh+3*s,n.z).project(CM.cam);c.vis=v.z<1&&Math.abs(v.x)<1.15&&Math.abs(v.y)<1.15;
    c.bx=(v.x+1)/2*W;c.by=(1-v.y)/2*H;
    v.set(n.x,n.gh+12*s,n.z).project(CM.cam);c.lx=(v.x+1)/2*W;c.ly=(1-v.y)/2*H;
    if(c.vis&&!(far&&c.small&&c.pri<20))show.push(c);else if(c.lab.style.display!=='none')c.lab.style.display='none';}
  show.sort((a,b)=>b.pri-a.pri);const placed=[]; // busier labels first; any that would overlap one already placed are tucked away
  for(const c of show){

}
