      `<td>+${fmt(income(s))}</td><td class="${o<40?'neg':o>=80?'pos':''}">${o}%</td><td>${s.units.length}${rdy<s.units.length?`<small>${rdy} ready</small>`:''}</td><td data-v="go:${s.id}:build">${bcell(s)}</td></tr>`;};
  const units=own.reduce((a,s)=>a+s.units.length,0),net=netIncome(PLAYER);
  let h=`<table class="ctab"><thead><tr>${th('name','City')}${th('income','Income')}${th('order','Order')}${th('army','Army')}<th>Build</th></tr></thead><tbody>${own.map(row).join('')}</tbody>`+
    `<tfoot><tr class="tot"><td>${own.length} cit${own.length===1?'y':'ies'}</td><td>+${fmt(grossIncome(PLAYER))}</td><td></td><td>${units}</td><td></td></tr></tfoot></table>`;
  h+=`<div class="chk-foot">Army upkeep −${fmt(upkeep(PLAYER))} · net <b class="${net<0?'neg':'pos'}">${net>=0?'+':''}${fmt(net)}</b> per turn. Tap a city to go there, its building to open the Build tab, a heading to sort.</div>`;
  const field=passStates().filter(s=>s.owner===PLAYER&&(s.units.length||s.bld.walls)),marches=G.orders.filter(o=>G.s[o.at].units.some(u=>o.uids.includes(u.uid)));
  if(field.length)h+=`<div class="qcap" style="margin-top:12px">In the field</div><div class="jumps">${field.map(s=>`<button class="jump" data-v="go:${s.id}:army">${dz[s.id]?'⚠️ ':''}${s.bld.walls?'🏰':'⛺'} ${sname(s)} · ${s.units.length} unit${s.units.length===1?'':'s'}</button>`).join('')}</div>`;
  if(marches.length)h+=`<div class="qcap" style="margin-top:12px">On the march</div><div class="jumps">${marches.map(o=>{const p=routeTo(o.at,o.to);return`<button class="jump" data-v="go:${o.at}:army">🚩 ${NODE[o.at].name} → ${NODE[o.to].name}${p?` · ${ordEta(p,o.to)}`:''}</button>`;}).join('')}</div>`;
  const v=await modal({title:'Your cities',body:h,buttons:[{label:'Close',value:0,cls:'primary'}]});
  if(typeof v==='string'&&v.startsWith('sort:')){ovSort=v.slice(5);return openCities();}
  jumpTo(v);
}

/* ================= MENU / TITLE ================= */
const help=()=>`<p>You lead ${G?theF(PLAYER):'one of six powers'} in 280 BC. <b>Win by holding 18 of the 26 cities.</b></p><ul>
<li><b>Cities</b> earn gold from taxes. Build farms to grow, markets for income, temples for order, barracks and stables for better troops, walls for defence. Cities unlock bigger buildings as they grow past ${fmt(TIER_POP[0])} and ${fmt(TIER_POP[1])} people. A city builds one thing at a time, but you can queue up to ${BUILD_MAX} projects — gold is paid when you queue, and cancelling refunds it.</li>
<li><b>Local goods</b>: every city has one — grain for growth, salt for order, wine, oil and purple dye for gold, iron for veteran recruits, horses for cheap cavalry, timber for cheap building. A <b>temple</b> is dedicated to one god when its first shrine goes up, and each god brings a different gift.</li>
<li><b>Paved roads</b>: a city can pave the road to a neighbouring city of yours. On it an army marches two stops in one turn, and both cities earn trade. A <b>Great City</b> (${fmt(GREAT)} people) can raise one of five <b>wonders</b>, each unique in the world, whose gift reaches all your cities — and passes to whoever takes the city.</li>
<li><b>Public order</b> drops with high taxes, big cities and recent conquest. Below 20% a lightly held city can revolt.</li>
<li><b>Every people has its own way</b>${G?` — yours is <b>${PERK[PLAYER].ico} ${PERK[PLAYER].name}</b>: ${PERK[PLAYER].txt}`:'.'} ${Object.keys(PERK).filter(f=>!G||f!==PLAYER).map(f=>`${theF(f,1)}: ${PERK[f].name.toLowerCase()}`).join('; ')}.</li>
<li><b>Mercenaries</b>: each region of Italy, Sicily and Africa has its own hired swords — Gauls, Samnites, Campanian horse, hoplites, Numidians and more. Hire them in the Recruit tab of any city there: they need no barracks and march at once, but cost more to keep and walk off first if the pay stops. The pool refills slowly.</li>
<li><b>The balance of power</b>: a people that holds ${COAL_ON} cities scares all the rest into a <b>coalition</b> — they stop fighting each other and turn on the leader until it falls below ${COAL_OFF}. And a few years in, <b>Pyrrhus of Epirus</b> lands in the Greek south with his phalanx and elephants to fight for the Greek cities (the Samnites are his allies), for about ${PYR_STAY} turns. Epirus sends him no fresh men, so every victory costs him.</li>
<li><b>Armies</b> live in cities. Select units in the Army tab and march one city per turn. Marching into an enemy city starts a battle. Tap a city farther off and the army marches there on its own, one stop at the start of each turn, through your own land — it halts before enemy ground, so the attack is always your call. A march through your own land can be taken back with <b>↶ Undo march</b> until the turn ends.</li>
<li><b>Passes and forts</b> mark the roads between cities. An army can camp on one, and while it holds it the road is closed: an enemy marching that way must break it first, on an open field (or against a fort's walls). A camped army can build a timber or stone fort. Armies next to a battle march to join it as <b>relief</b>, arriving from the flank a little way into the fight.</li>
<li><b>Battles</b> are fought in real time on a 3D field — command them yourself or auto-resolve. Tap a unit (or its card) to select it, then tap the ground to march or an enemy to attack. Drag to pan, pinch to zoom, twist or use ⟲ ⟳ to rotate. Pause any time; orders still work while paused.</li>
<li><b>Tactics</b>: units that run into the enemy charge, cavalry hardest, but spearmen brace against horses. Hitting a flank or the rear breaks morale fast, and a general nearby steadies his men. Hills help, forests slow horses, walls slow attackers outside the gates, and missile troops fall back from melee.</li>
<li><b>Routing</b> units flee toward their edge of the field and may rally. When one side has no steady units left, it loses. Attackers must win before time runs out.</li>
<li><b>Sound</b>: music changes between the title, the campaign map and the battlefield. Tap the speaker button to switch to effects only, or to mute everything.</li>
<li><b>Before a turn ends</b>, a checklist flags anything that needs you: an emptying treasury, cities a neighbour could attack, unrest, idle builders and easy targets. Tap a name to go there; switch it off in the menu. A city a neighbour has the men to attack carries a pulsing ⚠️ on the map, and its sheet says where the threat comes from.</li>
<li><b>🏛 Cities</b> lists all your cities — income, order, troops and building — with your camps and armies on the march. Tap a row to go there. Dispatches work the same way: tap one to jump to the place it's about.</li>
<li>The game saves after every turn on this device.</li></ul>`;
function factionsBody(){
  const rows=Object.keys(FACTIONS).map(f=>{const own=ownedBy(f);return[f,own.length,own.reduce((a,s)=>a+s.units.length,0)];}).filter(r=>r[1]||r[0]===PLAYER);
  const co=G.coal,P=G.pyr;
  return`<table class="ftab">${rows.map(([f,c,u])=>`<tr><td><span class="sw" style="background:${FACTIONS[f].color}"></span>${FACTIONS[f].name}${f===PLAYER?' <span class="you">(you)</span>':''}${G.coal&&G.coal.f===f?' 🤝':''}</td><td>${c} cit${c===1?'y':'ies'}</td><td>${u} units</td></tr>`).join('')}</table>`+
    (co?`<p class="chk-foot">🤝 The other powers stand together against ${co.f===PLAYER?'you':theF(co.f)} until ${co.f===PLAYER?'you hold':theF(co.f)+(FACTIONS[co.f].sg?' holds':' hold')} fewer than ${COAL_OFF} cities.</p>`:'')+
    (pyrOn()?`<p class="chk-foot">🐘 Pyrrhus of Epirus fights for the Greek cities — for ${Math.max(1,PYR_STAY-(G.turn-P.t))} more turn${PYR_STAY-(G.turn-P.t)>1?'s':''}.</p>`:'');
}
async function openMenu(){
  if(UI.busy)return;
  const v=await modal({title:'Imperivm',body:factionsBody(),buttons:[{label:'Resume',value:'r',cls:'primary'},{label:'Your cities',value:'o'},{label:'Last dispatches',value:'d'},{label:'Unit size: '+SIZE_NAME[unitSize],value:'u'},{label:'Graphics: '+GFX_NAME[gfx],value:'g'},{label:'Turn checklist: '+(chkOn?'On':'Off'),value:'c'},{label:'How to play',value:'h'},{label:'New campaign',value:'n'}]});
  if(v==='u'){unitSize=SIZES[(SIZES.indexOf(unitSize)+1)%SIZES.length];try{localStorage.setItem(SIZE_KEY,unitSize);}catch(e){}
    toast('Unit size: '+SIZE_NAME[unitSize]+' — '+{normal:'one figure for every 4 men',large:'one figure for every 2 men',huge:'every man on the field'}[unitSize]);return openMenu();}
  if(v==='g'){gfx=GFXS[(GFXS.indexOf(gfx)+1)%GFXS.length];try{localStorage.setItem(GFX_KEY,gfx);}catch(e){}if(CM.rend){CM.rend.setPixelRatio(gfxPR());cmFit();cmShadowCfg();}
    toast('Graphics: '+GFX_NAME[gfx]+' — '+{low:'fastest: no shadows or grass',medium:'shadows, grass and kit details',high:'sharpest, with the thickest grass'}[gfx]);return openMenu();}
  if(v==='c'){chkOn=!chkOn;try{localStorage.setItem(CHK_KEY,chkOn?'1':'0');}catch(e){}
    toast(chkOn?'Turn checklist on — loose ends are listed before each turn ends':'Turn checklist off — turns end straight away');return openMenu();}
  if(v==='d')showReports(G.last||[],'Last dispatches').then(jumpTo);
  if(v==='o')openCities();
  if(v==='h')modal({title:'How to play',body:help(),buttons:[{label:'Got it',value:1,cls:'primary'}]});
  if(v==='n'){const ok=await modal({title:'Start over?',body:'<p>Your current campaign will be erased.</p>',buttons:[{label:'Start a new campaign',value:1,cls:'primary'},{label:'Cancel',value:0}]});if(ok)newCampaign(true);}
}
let mapReady=false;
async function enterCampaign(){
  UI.undo=[];$('#title').classList.add('hidden');$('#campaign').classList.remove('hidden');$('#tbEmblem').textContent=PLAYABLE[PLAYER].emblem;
  if(!mapReady){buildRegions();buildRoads();mapReady=true;}
  if(!CM.ok&&!CM.failed&&webglOK()){ // the 3D map; if it can't load, the flat map still works
    $('#cmLoad').classList.remove('hidden');
    try{await loadThree();cmInit();}catch(e){console.error(e);CM.failed=true;}
    $('#cmLoad').classList.add('hidden');
  }
  CM.on=CM.ok;
  $('#mapGL').classList.toggle('hidden',!CM.on);$('#cmLabels').classList.toggle('hidden',!CM.on);$('#mapScroll').classList.toggle('hidden',CM.on);

async function pickFaction(canBack){ // resolves to a faction id, or null if the player backs out
  let sel=PLAYER;
  const go=f=>'Lead '+theF(f);
  const card=f=>{const F=FACTIONS[f],S=PLAYABLE[f],n=SDEF.filter(d=>d[4]===f).length;
    return`<button class="fpick${f===sel?' on':''}" data-f="${f}"><span class="ff" style="background:${F.color}"></span><span class="main">`+
      `<span class="t">${F.name}<span class="dif ${S.diff.toLowerCase()}">${S.diff}</span></span><span class="d">${S.blurb}</span><span class="d"><b>${PERK[f].ico} ${PERK[f].name}:</b> ${PERK[f].txt}</span>`+
      `<span class="ic">${F.roster.map(t=>symSvg(UNITS[t].kind,F.color,22)).join('')}<span>${n} cities · ${NODE[F.capital].name}</span></span></span></button>`;};
  const p=modal({title:'Choose your people',body:Object.keys(PLAYABLE).map(card).join(''),
    buttons:[{label:go(sel),value:'go',cls:'primary'},...(canBack?[{label:'Back',value:null}]:[])]});
  const mc=$('#mcard'),btn=mc.querySelector('.mbtns [data-i="0"]');mc.classList.add('picker');
  mc.querySelectorAll('.fpick').forEach(b=>b.onclick=()=>{sel=b.dataset.f;btn.textContent=go(sel);mc.querySelectorAll('.fpick').forEach(x=>x.classList.toggle('on',x===b));});
  const v=await p;mc.classList.remove('picker');

}
async function newCampaign(canBack){
  const fid=await pickFaction(canBack);if(!fid)return;
  newGame(fid);save();UI.sel=null;UI.move=null;UI.nextIdx=-1;closeSheet();await enterCampaign();
  const S=PLAYABLE[PLAYER];
  await modal({title:'Summer, 280 BC',body:`<p>${S.intro}</p><p>${S.hint} Tap a city to see its army, buildings and recruits.</p>`,buttons:[{label:'Begin',value:1,cls:'primary'},{label:'How to play',value:'h'}]}).then(v=>v==='h'&&modal({title:'How to play',body:help(),buttons:[{label:'Got it',value:1,cls:'primary'}]}));
}
function laurel(){
  let h='';for(const side of [-1,1])for(let i=0;i<9;i++){const a=Math.PI*(.62+i*.085),x=side*Math.cos(a)*-52,y=Math.sin(a)*-52+18;
    h+=`<ellipse cx="${(x).toFixed(1)}" cy="${(y).toFixed(1)}" rx="9" ry="3.6" fill="#c9a24a" transform="rotate(${(side*(a*180/Math.PI-90)+side*35).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;}
  h+=`<text x="0" y="8" text-anchor="middle" font-family="Cinzel,serif" font-weight="900" font-size="22" fill="#efcd78" letter-spacing="3">SPQR</text>`;
  $('#laurel').innerHTML=h;
}
function sndUI(){const m=AU.mode();document.querySelectorAll('.snd').forEach(b=>{b.textContent=['🔊','🔉','🔇'][m];});}
function initTitle(){
  sndUI();
  $('#tapGate').onclick=()=>{AU.unlock();AU.music('menu',{fade:2.5});$('#tapGate').classList.add('off');$('#title').classList.remove('gated');};
  laurel();const has=loadSave();const b=$('#titleBtns');
  const hasF=has&&PLAYABLE[has.player]?has.player:'rome';
  b.innerHTML=(has&&!has.lost?`<button class="btn gold" id="tCont">Continue · ${FACTIONS[hasF].name}, turn ${has.turn}</button>`:'')+`<button class="btn ${has&&!has.lost?'ghost':'gold'}" id="tNew">New campaign</button><button class="btn ghost" id="tHelp">How to play</button>`;
  if($('#tCont'))$('#tCont').onclick=()=>{useGame(has);enterCampaign();};
  $('#tNew').onclick=async()=>{if(has&&!has.lost){const ok=await modal({title:'Start over?',body:'<p>This replaces your saved campaign.</p>',buttons:[{label:'Start a new campaign',value:1,cls:'primary'},{label:'Cancel',value:0}]});if(!ok)return;}newCampaign(true);};
  $('#tHelp').onclick=()=>modal({title:'How to play',body:help(),buttons:[{label:'Got it',value:1,cls:'primary'}]});
}

if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname))window.imp={get B(){return B;},aiStrike,aiFree,aiNeed,siegeOf,armyPower,reliefPower,lineSlots,orderLine,selUnits,get G(){return G;},routeTo,runOrders,dangerScan,undoMove,openCities,onNode,startMove,render,repaintTerritory,drawMap,PNODES,gateOn,reliefFor,moveTargets,UI,doBattle,executeMove,tidyPasses,aiTurn,endTurn,newGame,enterCampaign,hireMerc,mercTick,pyrrhusTick,coalTick,capture,save,ownedBy,netIncome,cam,camT,R3,CM,cv,ct,ATMOS,cmSync,beginBattle,atmo:k=>{atmoSet(k);return R3.atmoK;},size(s){if(SIZES.includes(s))unitSize=s;return unitSize;},adv(s){const sp=B.speed;B.speed=1;for(let i=0;i<s/.05&&B&&R3.scene;i++){cancelAnimationFrame(R3.raf);R3.last=performance.now()-50;frame(performance.now());}if(B)B.speed=sp;}},window.testBattle=(p,e,eFid='gauls',walls=0,atmo,x)=>{ // x: {field, fort, land, pRelief:[types], eRelief:[types], delay, playerIsAttacker}

  const rl=(a,sd)=>(a||[]).map((t,i)=>({cu:mk(t),delay:(x.delay||20)+i*3,rx:sd*(i%2?1:-1)}));
  p=p||['general','rm_hastati','rm_principes','rm_triarii','rm_velites','rm_equites','rm_legion'];
  e=e||['ga_war','ga_war','ga_chosen','ga_spear','ga_skirm','ga_cav','ga_noble'];
  $('#title')&&$('#title').classList.add('hidden');
  return runBattle({title:'Test Battle',playerIsAttacker:x.playerIsAttacker!==false,pUnits:p.map(mk),eUnits:e.map(mk),eFid,walls,atmo,field:x.field,fort:x.fort,land:x.land,ambush:x.ambush,rams:x.rams,ladders:x.ladders,ramK:x.ramK,pRelief:rl(x.pRelief,1),eRelief:rl(x.eRelief,-1)});
};
initTitle();
})();
