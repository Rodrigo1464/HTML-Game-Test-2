/* ================= CAMPAIGN AI ================= */
function hostileDist(f){const d={},q=[];for(const n of NODES)if(G.s[n.id].owner!==f){d[n.id]=0;q.push(n.id);}
  while(q.length){const c=q.shift();for(const m of ADJ[c])if(d[m]===undefined){d[m]=d[c]+1;q.push(m);}}return d;}
const threat=(s,f)=>ADJ[s.id].map(id=>G.s[id]).filter(t=>t.owner!==f&&t.owner!=='rebels').reduce((a,t)=>a+armyPower(t.units),0);
function desired(s,f,hd){if(G.cap[f]===s.id)return 7;if(hd[s.id]===1)return clamp(3+Math.round(threat(s,f)/300),3,9);return 1;}
function aiPickUnit(s,f){
  const ros=FACTIONS[f].roster.filter(t=>canRecruit(s,t));if(!ros.length)return null;
  const miss=s.units.filter(u=>UNITS[u.type].kind==='missile').length,cav=s.units.filter(u=>UNITS[u.type].kind==='cav').length;
  let best=null,bs=-1e9;
  for(const t of ros){const T=UNITS[t];let sc=(T.req?T.req.lv:0)*2+Math.random()*3;
    if(T.kind==='missile')sc+=miss<1?3:miss>=2?-4:-1;if(T.kind==='cav')sc+=cav<1?2:-2;if(T.cost>G.gold[f]*.6)sc-=3;
    if(sc>bs){bs=sc;best=t;}}
  return best;
}
function aiPickBuilding(s,hd){
  const o=[];for(const k of BKEYS){const lv=s.bld[k];if(lv>=tier(s))continue;
    let w={farms:2,market:2.5,temple:1,barracks:2,stables:1,walls:1}[k];
    if(k==='walls'&&hd[s.id]===1)w+=2;if(k==='temple'&&order(s)<55)w+=3;if(k==='barracks'&&lv===0)w+=1.5;
    o.push([k,w*(.5+Math.random())]);}
  o.sort((a,b)=>b[1]-a[1]);return o[0]?o[0][0]:null;
}
async function aiTurn(f){
  const F=FACTIONS[f];let hd=hostileDist(f),started=0;
  for(const s of shuffle(ownedBy(f))){if(s.build||started>=2)continue;const k=aiPickBuilding(s,hd);if(!k)continue;
    const c=BUILD[k].cost[s.bld[k]];if(G.gold[f]-c<250)continue;G.gold[f]-=c;s.build={k,t:BUILD[k].turns[s.bld[k]]};started++;}
  for(const s of ownedBy(f).sort((a,b)=>threat(b,f)-threat(a,f))){
    const want=desired(s,f,hd);let n=0;
    if(G.cap[f]===s.id&&countGenerals(f)<2&&G.gold[f]>1500&&s.units.length<MAX_UNITS){G.gold[f]-=UNITS.general.cost;s.units.push(mkUnit('general',true));}
    while(s.units.length<Math.min(want,MAX_UNITS)&&n<(G.cap[f]===s.id?2:1)){const t=aiPickUnit(s,f);if(!t)break;const T=UNITS[t];
      if(G.gold[f]-T.cost<150||netIncome(f)-T.upk<-20)break;G.gold[f]-=T.cost;s.units.push(mkUnit(t,true));n++;}
  }
  for(const s of shuffle(ownedBy(f))){
    if(s.owner!==f)continue;const av=s.units.filter(u=>!u.moved);if(!av.length)continue;
    const keepN=Math.max(0,(G.cap[f]===s.id?2:1)-(s.units.length-av.length));
    const sorted=av.slice().sort((a,b)=>unitPower(b)-unitPower(a)),force=sorted.slice(0,Math.max(0,sorted.length-keepN));
    if(!force.length)continue;const ap=armyPower(force);let best=null,bs=0;
    for(const id of ADJ[s.id]){const t=G.s[id];if(t.owner===f)continue;if(t.owner===PLAYER&&G.turn<4)continue;
      const dp=t.units.length?armyPower(t.units)*(1+.15*t.bld.walls):0;if(dp>0&&ap<dp*1.3/F.aggr)continue;
      const sc=(ap+1)/(dp+50)+(t.owner==='rebels'?.4:0)+(t.owner===PLAYER?.3:0)+t.pop/20000;if(sc>bs){bs=sc;best=t;}}
    if(!best)continue;
    const send=best.units.length?force:[force[force.length-1]];
    await cmMarchAI(s.id,best.id,f,send);
    s.units=s.units.filter(u=>!send.includes(u));send.forEach(u=>u.moved=true);
    await doBattle({attFid:f,units:send,from:s,to:best});
    if(G.lost)return;
  }
  hd=hostileDist(f);
  for(const s of ownedBy(f)){const av=s.units.filter(u=>!u.moved);if(av.length<=1||hd[s.id]<=1)continue;
    const dest=ADJ[s.id].map(id=>G.s[id]).filter(t=>t.owner===f&&t.units.length<MAX_UNITS&&hd[t.id]<hd[s.id])[0];if(!dest)continue;
    const mv=av.slice(1,1+MAX_UNITS-dest.units.length);s.units=s.units.filter(u=>!mv.includes(u));mv.forEach(u=>u.moved=true);dest.units.push(...mv);}
}

/* ================= TURN PROCESSING ================= */
function econTick(f){
  G.gold[f]+=netIncome(f);
  for(const s of ownedBy(f)){
    if(s.build){s.build.t--;if(s.build.t<=0){const k=s.build.k;s.bld[k]++;if(f===PLAYER)report('🏛️',`${BUILD[k].lv[s.bld[k]-1]} completed in ${sname(s)}.`);s.build=null;}}
    s.pop=Math.round(s.pop*(1+growth(s)/100));s.unrest=Math.max(0,s.unrest-5);s.rec=0;
    for(const u of s.units)u.men=Math.min(UNITS[u.type].men,u.men+Math.ceil(UNITS[u.type].men*.12));
    if(order(s)<20&&s.units.length<2&&G.cap[f]!==s.id&&Math.random()<.35){
      s.owner='rebels';s.units=['rb_mil','rb_mil','rb_sling'].map(t=>mkUnit(t,false));s.unrest=0;s.build=null;s.tax=1;
      if(f===PLAYER)report('🔥',`${sname(s)} revolted and declared itself free!`);}
  }
  if(G.gold[f]<0){let worst=null,ws=null;for(const s of ownedBy(f))for(const u of s.units)if(u.type!=='general'&&(!worst||UNITS[u.type].upk>UNITS[worst.type].upk)){worst=u;ws=s;}
    if(worst){ws.units=ws.units.filter(u=>u!==worst);if(f===PLAYER)report('💰',`Unpaid, the ${UNITS[worst.type].name} in ${sname(ws)} deserted. Keep the treasury above zero.`);}}
}
function rebelTick(){for(const s of ownedBy('rebels')){s.pop=Math.round(s.pop*1.006);
  for(const u of s.units)u.men=Math.min(UNITS[u.type].men,u.men+Math.ceil(UNITS[u.type].men*.1));
  if(s.units.length<3&&Math.random()<.25)s.units.push(mkUnit(pick(['rb_mil','rb_spear','rb_sling']),false));}}
async function endTurn(){
  if(UI.busy||G.lost)return;UI.busy=true;AU.ui('endturn');cancelMove();closeSheet();G.reports=[];
  $('#busy').classList.remove('hidden');
  try{
    econTick(PLAYER);
    for(const f of AI_ORDER){if(!ownedBy(f).length)continue;econTick(f);await sleep(120);await aiTurn(f);repaintTerritory();renderNodes();if(G.lost||!ownedBy(PLAYER).length)break;}
    rebelTick();G.turn++;
    for(const n of NODES)for(const u of G.s[n.id].units)u.moved=false;
  }finally{$('#busy').classList.add('hidden');UI.busy=false;}
  G.last=G.reports.slice();save();render();
  if(await checkEnd())return;
  if(G.reports.length)await showReports(G.reports,'Dispatches');
}
function showReports(list,title){
  return modal({title,body:list.length?list.map(r=>`<div class="rep"><span>${r.icon}</span><span>${r.text}</span></div>`).join(''):'<p>A quiet season. Nothing of note to report.</p>',buttons:[{label:'Continue',value:1,cls:'primary'}]});
}
async function checkEnd(){
  const n=ownedBy(PLAYER).length;
  if(!n&&!G.lost){G.lost=true;save();AU.stinger('defeat');
    await modal({title:'Rome has fallen',body:'<p>The last Roman city is lost. The Republic is no more.</p>',buttons:[{label:'Start a new campaign',value:1,cls:'primary'}]});
    newCampaign(true);return true;}
  const alive=AI_ORDER.filter(f=>ownedBy(f).length);
  if(!G.won&&(n>=18||!alive.length)){G.won=true;save();AU.stinger('victory');
    await modal({title:'Triumph',body:`<p>Rome holds ${n} cities. The Senate grants you a triumph through the streets of Roma — Italy is yours.</p><p>You can keep playing to finish off your rivals.</p>`,buttons:[{label:'Continue the campaign',value:1,cls:'gold'}]});return true;}
  return false;
}

/* ================= MENU / TITLE ================= */
const HELP=`<p>You lead Rome in 280 BC. <b>Win by holding 18 of the 26 cities.</b></p><ul>
<li><b>Cities</b> earn gold from taxes. Build farms to grow, markets for income, temples for order, barracks and stables for better troops, walls for defence.</li>
<li><b>Public order</b> drops with high taxes, big cities and recent conquest. Below 20% a lightly held city can revolt.</li>
<li><b>Armies</b> live in cities. Select units in the Army tab and march one city per turn. Marching into an enemy city starts a battle.</li>
<li><b>Battles</b> are fought in real time on a 3D field — command them yourself or auto-resolve. Tap a unit (or its card) to select it, then tap the ground to march or an enemy to attack. Drag to pan, pinch to zoom, twist or use ⟲ ⟳ to rotate. Pause any time; orders still work while paused.</li>
<li><b>Tactics</b>: units that run into the enemy charge, cavalry hardest, but spearmen brace against horses. Hitting a flank or the rear breaks morale fast, and a general nearby steadies his men. Hills help, forests slow horses, walls slow attackers outside the gates, and missile troops fall back from melee.</li>
<li><b>Routing</b> units flee toward their edge of the field and may rally. When one side has no steady units left, it loses. Attackers must win before time runs out.</li>
<li><b>Sound</b>: music changes between the title, the campaign map and the battlefield. Tap the speaker button to switch to effects only, or to mute everything.</li>
<li>The game saves after every turn on this device.</li></ul>`;
function factionsBody(){
  const rows=Object.keys(FACTIONS).map(f=>{const own=ownedBy(f);return[f,own.length,own.reduce((a,s)=>a+s.units.length,0)];}).filter(r=>r[1]||r[0]===PLAYER);
  return`<table class="ftab">${rows.map(([f,c,u])=>`<tr><td><span class="sw" style="background:${FACTIONS[f].color}"></span>${FACTIONS[f].name}</td><td>${c} cit${c===1?'y':'ies'}</td><td>${u} units</td></tr>`).join('')}</table>`;
}
async function openMenu(){
  if(UI.busy)return;
  const v=await modal({title:'Imperivm',body:factionsBody(),buttons:[{label:'Resume',value:'r',cls:'primary'},{label:'Last dispatches',value:'d'},{label:'How to play',value:'h'},{label:'New campaign',value:'n'}]});
  if(v==='d')showReports(G.last||[],'Last dispatches');
  if(v==='h')modal({title:'How to play',body:HELP,buttons:[{label:'Got it',value:1,cls:'primary'}]});
  if(v==='n'){const ok=await modal({title:'Start over?',body:'<p>Your current campaign will be erased.</p>',buttons:[{label:'Start a new campaign',value:1,cls:'primary'},{label:'Cancel',value:0}]});if(ok)newCampaign(true);}
}
let mapReady=false;
async function enterCampaign(){
  $('#title').classList.add('hidden');$('#campaign').classList.remove('hidden');
  if(!mapReady){buildRegions();buildRoads();mapReady=true;}
  if(!CM.ok&&!CM.failed&&webglOK()){ // the 3D map; if it can't load, the flat map still works
    $('#cmLoad').classList.remove('hidden');
    try{await loadThree();cmInit();}catch(e){console.error(e);CM.failed=true;}
    $('#cmLoad').classList.add('hidden');
  }
  CM.on=CM.ok;
  $('#mapGL').classList.toggle('hidden',!CM.on);$('#cmLabels').classList.toggle('hidden',!CM.on);$('#mapScroll').classList.toggle('hidden',CM.on);
  $('#busy').classList.toggle('pill',CM.on);document.querySelectorAll('.rot3d').forEach(b=>b.classList.toggle('hidden',!CM.on));
  if(CM.on){cmStart();Object.assign(ct,{d:window.innerWidth<600?520:620,yaw:0});Object.assign(cv,ct);}
  repaintTerritory();if(!CM.on)setZoom(window.innerWidth<600?.82:1.05);render();AU.music('campaign',{fade:2.5});
  requestAnimationFrame(()=>centerOn(G.cap[PLAYER]||'roma'));
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!CM.on)drawMap();});
  setTimeout(()=>loadThree().catch(()=>{}),2500); // warm the cache so battles work offline later
}
async function newCampaign(skipTitle){
  newGame();save();UI.sel=null;UI.move=null;closeSheet();await enterCampaign();
  await modal({title:'Summer, 280 BC',body:`<p>The Senate has given you command of Rome's armies. Rome holds <b>Roma</b> and <b>Capua</b>; Etruscans, Samnites, Gauls, Greek cities and Carthage hold the rest.</p><p>Asculum and Paestum are lightly defended — a good first target. Tap a city to see its army, buildings and recruits.</p>`,buttons:[{label:'Begin',value:1,cls:'primary'},{label:'How to play',value:'h'}]}).then(v=>v==='h'&&modal({title:'How to play',body:HELP,buttons:[{label:'Got it',value:1,cls:'primary'}]}));
}
function laurel(){
  let h='';for(const side of [-1,1])for(let i=0;i<9;i++){const a=Math.PI*(.62+i*.085),x=side*Math.cos(a)*-52,y=Math.sin(a)*-52+18;
    h+=`<ellipse cx="${(x).toFixed(1)}" cy="${(y).toFixed(1)}" rx="9" ry="3.6" fill="#c9a24a" transform="rotate(${(side*(a*180/Math.PI-90)+side*35).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;}
  h+=`<text x="0" y="8" text-anchor="middle" font-family="Cinzel,serif" font-weight="900" font-size="22" fill="#efcd78" letter-spacing="3">SPQR</text>`;
  $('#laurel').innerHTML=h;
}
function sndUI(){const m=AU.mode();document.querySelectorAll('.snd').forEach(b=>{b.textContent=['🔊','🔉','🔇'][m];});}
function initTitle(){
  sndUI();
  $('#tapGate').onclick=()=>{AU.unlock();AU.music('menu',{fade:2.5});$('#tapGate').classList.add('off');$('#title').classList.remove('gated');};
  laurel();const has=loadSave();const b=$('#titleBtns');
  b.innerHTML=(has&&!has.lost?`<button class="btn gold" id="tCont">Continue · turn ${has.turn}</button>`:'')+`<button class="btn ${has&&!has.lost?'ghost':'gold'}" id="tNew">New campaign</button><button class="btn ghost" id="tHelp">How to play</button>`;
  if($('#tCont'))$('#tCont').onclick=()=>{G=has;enterCampaign();};
  $('#tNew').onclick=async()=>{if(has&&!has.lost){const ok=await modal({title:'Start over?',body:'<p>This replaces your saved campaign.</p>',buttons:[{label:'Start a new campaign',value:1,cls:'primary'},{label:'Cancel',value:0}]});if(!ok)return;}newCampaign();};
  $('#tHelp').onclick=()=>modal({title:'How to play',body:HELP,buttons:[{label:'Got it',value:1,cls:'primary'}]});
}

/* ================= WIRING ================= */
$('#mapSvg').addEventListener('click',e=>{const g=e.target.closest('.node');if(g){AU.ui('node');onNode(g.dataset.id);}else if(!UI.move&&UI.sel)closeSheet();});
$('#hintCancel').onclick=cancelMove;
$('#btnEnd').onclick=endTurn;$('#btnNext').onclick=nextArmy;$('#btnMenu').onclick=openMenu;
$('#zIn').onclick=()=>CM.on?cmZoom(.78):setZoom(UI.zoom*1.25);$('#zOut').onclick=()=>CM.on?cmZoom(1.28):setZoom(UI.zoom/1.25);
$('#cRotL').onclick=()=>{ct.yaw-=Math.PI/6;};$('#cRotR').onclick=()=>{ct.yaw+=Math.PI/6;};
let gz=1;const ms=$('#mapScroll');
ms.addEventListener('gesturestart',e=>{e.preventDefault();gz=UI.zoom;});
ms.addEventListener('gesturechange',e=>{e.preventDefault();setZoom(gz*e.scale);});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&!B)save();});
// audio: browsers only allow sound after a tap, so the first tap anywhere unlocks it; every button gets a soft click
for(const ev of['click','touchend','keydown'])document.addEventListener(ev,()=>AU.unlock(),true);
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');if(b&&!b.disabled&&b.id!=='tapGate')AU.ui('tap');},true);
document.querySelectorAll('.snd').forEach(b=>b.onclick=()=>{const m=AU.cycle();sndUI();toast(['Music and effects on','Effects only','Sound off'][m]);});
window.addEventListener('pagehide',()=>{if(G&&!B)save();});
initTitle();
})();
</script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
</html>
